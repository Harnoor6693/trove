name: Bank Source Plugin
description: Add support for a new bank or financial institution
labels: [bank-plugin, enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before starting, read "Contribution types" in [CONTRIBUTING.md](../../CONTRIBUTING.md).
        Bank sources live in `core/src/main/java/finance/trove/ingestion/` since the
        collapse (step 24) — there is no separate `plugins/bank-sources` module, and no
        runtime plugin registry to implement against (see the superseded
        [ADR-0003](../../docs/adr/0003-plugin-architecture.md)).
        Your PR will need 10 sample fixtures and must pass `./mvnw -pl core test`.

  - type: input
    id: institution
    attributes:
      label: Institution name
      placeholder: e.g. Scotiabank, TD Bank, Chase
    validations:
      required: true

  - type: dropdown
    id: country
    attributes:
      label: Country
      options:
        - Canada
        - United States
        - Both
    validations:
      required: true

  - type: dropdown
    id: source-type
    attributes:
      label: Source type
      options:
        - SimpleFIN
        - OFX / QFX file import
        - CSV file import
        - Other
    validations:
      required: true

  - type: textarea
    id: email-pattern
    attributes:
      label: Sample export or file format (redacted)
      description: Paste a redacted example (remove all real account numbers and amounts).
      placeholder: "A CSV header row, or an OFX <STMTTRN> snippet"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Plugin checklist
      options:
        - label: I have 10+ sample fixtures ready under `core/src/test/resources/` (csv/, ofx/ or simplefin/)
        - label: I am willing to maintain this plugin
