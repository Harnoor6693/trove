name: Mobile CI

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'openapi/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'openapi/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job only checks out, installs, tests, and
# uploads artifacts — none needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Check generated API types are up to date
        run: npm run check:generated

      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-results
          path: apps/mobile/junit.xml

      - name: Validate eas.json profiles
        run: npm run test:eas-config

  # Detox needs a macOS runner with a matching Xcode and a native build that
  # currently fails on react-native-screens codegen. Manual-only until the mobile
  # phase rebuilds the native projects (plan step 21).
  detox-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      # Baked into the native build (app.config.ts); the simulator shares the host's network.
      EXPO_PUBLIC_API_BASE_URL: http://localhost:8080
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Install Detox CLI
        run: npm install -g detox-cli@20.51.1

      - name: Select Xcode 26
        # The runner image ships versioned bundles (Xcode_26.0.app, Xcode_26.1.app, ...) and no
        # bare Xcode_26.app, and the set drifts with each image. Take the newest 26.x present.
        run: |
          xcode=""
          for app in /Applications/Xcode_26*.app; do
            [ -d "$app" ] && xcode="$(printf '%s\n%s\n' "$xcode" "$app" | sort -V | tail -n 1)"
          done
          if [ -z "$xcode" ]; then
            echo "::error::No /Applications/Xcode_26*.app on this runner image:"
            printf '%s\n' /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"

      - name: Install applesimutils
        # Detox drives the iOS simulator through it; the runner image does not ship it.
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils

      - name: Build Detox framework cache
        # The cache key includes the Xcode version, and npm ci's postinstall ran under the
        # runner's default Xcode, so rebuild it for the one just selected.
        run: detox clean-framework-cache && detox build-framework-cache

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Detox iOS
        run: npx detox build --configuration ios.sim.debug

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Postgres
        # No Docker on macos-15: Homebrew Postgres, with the role and database the server expects.
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          pgbin="$(brew --prefix postgresql@17)/bin"
          export PATH="$pgbin:$PATH"
          for _ in $(seq 1 30); do pg_isready -q && break; sleep 2; done
          psql -d postgres -c "CREATE ROLE trove LOGIN PASSWORD 'trove'"
          createdb -O trove trove

      - name: Start Trove server
        # Real core server for the app to connect to; see scripts/e2e-server.sh.
        working-directory: .
        run: scripts/e2e-server.sh

      # The debug builds load JavaScript from Metro, so it must be running
      # before Detox launches the app (locally it is the developer's `npm start`).
      - name: Start Metro
        run: |
          nohup npx expo start --port 8081 > metro.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -s http://localhost:8081/status | grep -q packager-status:running && exit 0
            sleep 2
          done
          cat metro.log; exit 1
      - name: Run Detox iOS tests
        run: npx detox test --configuration ios.sim.debug --headless

      - name: Upload Detox iOS artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detox-ios-artifacts
          path: apps/mobile/artifacts/

  detox-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Baked into the native build (app.config.ts); 10.0.2.2 is the emulator's alias for the host.
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trove
          POSTGRES_PASSWORD: trove
          POSTGRES_DB: trove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci


      - name: Install Detox CLI
        run: npm install -g detox-cli@20.51.1

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Detox Android
        run: npx detox build --configuration android.emu.debug

      - name: Start Trove server
        # Real core server for the app to connect to; see scripts/e2e-server.sh.
        working-directory: .
        run: scripts/e2e-server.sh

      # The debug builds load JavaScript from Metro, so it must be running
      # before Detox launches the app (locally it is the developer's `npm start`).
      - name: Start Metro
        run: |
          nohup npx expo start --port 8081 > metro.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -s http://localhost:8081/status | grep -q packager-status:running && exit 0
            sleep 2
          done
          cat metro.log; exit 1
      - name: Run Detox Android tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Expo SDK 58 (RN 0.88: targetSdk 36, compileSdk 37) runs on API 36, and .detoxrc.js boots the AVD by name:
          # keep api-level and avd-name in step with it.
          api-level: 36
          avd-name: Pixel_5_API_36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: cd apps/mobile && (npx detox test --configuration android.emu.debug --headless || { adb logcat -d | grep -iE 'trove|fatal|AndroidRuntime|detox|ReactNative|SoLoader' | tail -200; exit 1; })

      - name: Upload Detox Android artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detox-android-artifacts
          path: apps/mobile/artifacts/
