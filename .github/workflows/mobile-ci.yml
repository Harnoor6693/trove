name: Mobile CI

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'openapi/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'openapi/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job only checks out, installs, tests, and
# uploads artifacts — none needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Check generated API types are up to date
        run: npm run check:generated

      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-results
          path: apps/mobile/junit.xml

      - name: Validate eas.json profiles
        run: npm run test:eas-config

  # Detox needs a macOS runner with a matching Xcode and a native build that
  # currently fails on react-native-screens codegen. Manual-only until the mobile
  # phase rebuilds the native projects (plan step 21).
  detox-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Install Detox CLI
        run: npm install -g detox-cli@20.51.1

      - name: Select Xcode 26
        # The runner image ships versioned bundles (Xcode_26.0.app, Xcode_26.1.app, ...) and no
        # bare Xcode_26.app, and the set drifts with each image. Take the newest 26.x present.
        run: |
          xcode=""
          for app in /Applications/Xcode_26*.app; do
            [ -d "$app" ] && xcode="$(printf '%s\n%s\n' "$xcode" "$app" | sort -V | tail -n 1)"
          done
          if [ -z "$xcode" ]; then
            echo "::error::No /Applications/Xcode_26*.app on this runner image:"
            printf '%s\n' /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Detox iOS
        run: npx detox build --configuration ios.sim.debug

      - name: Run Detox iOS tests
        run: npx detox test --configuration ios.sim.debug --headless

      - name: Upload Detox iOS artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detox-ios-artifacts
          path: apps/mobile/artifacts/

  detox-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci


      - name: Install Detox CLI
        run: npm install -g detox-cli@20.51.1

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Detox Android
        run: npx detox build --configuration android.emu.debug

      - name: Run Detox Android tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Expo SDK 57 needs API 36, and .detoxrc.js boots the AVD by name:
          # keep api-level and avd-name in step with it.
          api-level: 36
          avd-name: Pixel_5_API_36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: cd apps/mobile && npx detox test --configuration android.emu.debug --headless

      - name: Upload Detox Android artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detox-android-artifacts
          path: apps/mobile/artifacts/
