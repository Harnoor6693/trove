name: Web CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - '.github/workflows/web-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job only checks out, installs, tests, and
# uploads artifacts — none needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Check generated API types are up to date
        working-directory: apps/web
        run: npm run check:generated

      - name: Test with coverage
        working-directory: apps/web
        run: npm run test:ci

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7
