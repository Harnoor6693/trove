name: Release

# One core image + one signed sideload APK, published on a semver tag. Sideload
# is the only distribution channel (owner decision, plan step 19/22) — no store
# submission job, no store-credential secret belongs here.

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; only the two publishing jobs below get a write scope.
# The verify job runs the whole Maven test suite and gets nothing more.
# No job here restores a cache: these jobs hold write tokens and EXPO_TOKEN,
# and a cache can be written by any pull-request run.
permissions:
  contents: read

jobs:
  verify:
    name: Verify Before Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate semver tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "WARN: Tag ${GITHUB_REF_NAME} is not a stable semver release (vMAJOR.MINOR.PATCH)"
          else
            echo "OK: ${GITHUB_REF_NAME} is a valid stable release tag"
          fi
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      # The same gate as ci.yml: unit + Testcontainers-backed
      # integration tests, checkstyle, and the jacoco coverage check, scoped to
      # the one module that ships. A release is not cut from a commit that
      # hasn't passed this.
      - name: Build, test, and verify (core)
        run: ./mvnw --batch-mode -pl core -am clean verify checkstyle:check -Pintegration,coverage

  build-and-publish-core:
    name: Build & Publish core image
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build core JAR
        run: ./mvnw --batch-mode -pl core -am package -DskipTests
      - name: Lowercase image name
        # GHCR refuses uppercase repository names; the owner is "Harnoor6693".
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/trove-core" >> "$GITHUB_ENV"
      # `:latest` follows stable releases only. A pre-release tag (anything
      # with a `-`, e.g. v1.0.0-rc1, the same rule the GitHub Release uses to
      # set `prerelease`) is published under its own tag and leaves `:latest`
      # on the last stable image.
      - name: Choose image tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo 'IMAGE_TAGS<<EOF'
            echo "${IMAGE}:${REF_NAME}"
            if [[ "${REF_NAME}" != *-* ]]; then echo "${IMAGE}:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}

  build-sideload-apk:
    name: Build signed sideload APK
    runs-on: ubuntu-latest
    needs: [verify]
    # Only checks out, builds via EAS (auth is EXPO_TOKEN, not GITHUB_TOKEN),
    # downloads the artifact, and uploads a workflow artifact — none of that
    # touches repo contents or GHCR packages, so it needs no write scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      # Pinned so a release never builds with a surprise major. The only
      # constraint is eas.json's cli.version (>= 13.0.0). Raise the pin when a
      # newer eas-cli is needed; apps/mobile/e2e/eas-config.test.ts fails if it
      # stops satisfying eas.json.
      - name: Install EAS CLI
        run: npm install -g eas-cli@24.12.1
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      # eas.json's "production" profile is distribution:"internal" +
      # android.buildType:"apk" — a signed sideload APK, not an AAB for store
      # upload. This only needs EXPO_TOKEN; no Apple/Google secret is read here.
      - name: Build signed APK (EAS)
        working-directory: apps/mobile
        run: eas build --profile production --platform android --non-interactive --json --wait > /tmp/eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Extract build ID and download URL
        id: build
        working-directory: apps/mobile
        run: |
          ID=$(jq -r '.[0].id' /tmp/eas-build.json)
          URL=$(jq -r '.[0].artifacts.buildUrl' /tmp/eas-build.json)
          if [ -z "$ID" ] || [ "$ID" = "null" ] || [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "FAIL: could not extract build ID or artifact URL from EAS output"
            cat /tmp/eas-build.json
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Download the signed APK
        env:
          REF_NAME: ${{ github.ref_name }}
          APK_URL: ${{ steps.build.outputs.url }}
        run: curl -fsSL -o "trove-${REF_NAME}.apk" "${APK_URL}"
      - uses: actions/upload-artifact@v7
        with:
          name: sideload-apk
          path: trove-${{ github.ref_name }}.apk
          retention-days: 90

  release-notes:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-publish-core, build-sideload-apk]
    # Needs contents:write to create the GitHub release; never touches GHCR
    # packages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: sideload-apk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: trove-${{ github.ref_name }}.apk

  # No smoke-test job. Add one only when a script exists that starts the single-image
  # stack (deploy/docker-compose.yml, or scripts/load-stack.sh up) and probes /api/v1/status.
