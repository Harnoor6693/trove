  # -------------------------------------------------------- subscriptions (step 10)
  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: The household's active detected subscriptions
      description: |
        Every non-cancelled `detected_subscription` of the caller's household
        whose charges have not stopped (a next charge more than three whole
        billing cycles overdue hides the row until charges resume), ordered by
        normalised merchant name. One shared ledger per household
        (owner decision), so a household mate sees exactly the same list;
        `createdBy` records the member the detection was attributed to and is
        for audit only, never for scoping.

        Rows here are written **only** by detection — the nightly
        `subscription-scan` job, `POST /v1/subscriptions/scan`, and the listener
        that runs after an import or a sync writes transactions. There is no
        create or update route: a subscription is an observation about the
        ledger, not something a member authors.

        Cancelled rows are excluded. `DELETE /v1/subscriptions/{id}` is a soft
        delete, so a cancelled subscription disappears from this list but is
        still readable by id.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The household's active subscriptions. `data` is a bare array; this
            list is not paged (a household has tens of subscriptions, not
            thousands).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/subscriptions/summary:
    get:
      operationId: getSubscriptionSummary
      tags: [Subscriptions]
      summary: Monthly run-rate and the next fourteen days
      description: |
        An aggregate over the household's active subscriptions.

        **`currency` is the CALLING member's own `users.currency`**, never a
        literal — it says which currency this member reads figures in, and it
        is the only field on this response derived from the caller rather than
        from the household's rows.

        **Money is never blended across currencies.** `byCurrency` carries one
        entry per currency the household actually holds subscriptions in, each
        with its own monthly run-rate; there is no exchange rate anywhere in
        this system, so a household billed in both CAD and USD gets two
        entries and never one converted total. A household whose subscriptions
        are all in one currency simply gets one entry.

        The run-rate normalises each cycle to a month with exact fractions —
        `WEEKLY x 52/12`, `BIWEEKLY x 26/12`, `MONTHLY x 1`, `QUARTERLY / 3`,
        `ANNUAL / 12` — rather than the pre-collapse service's rounded `4.33`
        and `2.17` multipliers.

        `next14Days` groups active subscriptions by their projected next charge
        date over the next fourteen calendar days, counted from the caller's
        own today. A subscription whose projected date has already passed —
        the charge was expected and has not been observed — is NOT in this
        list; it carries the `RED` signal instead.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The household's subscription summary.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/subscriptions/alerts:
    get:
      operationId: listSubscriptionAlerts
      tags: [Subscriptions]
      summary: Unread subscription alerts
      description: |
        The household's unread `subscription_alert` rows, newest first. Alerts
        are written by detection when it notices a price increase; they are
        never deleted, so this feed is the durable record of what changed and
        `PATCH /v1/subscriptions/alerts/{id}/read` is how one leaves it.

        Household-scoped like everything else on this ledger: a household mate
        sees and may acknowledge the same alerts.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The household's unread alerts, `createdAt` descending. `data` is a
            bare array; this list is not paged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionAlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/subscriptions/alerts/{id}/read:
    patch:
      operationId: markSubscriptionAlertRead
      tags: [Subscriptions]
      summary: Acknowledge a subscription alert
      description: |
        Sets `isRead` on one alert, removing it from
        `GET /v1/subscriptions/alerts`. The row itself is retained — alerts are
        an audit trail and are never deleted.

        Idempotent: acknowledging an already-read alert succeeds and returns
        the same row rather than conflicting.

        Resolved inside the caller's own household, so an id belonging to
        another household is 404 and never 403.

        Takes no request body.
      parameters:
        - $ref: '#/components/parameters/SubscriptionAlertIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The alert after the write, with `isRead` true.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionAlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/subscriptions/scan:
    post:
      operationId: scanSubscriptions
      tags: [Subscriptions]
      summary: Run detection for this household now
      description: |
        Runs the same `SubscriptionDetectionService.detectForHousehold` the
        nightly `subscription-scan` job runs, synchronously, for the CALLER'S
        OWN household only — the household comes from the signed token and
        there is no way to name another one.

        **This route exists because the pre-collapse feature could never detect
        its first subscription.** The old nightly job enumerated the users who
        already had a row in `detected_subscription`, so on a fresh install the
        table was empty, nobody was scanned, nothing was written, and the table
        was still empty the next night. The job now enumerates households with
        transactions, and this is the manual trigger that was missing entirely.

        Detection reads the household's DEBIT transactions inside the detection
        window, set by `trove.subscriptions.detection-window` (transfer legs
        excluded), groups them by normalised merchant, classifies the cadence and upserts one row per merchant with
        `INSERT ... ON CONFLICT (household_id, merchant_name) DO UPDATE`. It is
        therefore **idempotent**: running it twice over unchanged history leaves
        every row's amount, cycle and next-charge date exactly as they were, and
        running it beside the nightly job cannot produce a duplicate row.

        Takes no request body. Answers with the household's active
        subscriptions as they stand after the scan, which is the same body
        `GET /v1/subscriptions` would return.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The household's active subscriptions after the scan. `data` is a
            bare array; not paged. 200 rather than 201 — the scan creates no
            single named resource, and re-running it usually creates nothing
            at all.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [Subscriptions]
      summary: One detected subscription
      description: |
        Resolved inside the caller's own household, so an id belonging to
        another household is 404 and never 403.

        A CANCELLED subscription is still readable here — see the `delete`
        operation below — and answers with `cancelled: true`.
      parameters:
        - $ref: '#/components/parameters/SubscriptionIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The subscription.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: cancelSubscription
      tags: [Subscriptions]
      summary: Dismiss a detected subscription (SOFT delete — the row survives)
      description: |
        **This DELETE does not remove anything.** It sets
        `detected_subscription.is_cancelled` to true. The row stays in the
        database and stays readable at `GET /v1/subscriptions/{id}`, where it
        answers 200 with `cancelled: true`; it merely leaves
        `GET /v1/subscriptions`, the summary's run-rate and the upcoming-charge
        list. This is stated plainly because a DELETE whose resource is still
        readable afterwards surprises every client that has not been told.

        The reason it is a soft delete is that the row is a detection, not a
        subscription: a hard delete would simply be re-detected by the next
        scan, and the member would have to dismiss the same merchant every
        night. The flag is what makes "I know about this one, stop showing me"
        stick — the scan keeps the row's figures current but never un-cancels
        it, and never raises an alert or publishes a price-change event for it.

        Idempotent: dismissing an already-cancelled subscription succeeds.

        Resolved inside the caller's own household, so an id belonging to
        another household is 404 and never 403.
      parameters:
        - $ref: '#/components/parameters/SubscriptionIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The subscription is dismissed. The row still exists and is still
            readable by id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ---------------------------------------------------------------- budgets and goals (step 8)
  /v1/budgets:
    get:
      operationId: listBudgetPeriods
      tags: [Budgets]
      summary: The household's budget periods
      description: |
        Every budget period the caller's household has, newest month first.
        One shared ledger per household (owner decision): a household mate sees
        the same list, and `createdBy` records who created the period for audit
        only, never for scoping.

        This list is not paged. A household accumulates twelve rows a year, so
        the unbounded-growth risk is recorded (inventory BUD-01) rather than
        pre-solved with a pagination contract clients would have to adopt now.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The household's budget periods, `month` descending. `data` is a bare array; this list is not paged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetPeriodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createBudgetPeriod
      tags: [Budgets]
      summary: Open a budget period for a month
      description: |
        Creates one `budget_period` for the caller's household. `month` may name
        any day inside the target calendar month; the server normalises it to
        the first of that month before storing, which is what the uniqueness
        constraint relies on.

        **One period per household per month.** Under the shared-ledger
        decision two members must not each own a January, so a second period for
        a month the household already has is 409 `conflict` — not a second row.

        `currency` defaults to the CREATING member's own `users.currency` when
        omitted; there is no server-side currency literal anywhere (§9 risk 5,
        finding F1). `budgetType` defaults to `FLEXIBLE`.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPeriodRequest'
      responses:
        '201':
          description: The created period. `month` comes back normalised to the first of the month.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetPeriodResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/budgets/current:
    get:
      operationId: getCurrentBudgetPeriod
      tags: [Budgets]
      summary: This month's budget period
      description: |
        The household's period for the month it is **right now in the CALLER's
        own timezone** (`users.timezone`, through `UserClock`). Two members of
        one household in Vancouver and Toronto can therefore be shown different
        months for a few hours around a month boundary, which is the correct
        answer for each of them; the pre-collapse service resolved this against
        the container's UTC clock, so a Vancouver member's month rolled over at
        16:00 on the 31st (gap P2-15).

        **A month with no period is 404, not an empty 200** (§4.6): the caller
        asked for a resource, and a 200 carrying nothing would force every
        client to distinguish "no budget yet" from "a budget with no envelopes"
        by inspecting the body.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The period covering the caller's current month.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetPeriodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/budgets/{id}:
    get:
      operationId: getBudgetPeriod
      tags: [Budgets]
      summary: One budget period
      description: |
        Resolved inside the caller's own household, so an id belonging to
        another household is 404 and never 403 (§9 risk 2).
      parameters:
        - $ref: '#/components/parameters/BudgetPeriodIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The period.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetPeriodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateBudgetPeriod
      tags: [Budgets]
      summary: Change a period's income or type
      description: |
        A full replace of the two mutable fields — both are required. `month`
        and `currency` are not writable: the month is the period's identity
        within the household, and re-denominating an existing period would
        silently reinterpret every envelope figure already recorded under it.

        On a `ZERO_BASED` period the envelope allocations must still sum to
        `totalIncome` after the write; a `totalIncome` that breaks that is 400
        `validation-error` naming the field, not a 409 — retrying the same body
        would fail for ever, so the client has to change what it sent.
      parameters:
        - $ref: '#/components/parameters/BudgetPeriodIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPeriodUpdateRequest'
      responses:
        '200':
          description: The period after the write.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetPeriodResponse'
        '400':
