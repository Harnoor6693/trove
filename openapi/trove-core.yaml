  /v1/tax-export/lines:
    get:
      operationId: listTaxLines
      tags: [Tax export]
      summary: The caller's effective category-to-tax-line map
      description: |
        One entry per category the caller can see (every system category plus
        their own household's), carrying the tax line that category's amounts
        will be exported under.

        **The map is resolved per member, not per household.** A filing is
        individual, so each row is the caller's own override when they have
        written one for this jurisdiction and category, and the install-wide
        seed otherwise. A household mate's override is never visible here and
        never affects this caller's export.

        A category with no row at all is still returned, with `lineCode` and
        `lineLabel` empty and `deductible` false: it is exported as an ordinary
        row with empty tax-line cells rather than being dropped, because a
        transaction that vanishes from a tax export because nobody wrote a label
        for its category is a silent loss.

        `jurisdiction` selects which of the two seeded sets to resolve. It
        defaults to the caller's own `users.country`, which is also the
        jurisdiction every export run is stamped with.

        Line codes and labels are **strings a human reads off a form**. Nothing
        in this API carries a rate, a bracket or a computed tax figure.
      parameters:
        - $ref: '#/components/parameters/TaxJurisdictionQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            Every visible category with its effective tax line, ordered by
            category name. `data` is a bare array; this list is not paged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaxLineMappingResponse'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/tax-export/lines/{categoryId}:
    put:
      operationId: setTaxLine
      tags: [Tax export]
      summary: Override the tax line for one category
      description: |
        Writes **the caller's own** mapping row for `(jurisdiction, categoryId)`,
        creating it or replacing it. It shadows the install-wide seed for this
        member only; a household mate's export is unchanged.

        The category must be one the caller can see — a system category or one
        of their own household's. Any other id, including a category belonging
        to another household, is 404 and never 403.

        `lineCode` and `lineLabel` are free text the member copies off a form;
        the server stores them verbatim and never interprets them. `deductible`
        is the member's own assertion about the line and is carried into the
        export as a label, never into a calculation.
      parameters:
        - $ref: '#/components/parameters/CategoryIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxLineMappingRequest'
      responses:
        '200':
          description: The category's effective line after the write — always the caller's own row.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaxLineMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/tax-export/runs:
    get:
      operationId: listTaxExportRuns
      tags: [Tax export]
      summary: The caller's own export runs
      description: |
        A page of the caller's export runs, newest first.

        **Scoped to the member, not the household.** A tax filing is individual,
        so a household mate's runs are not in this list and are not reachable by
        id either — the opposite of every ledger route on this API.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: One page of the caller's runs, with `meta` carrying the totals.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaxExportRunResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createTaxExportRun
      tags: [Tax export]
      summary: Start a tax-year export
      description: |
        Records a run as `PENDING` and hands the generation to a bounded
        background executor, then answers **202** immediately with the row. Poll
        `GET /v1/tax-export/runs/{id}` until `status` is `COMPLETE`, then
        download it.

        **What ends up in the file.** The window is the whole tax year —
        1 January to 31 December inclusive — read as *dates*, so two members in
        different timezones asking for the same year get exactly the same
        window. The rows are the **household's** ledger for that window with
        internal transfer legs excluded, because the ledger is shared; the
        **run** belongs to the caller alone. A member's export therefore
        contains their household mates' spending, and the client should say so
        before the download.

        **`jurisdiction` is not a parameter.** It is taken from the caller's own
        `users.country` and stamped onto the row, so a completed run stays
        reproducible from the row alone even after the member changes their
        country.

        `taxYear` may not be in the future: the upper bound is the current year
        in the caller's own timezone, not the server's. A year outside the
        accepted range is 400 `validation-error`.

        If the executor's queue is full the row is flipped to `FAILED` before
        this response is sent — the answer is still 202 and still carries a
        real, queryable id, with `status` `FAILED` and an `errorMessage`.

        Nothing here computes a tax figure. No rate, no bracket, no GST split.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxExportRunRequest'
      responses:
        '202':
          description: |
            The run was recorded. `status` is `PENDING` normally, or `FAILED`
            when the executor refused the work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaxExportRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/tax-export/runs/{id}:
    get:
      operationId: getTaxExportRun
      tags: [Tax export]
      summary: One export run
      description: |
        The poll target while a run is generating.

        Resolved against the **caller's own** runs. A run belonging to anybody
        else — a household mate included — is 404, never 403, so the answer
        never confirms that another member's id is real.
      parameters:
        - $ref: '#/components/parameters/TaxExportRunIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The run as it stands now.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaxExportRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteTaxExportRun
      tags: [Tax export]
      summary: Delete an export run and its file
      description: |
        Removes the row and the generated file together. Safe in any status,
        including `PENDING` and `FAILED`.

        Resolved against the caller's own runs; anybody else's id, a household
        mate's included, is 404.
      parameters:
        - $ref: '#/components/parameters/TaxExportRunIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The run and its file are gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/tax-export/runs/{id}/download:
    get:
      operationId: downloadTaxExportRun
      tags: [Tax export]
      summary: Download a completed export
      description: |
        Streams the generated file. **The one non-JSON response on this API** —
        `text/csv` for a `CSV` run and `application/pdf` for a `PDF` run,
        decided by the run's own `format`, with `Content-Disposition:
        attachment` and `X-Content-Type-Options: nosniff`. The bytes are served
        from the server's own data volume; nothing is presigned and no URL to
        any storage system is ever handed out.

        Resolved against the caller's own runs; anybody else's id, a household
        mate's included, is 404.

        A run that is not yet `COMPLETE` is **409 `conflict`**, not 404: the run
        exists and belongs to the caller, and telling a polling client "no such
        run" would make it discard state it should keep. `PENDING`,
        `GENERATING` and `FAILED` all answer 409.
      parameters:
        - $ref: '#/components/parameters/TaxExportRunIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The file. `Content-Type` is `text/csv` or `application/pdf`
            according to the run's `format`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionAttachment'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExportNotReady'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

# =============================================================================

  # ------------------------------------------------------- notifications (§4.9)
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: The caller's own notification inbox
      description: |
        One page of the caller's undismissed notifications, newest first.

        **Per member, not per household.** This is one of the areas of this API
        where a household mate is refused rather than served: the
        ledger is shared, but a notification is addressed to one person and
        another member's inbox is 404, never 403. The rows are written by
        `NotificationService` on the events the ledger raises — an envelope
        crossing that member's own alert threshold, a detected price change, a
        failed account sync — and by the Monday digest.

        Dismissing a notification (`DELETE /v1/notifications/{id}`) removes it
        from this list permanently; the row itself is retained, so this is a
        hide rather than a delete.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            One page of the caller's undismissed notifications. `meta` carries
            the totals, so a client renders its page controls from the same
            fetch that rendered the rows.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [Notifications]
      summary: How many unread notifications the caller has
      description: |
        The number of the caller's notifications that are neither read nor
        dismissed — the number a bell badge shows.

        This is also the whole of the mobile notification story. There is no
        push channel and no device registration on this API (owner decision,
        2026-09-03: no push until a direct APNs/FCM path exists, no Expo
        relay); the mobile client polls this route on foreground and
        background-fetch and raises a client-local notification from the
        result. `POST /v1/notifications/devices` and
        `DELETE /v1/notifications/devices/{token}` were dropped from the plan
        for that reason and are deliberately absent.

        An object rather than a bare number so that the field has a name in
        every generated client.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The caller's unread, undismissed count.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark one notification read
      description: |
        Sets `read` and stamps `readAt`, removing the notification from the
        unread count. The row stays in the inbox until it is dismissed.

        Idempotent: marking an already-read notification succeeds and returns
        the same row, with the original `readAt`, rather than conflicting.

        Resolved against the **caller's own** notifications. A row belonging to
        another member — a household mate included — is 404 rather than 403,
        because a notification is addressed to one person.

        Takes no request body.
      parameters:
        - $ref: '#/components/parameters/NotificationIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The notification after the write, with `read` true.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark every unread notification read
      description: |
        Marks every one of the caller's unread, undismissed notifications read
        in a single statement, and answers with how many rows that was — the
        number is what lets a client decrement its badge without a second
        fetch.

        Acts on the caller and only on the caller; there is no parameter here
        that names a user.

        Takes no request body. Calling it with nothing unread succeeds and
        answers `marked: 0`.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: How many notifications this call marked read.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MarkedReadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      summary: The caller's own notification preferences
      description: |
        The caller's preferences, **created with the shipped defaults on first
        access** so that a settings screen renders identically on the first
        visit and the hundredth.

        There is no push field of any kind here — no `pushEnabled`, no device
        token — and there never will be while the owner decision of 2026-09-03
        stands: no push notifications until a direct APNs/FCM path exists, and
        no Expo relay.

        `emailEnabled` defaults to **false**. The email channel is built and
        unit-tested but is off on every install until SMTP is configured
        (`trove.notifications.smtp-enabled`), so defaulting it on would promise
        a delivery this server cannot make.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The caller's preferences, created on first access.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      summary: Change some of the caller's notification preferences
      description: |
        **A partial update, despite the verb.** Every field of the body is
        optional and an omitted one is left exactly as it was; only the fields
        present are written. `PUT` rather than `PATCH` is what the pre-collapse
        clients already call and what §4.9 pins, so the verb is kept and the
        semantics are stated here instead of being guessed at.

        An explicit `null` for `emailAddress` clears the stored address, which
        is the only way to unset it. For every other field `null` is
        indistinguishable from omitting it.

        Enabling `emailEnabled` without an `emailAddress` is accepted and does
        nothing: the email channel skips a member with no address, and refusing
        the write would make the two fields order-dependent in a settings form.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdateRequest'
      responses:
        '200':
          description: The whole preference resource after the write.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/{id}:
    delete:
      operationId: dismissNotification
      tags: [Notifications]
      summary: Dismiss a notification
      description: |
        Hides one notification: `GET /v1/notifications` stops returning it and
        it stops counting towards `GET /v1/notifications/unread-count`. The row
        is retained with a `dismissedAt` stamp — the inbox is the durable record
        of what this server told a member, and a member must not be able to
        erase it by clicking twice.

        Idempotent: dismissing an already-dismissed notification succeeds.

        Resolved against the **caller's own** notifications; another member's is
        404 rather than 403.
      parameters:
        - $ref: '#/components/parameters/NotificationIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The notification is dismissed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ------------------------------------------------------------ webhooks (§4.9)
  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: The caller's own webhook subscriptions
      description: |
        Every webhook subscription the caller owns, disabled ones included.

        **Per member, not per household**: a subscription points at a URL that
        member controls and is signed with a secret only that member holds, so
        a household mate's subscriptions are not listed here and are 404 by id.

        The shared signing secret is never returned, in any form — not masked,
        not truncated, not as a length. `hasSecret` is the whole of what this
        API says about it, the same way `hasApiKey` is for the per-member AI
        endpoint.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The caller's subscriptions, oldest first. `data` is a bare array;
            this list is capped by the per-member subscription limit rather
            than paged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Subscribe a URL to this member's events
      description: |
        Registers an HTTPS endpoint this server will POST to when one of the
        caller's subscribed events happens.

        **`targetUrl` is checked by the shared egress policy, and it is checked
        again on every delivery attempt.** A refusal here is 400
        `outbound-url-rejected`. A refusal for the URL's shape (the scheme,
        credentials before the host) names that rule; every refusal by address,
        including a name that does not resolve, reads the same and names neither
        the address nor its range, which would turn this route into an internal
        network probe. Re-checking at delivery time is what closes the DNS-rebinding
        window: a name that answers a public address while you are saving it
        and a private one an hour later is refused at the second point, and the
        HTTP client connects to the address the policy approved rather than
        resolving the name a second time of its own accord.

        **`secret` is write-only.** It is encrypted at rest with the same
        AES-GCM field encryption the AI API key and the SimpleFIN access URL
        use, it appears in no response schema, and it is never logged.

        **Every delivery is signed in the Standard Webhooks scheme**
        (https://www.standardwebhooks.com, symmetric `v1`). Headers:
        `webhook-id` (the delivery id, stable across retries so a receiver can
        deduplicate), `webhook-timestamp` (Unix seconds of this attempt),
        `webhook-signature` (`v1,<base64>`, an HMAC-SHA256 keyed with the UTF-8
        bytes of `secret` over `<webhook-id>.<webhook-timestamp>.<raw body>`)
        and `X-Trove-Event` (the event type). A receiver recomputes the HMAC
        over the exact bytes it received, compares in constant time, and
        refuses a `webhook-timestamp` more than five minutes from its own
        clock: that window is what makes a captured delivery useless for a
        replay. Standard Webhooks libraries take a base64 `whsec_` secret by
        default; pass this secret's raw UTF-8 bytes instead. This replaced
        `X-Trove-Signature: sha256=<hex>` over the body alone, which signed
        neither the id nor a time.

        Deliveries are retried with exponential backoff — 2^n seconds, five
        attempts — and a subscription that never succeeds is left `EXHAUSTED`
        rather than retried for ever.

        A member may hold at most twenty subscriptions
        (`trove.notifications.max-webhooks-per-user`); the twenty-first is 409
        `conflict`. Every subscription is an outbound connection this server
        makes on that member's behalf, so the number is capped rather than
        unbounded.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: The subscription as created. The secret is not echoed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/WebhookRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Remove a webhook subscription
      description: |
        Deletes the subscription and, by cascade, every delivery-log row that
        belongs to it, including any still queued for retry.

        Resolved against the **caller's own** subscriptions; a household mate's
        is 404 rather than 403.
      parameters:
        - $ref: '#/components/parameters/WebhookIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The subscription is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ------------------------------------------------------------ receipts (§4.10)
  /v1/receipts/upload:
    post:
      operationId: uploadReceipt
      tags: [Receipts]
      summary: Upload a receipt image
      description: |
        Stores a receipt photograph and starts processing it. The answer is
        **202** and carries `{id, status, createdAt}` and nothing else — not a
        full receipt. That shape is stated deliberately: the row exists the
        moment this returns, but the fields on it do not yet, and handing back
        an almost-empty receipt would invite a client to render it. Poll
        `GET /v1/receipts/{id}/status`, or fetch the whole row from
        `GET /v1/receipts/{id}`.

        **Only JPEG and PNG are accepted.** The declared content type must be
        `image/jpeg` or `image/png` *and* the first bytes must agree with it.
        HEIC is refused here on purpose — the mobile client converts before it
        uploads — and PDF is not accepted in this version at all.

        **The bytes that are stored are not the bytes that were sent.** Every
        accepted image is re-encoded to JPEG at quality 85, at most 2000 px on
        its long edge, and only that re-encoding is written to disk. The
        original is never stored, which is what removes EXIF — the GPS
        coordinates a phone camera writes into a receipt photograph included —
        by construction rather than by a tag-stripping library that might miss
        one. A consequence worth stating: the file this operation stores is
        always `image/jpeg`, whatever was sent, and that is what
        `GET /v1/receipts/{id}/download` serves back.

        413 `upload-too-large` is one of three ceilings, all answering the same
        slug because from a client's point of view there is one refusal: the
        container's multipart cap, this operation's own per-file cap, and the
        household's total receipt-storage quota. The last two are checked
        against the part's **declared** size before its bytes are read, so a
        client that is over either one is refused without the server decoding
        anything. The quota is then re-checked exactly, against the size of the
        re-encoded pair that is about to be written, because those bytes and not
        the upload are what occupy the volume; that second check can only refuse
        an upload the first one would also have refused.

        400 `validation-error` covers everything else: an empty part, a content
        type this operation does not accept, bytes that are not the format they
        claim to be, an image whose header declares more pixels than the server
        will decode, or an image that is not decodable at all. Nothing derived
        from the uploaded filename ever reaches a path — the storage key is
        generated server-side.

        **What happens next depends on the uploader's own AI settings.** With a
        vision model configured, the extraction pipeline runs in the background
        and the status walks forward through its stages. Without one — the
        default on every install — the receipt goes straight to `COMPLETE` with
        `reviewRequired: true` and the member fills the fields in through
        `PATCH /v1/receipts/{id}`. That is the ordinary outcome, not an error,
        and it is never a 4xx.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The receipt image. Declared content type must be
                    `image/jpeg` or `image/png`, and the first bytes must match
                    it.
                source:
                  $ref: '#/components/schemas/ReceiptSource'
      responses:
        '202':
          description: |
            The receipt row exists and the image is stored. Its fields are not
            filled in yet, and on an install with no vision model they never
            will be by the server.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/receipts:
    get:
      operationId: listReceipts
      tags: [Receipts]
      summary: List the household's receipts
      description: |
        One page of the household's receipts, newest first. **Paged, and the
        page is the envelope's `data` with its totals in `meta`** — there is no
        bare array on this API, and an unbounded receipts list would get slower
        for the whole install for ever.

        A receipt is shared ledger data: every member of the household sees
        every receipt, whoever uploaded it. The uploader is recorded on the row
        but is not the scope.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: One page of the household's receipts, with its totals in `meta`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReceiptSummaryResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/receipts/{id}:
    get:
      operationId: getReceipt
      tags: [Receipts]
      summary: One receipt in full
      description: |
        The whole row, including its extracted line items and the **path** to
        its thumbnail. `thumbnailUrl` is a path on this API and never an
        absolute URL, never a presigned link and never a data URI: the bytes
        are behind an authenticated route like everything else.

        Resolved inside the caller's household — an id from another household
        is 404, never 403.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The receipt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchReceipt
      tags: [Receipts]
      summary: Fill in a receipt's fields by hand, and link a transaction
      description: |
        The manual path, and on an install with no vision model it is the only
        path. Every field is optional; an absent field is left alone and a
        present one is written. There is no way to clear a field back to null
        through this operation.

        `matchedTransactionId` links the receipt to a transaction of the same
        household. **Both halves of the link are written in one transaction** —
        `receipt.matchedTransactionId` and the transaction's own `receiptId` —
        so the two can never disagree. An id that is not this household's
        transaction is 404. Linking a receipt that is already linked moves the
        link: the previously linked transaction's `receiptId` is cleared in the
        same transaction.

        A receipt whose pipeline is still running is **409 `conflict`**: the
        pipeline would overwrite whatever was just written. Wait for
        `COMPLETE` or `FAILED`.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptPatchRequest'
      responses:
        '200':
          description: The receipt after the write.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteReceipt
      tags: [Receipts]
      summary: Delete a receipt and its stored images
      description: |
        Removes the receipt row, its line items, its image rows **and the files
        on the server's data volume behind them**. A receipt whose row is gone
        but whose JPEG is still on disk is the beginning of unbounded disk
        growth, so the two go together.

        If the receipt was linked to a transaction, that transaction's
        `receiptId` is cleared in the same transaction as the delete.

        Resolved inside the caller's household; another household's id is 404.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The receipt and its files are gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/receipts/{id}/status:
    get:
      operationId: getReceiptStatus
      tags: [Receipts]
      summary: Poll a receipt's processing status
      description: |
        The four fields a polling client needs and nothing else, so that
        polling a receipt through its pipeline costs a fraction of fetching the
        whole row each time.

        `COMPLETE` and `FAILED` are the terminal statuses; stop polling on
        either. `COMPLETE` with `reviewRequired: true` is the ordinary outcome
        on an install with no vision model.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The receipt's current status.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/receipts/{id}/review:
    patch:
      operationId: reviewReceipt
      tags: [Receipts]
      summary: Accept or reject a receipt's extracted fields
      description: |
        The reviewer's verdict on what the server extracted. `accepted: true`
        clears `reviewRequired`; `accepted: false` marks the receipt `FAILED`,
        which is the member saying the extraction is not worth correcting — the
        image is still stored and still downloadable.

        Corrections do not go here: `PATCH /v1/receipts/{id}` writes fields, and
        this operation records a decision. A receipt whose pipeline is still
        running is **409 `conflict`**, for the same reason it is on the other
        patch.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptReviewRequest'
      responses:
        '200':
          description: The receipt after the decision.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/receipts/{id}/download:
    get:
      operationId: downloadReceipt
      tags: [Receipts]
      summary: Download the stored receipt image
      description: |
        Streams the stored image. It is always `image/jpeg`, because every
        accepted upload is re-encoded to JPEG before it is written — the
        format the client sent is not the format that is kept.

        `Content-Disposition: attachment` with a server-built filename, and
        `X-Content-Type-Options: nosniff`. Both matter here rather than being
        boilerplate: an image served inline from the application's own origin,
        whose bytes turn out to be something other than the type the header
        claims, is a stored cross-site scripting vector against this very API.

        **Authenticated like every other route.** Nothing is presigned, there
        is no public path and there is no token in a query string. Resolved
        inside the caller's household, so a household mate can download it and
        another household's id is 404.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The stored JPEG.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionAttachment'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/receipts/{id}/thumbnail:
    get:
      operationId: getReceiptThumbnail
      tags: [Receipts]
      summary: Download the receipt's thumbnail
      description: |
        The small JPEG a list view renders. **Authenticated**, deliberately:
        this is a photograph of the household's spending, and an unauthenticated
        image path would be a way to read it without a session. A mobile client
        must therefore fetch the bytes with its own credentials rather than
        handing the path to an image component, and `ReceiptResponse.thumbnailUrl`
        is exactly this path.

        `X-Content-Type-Options: nosniff`, for the reason the download states.
        `Content-Disposition` is **not** sent here: a thumbnail is meant to be
        rendered, not saved.

        404 when the receipt is not this household's, and also when the receipt
        has no thumbnail row — which cannot happen for an upload this version
        accepted, but can for a row whose files were removed underneath it.
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The thumbnail JPEG.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  # ---------------------------------------------------------------- security
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-trove_access
      description: |
        Cookie mode — what the web client uses. The access token lives in
        `__Host-trove_access` (HttpOnly, Secure, SameSite=Lax, Path=/), planted by
        any operation that opens or rotates a session while
        `X-Trove-Auth-Mode: cookie` is set. Because the browser attaches it by
        itself, every mutating request in this mode must also carry the CSRF
        double-submit token (`X-XSRF-TOKEN`) and `X-Requested-With: XMLHttpRequest`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer mode — the default when `X-Trove-Auth-Mode` is absent, and what
        the mobile client uses. The access token comes back in the login body and
        is sent as `Authorization: Bearer <token>`. Bearer requests are exempt
        from CSRF: a third-party page cannot set this header, so there is nothing
        to ride.

        The token is a short-lived (15 minute) HMAC-signed JWT (HS256 to HS512,
        set by the length of `TROVE_JWT_SECRET`; HS256 for a 32-byte secret)
        carrying the refresh
        family it belongs to, and it stops being accepted the moment that family
        is revoked — a logout, a password change on another device, a redeemed
        reset link or a detected replay all take effect at the caller's next
        request rather than at the end of the token's lifetime.

  # ---------------------------------------------------------------- parameters
  parameters:
    AuthModeHeader:
      name: X-Trove-Auth-Mode
      in: header
      required: false
      description: |
        Which carrier the session should use. `cookie` makes the server set
        `__Host-trove_access` / `__Host-trove_refresh` and omit the tokens from
        the body; `bearer` puts the tokens in the body and sets no cookies.

        **Absent means `bearer`** — the header is compared case-insensitively
        against the literal `cookie` and anything else, including nothing, is
        bearer. The mobile client relies on that and sends no header.

        On `POST /v1/auth/refresh` this header only decides the answer when the
        refresh token arrived in the request body; a token that came from the
        cookie is always answered in cookie mode.
      schema:
        type: string
        enum: [cookie, bearer]
        default: bearer
        example: cookie
    RequestedWithHeader:
      name: X-Requested-With
      in: header
      required: false
      description: |
        Must be exactly `XMLHttpRequest` on a mutating request that was
        authenticated by cookie. Missing it is 403 `csrf-header-missing`. Bearer
        callers are not checked (the mobile client sends it anyway).
      schema:
        type: string
        enum: [XMLHttpRequest]
        example: XMLHttpRequest
    XsrfTokenHeader:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: |
        The CSRF double-submit token, echoing the value of the non-HttpOnly
        `XSRF-TOKEN` cookie the server plants on the first request. Required on
        any mutating request that carries a session cookie or declares
        `X-Trove-Auth-Mode: cookie`; a missing or stale token is 403 `forbidden`.
        Bearer callers omit it.
      schema:
        type: string
        example: 11111111-2222-4333-8444-555555555555
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: |
        An optional caller-supplied correlation id. It is honoured **only if it
        parses as a UUID**, otherwise the server generates one; either way the id
        in force comes back in the `X-Request-Id` response header and in
        `error.requestId`.
      schema:
        type: string
        format: uuid
        example: 99999999-8888-4777-8666-555555555555
    XsrfCookie:
      name: XSRF-TOKEN
      in: cookie
      required: false
      description: |
        The readable half of the CSRF double-submit pair (not HttpOnly, Secure,
        Path=/). The browser sends it automatically; the client's job is to copy
        it into `X-XSRF-TOKEN`.
      schema:
        type: string
        example: 11111111-2222-4333-8444-555555555555
    AccessCookie:
      name: __Host-trove_access
      in: cookie
      required: false
      description: |
        The cookie-mode access token (HttpOnly, Secure, SameSite=Lax, Path=/,
        Max-Age tied to the refresh token's remaining life). Present instead of
        `Authorization: Bearer` for browser callers.
      schema:
        type: string
        example: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-ACCESS-TOKEN.not-a-real-signature
    RefreshCookie:
      name: __Host-trove_refresh
      in: cookie
      required: false
      description: |
        The cookie-mode refresh token (HttpOnly, Secure, SameSite=Lax, Path=/).
        `POST /v1/auth/refresh` and `POST /v1/auth/logout` read it when the
        request body carries no token.
      schema:
        type: string
        example: cmVmcmVzaC10b2tlbi1FWEFNUExFLW5vdC1yZWFs
    TotpChallengeCookie:
      name: __Host-trove_totp_challenge
      in: cookie
      required: false
      description: |
        A 60-second challenge token (HttpOnly, Secure, SameSite=Lax, Path=/) left
        by the OIDC callback when the account it signed in has TOTP enabled. It
        exists because that flow is a browser redirect: no client code held the
        `challengeToken` a password login would have returned. Read only when
        `challengeToken` is absent from the request body, and cleared by a
        successful `POST /v1/auth/login/totp`.
      schema:
        type: string
        example: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-TOTP-CHALLENGE.not-a-real-signature
    UserIdPath:
      name: id
      in: path
      required: true
      description: |
        The target member's id. Resolved inside the caller's own household, so an
        id from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-000000000002
    PageQuery:
      name: page
      in: query
      required: false
      description: |
        Zero-based page index. Out-of-range values are rejected rather than
        clamped, so a client that computed one wrongly is told rather than
        silently shown page zero.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
        example: 0
    LimitQuery:
      name: limit
      in: query
      required: false
      description: |
        Rows per page. Capped server-side: an audit table grows without bound and
        an unbounded page would get slower for the whole install, for ever.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
        example: 50

    AccountIdPath:
      name: id
      in: path
      required: true
      description: |
        The account's id, resolved inside the caller's own household — an id
        from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000a1
    ImportIdPath:
      name: id
      in: path
      required: true
      description: |
        The import batch's id, resolved inside the caller's own household — an id
        from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000d1
    TransactionIdPath:
      name: id
      in: path
      required: true
      description: |
        The transaction's id, resolved inside the caller's own household — an id
        from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000b1
    AssetIdPath:
      name: id
      in: path
      required: true
      description: |
        The asset's id, resolved inside the caller's own household — an id
        from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000c1
    LiabilityIdPath:
      name: id
      in: path
      required: true
      description: |
        The liability's id, resolved inside the caller's own household — an id
        from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000d1

    SubscriptionIdPath:
      name: id
      in: path
      required: true
      description: |
        The detected subscription's id, resolved inside the caller's own
        household — an id from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000f1
    SubscriptionAlertIdPath:
      name: id
      in: path
      required: true
      description: |
        The subscription alert's id, resolved inside the caller's own
        household — an id from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000f9
    BudgetPeriodIdPath:
      name: id
      in: path
      required: true
      description: |
        The budget period's id, resolved inside the caller's own household — an
        id from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000e1
    EnvelopeIdPath:
      name: envelopeId
      in: path
      required: true
      description: |
        The envelope's id. It must belong to the period named earlier in the
        path as well as to the caller's own household; a mismatched pair is 404.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000e2
    GoalIdPath:
      name: id
      in: path
      required: true
      description: |
        The savings goal's id, resolved inside the caller's own household — an
        id from another household is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000e3

    TaxJurisdictionQuery:
      name: jurisdiction
      in: query
      required: false
      description: |
        Which seeded line set to resolve. Omitted means the caller's own
        `users.country`, which is also the jurisdiction every export run they
        start is stamped with. Anything outside the enum is 400
        `validation-error`.
      schema:
        $ref: '#/components/schemas/CountryCode'
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      description: |
        The category to map. Must be a system category or one of the caller's
        own household's — any other id is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000f1
    TaxExportRunIdPath:
      name: id
      in: path
      required: true
      description: |
        The export run's id, resolved against the **caller's own** runs. A run
        belonging to another member — a household mate included — is 404 rather
        than 403, because a tax filing is individual.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000a9
    DataExportRunIdPath:
      name: id
      in: path
      required: true
      description: |
        The data-export run's id, resolved against the **caller's own** runs. A
        run belonging to another member — a household mate included — is 404
        rather than 403, because an archive is one person's whole financial life.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000e1
    NotificationIdPath:
      name: id
      in: path
      required: true
      description: |
        The notification's id, resolved against the **caller's own**
        notifications. A row belonging to another member — a household mate
        included — is 404 rather than 403, because a notification is addressed
        to one person and the inbox is not shared ledger data.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000b7
    WebhookIdPath:
      name: id
      in: path
      required: true
      description: |
        The webhook subscription's id, resolved against the **caller's own**
        subscriptions. A household mate's is 404 rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000c7
    ReceiptIdPath:
      name: id
      in: path
      required: true
      description: |
        The receipt's id, resolved inside the caller's own household — a
        household mate's receipt is readable, another household's id is 404
        rather than 403.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000e1


    ChatStreamQuery:
      name: stream
      in: query
      required: false
      description: |
        Whether to stream the answer. `true` opens a `text/event-stream`
        response and writes OpenAI-shaped delta frames as the endpoint produces
        them; anything else, including absence, returns the ordinary JSON
        envelope with the whole answer.

        A client decides how to read the body from the response's `Content-Type`
        and status, not from what it asked for: every failure that can be
        detected before the stream opens is answered as JSON whatever this
        parameter says.
      schema:
        type: boolean
        default: false
        example: true
    SessionIdHeader:
      name: X-Session-Id
      in: header
      required: false
      description: |
        The conversation to continue. Absent starts a new one. The value is a
        conversation id this server issued to **this** member; one that is not
        theirs, or was never issued, is 404. A malformed value is 400.

        The response carries this header whether or not the request did.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000c1
    SessionIdQuery:
      name: sessionId
      in: query
      required: false
      description: |
        One conversation of the caller's own, by the id `X-Session-Id` carries.
        Absent means every conversation they have. Another member's id — a
        household mate's included — is 404, because these rows are per member
        and not part of the shared ledger.

        **Absent and empty are not the same thing.** `?sessionId=` — a URL built
        from a client variable that was never set — is 400, not "every
        conversation": on `DELETE /v1/chat/history` reading the two alike would
        destroy the member's whole history. Omit the parameter to mean all of
        them.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000c1

  # ---------------------------------------------------------------- response headers
  headers:
    XRequestId:
      description: |
        The correlation id for this request — the caller's own if it was a valid
        UUID, otherwise one the server generated. It matches `error.requestId`
        and is the string to quote when reporting a failure.
      schema:
        type: string
        format: uuid
        example: 99999999-8888-4777-8666-555555555555
    RetryAfter:
      description: |
        Whole seconds to wait before repeating the request. Sent with every 429
        and with the 503 the sign-in surface answers when the limiter itself is
        unavailable. RFC 9110 also permits an HTTP-date here; this server always
        sends the delta form.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 60
    SetSessionCookies:
      description: |
        **Cookie mode only.** Two `Set-Cookie` headers, `__Host-trove_access` and
        `__Host-trove_refresh`, each `HttpOnly; Secure; SameSite=Lax; Path=/` with
        `Max-Age` set to the refresh token's remaining life (86400 s, one day,
        for a fresh sign-in by default; `trove.jwt.refresh-expiry-seconds` sets
        it). Bearer-mode responses set neither and carry the tokens in the body instead. A `XSRF-TOKEN`
        cookie (readable, `Secure; Path=/`) may be planted alongside them. On
        register, password login and TOTP login the `XSRF-TOKEN` cookie is
        replaced with a fresh value; `POST /v1/auth/refresh` leaves it as it
        was.
      schema:
        type: string
        example: __Host-trove_access=eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE.not-real; Path=/; Max-Age=86400; Secure; HttpOnly; SameSite=Lax
    SetSessionCookiesClearingChallenge:
      description: |
        As `SetSessionCookies`, plus a third `Set-Cookie` that expires
        `__Host-trove_totp_challenge` with `Max-Age=0`. The challenge has been
        spent; leaving it in place would present it again at the next login,
        where it can only produce a confusing failure.
      schema:
        type: string
        example: __Host-trove_totp_challenge=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax
    ClearSessionCookies:
      description: |
        Two `Set-Cookie` headers expiring `__Host-trove_access` and
        `__Host-trove_refresh` with `Max-Age=0`. Sent whether or not the request
        actually presented a session.
      schema:
        type: string
        example: __Host-trove_access=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax
    ContentDispositionAttachment:
      description: |
        Always the `attachment` form with a server-generated filename —
        `trove-tax-export-<taxYear>-<runId>.csv|pdf` for a tax export and
        `trove-data-export-<runId>.zip` for a full data export. The name is built
        from the run's own id (and, for a tax export, its year), never from
        anything a caller supplied, so it carries no path separator and no quote
        to escape, and it carries no email address.
      schema:
        type: string
        example: attachment; filename="trove-tax-export-2025-00000000-0000-4000-8000-0000000000a9.csv"
    XContentTypeOptions:
      description: |
        Always `nosniff`. The download is the only route that returns bytes the
        caller's own data produced, and content sniffing on it is how a CSV
        becomes an HTML document in a browser tab.
      schema:
        type: string
        enum: [nosniff]
        example: nosniff
    XSessionId:
      description: |
        The coach conversation this answer belongs to — the id to send back in
        `X-Session-Id` to continue it. Set on every response of
        `POST /v1/chat/completions` that got as far as having a conversation,
        streaming or not, so a client never has to mint a correlation id of its
        own.

        It is the `coach_conversation` row's own id and nothing else: there is no
        second session identifier to keep in step with it, and it is not a
        credential — it names a conversation, it does not authorise access to
        one.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-0000000000c1

  # ---------------------------------------------------------------- reusable error responses
  # Each narrows ErrorResponse.type to the slugs THIS status can actually carry
  # on the operations that reference it.
  responses:
    BadRequest:
      description: |
        **400.** The request body was unreadable or a field failed validation. `fieldErrors` lists the offending fields on `validation-error`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
    RegisterRejected:
      description: |
        **400.** The registration was refused. `email-taken` and `password-policy` both carry a single `fieldErrors` entry (`email` / `password`) so the form can mark the right field.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/email-taken
                          - https://trove.finance/errors/password-policy
    PasswordRejected:
      description: |
        **400.** The new password was refused by the policy, or a field failed validation. `password-policy` carries a `fieldErrors` entry for `password`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/password-policy
    ResetRejected:
      description: |
        **400.** The link is not usable, or the new password was refused. `reset-invalid` is the identical answer for an unknown, expired and already-used token, so the route cannot be used to test guesses; the policy is checked first, so a refused password leaves the link usable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/reset-invalid
                          - https://trove.finance/errors/password-policy
    Unauthorized:
      description: |
        **401.** No usable session. Either none was presented, or the access token has expired, or its refresh family has been revoked or deleted. The client's refresh path handles the ordinary case. On `POST /v1/auth/refresh` it can also mean the family was revoked for token reuse outside the 30-second grace window — that one is not retryable and needs a fresh sign-in.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/unauthorized
    CredentialsInvalid:
      description: |
        **401.** The credentials were refused. Unknown address, wrong password, locked account and deactivated account all produce this exact status, slug and detail — anything finer turns the login form into an account-existence oracle.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/credentials-invalid
    TotpChallengeRefused:
      description: |
        **401.** The second factor was refused. `unauthorized` covers a missing, malformed, expired or wrong-typed challenge (including no token in either the body or the cookie); `credentials-invalid` is a locked or deactivated account, identical to the password half so the lock stays invisible; `totp-invalid` is a live challenge with a wrong code, and is counted against both the per-account lock and the per-address gate.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/unauthorized
                          - https://trove.finance/errors/credentials-invalid
                          - https://trove.finance/errors/totp-invalid
    TotpCodeRefused:
      description: |
        **401.** The code was not accepted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/totp-invalid
    Forbidden:
      description: |
        **403.** Refused. `forbidden` is the role check or a missing/stale CSRF token; `csrf-header-missing` is a cookie-authenticated mutation without `X-Requested-With: XMLHttpRequest`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/forbidden
                          - https://trove.finance/errors/csrf-header-missing
    CsrfRefused:
      description: |
        **403.** The CSRF checks refused this request: `forbidden` for a missing or stale `X-XSRF-TOKEN`, `csrf-header-missing` for a cookie-authenticated mutation without `X-Requested-With: XMLHttpRequest`. Bearer callers never see either.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/forbidden
                          - https://trove.finance/errors/csrf-header-missing
    StepUpRequired:
      description: |
        **403.** The step-up failed: the current password (or, where the operation asks for one, the current code) was wrong. **Deliberately not a 401** — a 401 would send every client interceptor off to refresh a session that is perfectly valid. `forbidden` and `csrf-header-missing` are the CSRF refusals.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/step-up-required
                          - https://trove.finance/errors/forbidden
                          - https://trove.finance/errors/csrf-header-missing
    AdminSelfTargetRefused:
      description: |
        **403.** Refused. `step-up-required` means the target id is the calling administrator's own: an admin route never acts on the admin's own security state, because that would be a way around the password-and-code step-up the account-security routes enforce. `forbidden` is the role check, `csrf-header-missing` the CSRF one.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/step-up-required
                          - https://trove.finance/errors/forbidden
                          - https://trove.finance/errors/csrf-header-missing
    RegistrationClosed:
      description: |
        **403.** This install is invite-only and the request carried no usable invitation. `forbidden` and `csrf-header-missing` are the CSRF refusals.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/registration-closed
                          - https://trove.finance/errors/forbidden
                          - https://trove.finance/errors/csrf-header-missing
    NotFound:
      description: |
        **404.** No such resource **in the caller's household**. The lookup is household-scoped, so 'not yours' and 'does not exist' are the same answer and neither confirms that an id is real.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/not-found
    OidcNotConfigured:
      description: |
        **404.** Single sign-on is not configured on this install. This is the ordinary answer on the majority of installs, not an error state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/not-found
    InviteInvalid:
      description: |
        **404.** The invitation token is unknown, revoked, or bound to a different email address than the one being registered. One answer for all three.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/invite-invalid
    SetupTokenRejected:
      description: |
        **400.** The setup token could not be used. `validation-error` is a token that is not base64 or does not decode to an absolute URL; `malformed-request` is an unparseable body; `outbound-url-rejected` is the egress policy refusing the URL the token decodes to — not https, no host, or an address this server will not connect to (loopback, private, link-local, the cloud instance-metadata address, or a name that resolves to one). HTTP Basic credentials in the URL's userinfo are *not* a refusal here: the SimpleFIN protocol puts them there, so they are taken off the URL before the policy sees it and sent as an `Authorization` header to the address that was approved. A refusal for the URL's shape names that rule; a refusal by address reads the same whatever the address or its range. It never echoes the token, the decoded URL or any credential.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/outbound-url-rejected
    UploadTooLarge:
      description: |
        **413.** The upload cannot be stored. Three ceilings produce it and all three answer the same slug, because from a client's point of view there is one refusal: the servlet container's multipart cap, which refuses the request before any handler sees it; the import's own smaller per-file cap; and the household's total allowance for uploads that have not been committed or swept yet — an import batch left in `PREVIEW` keeps its file until it is undone or until the retention sweep removes it, so a household that has abandoned several previews can hit this one with a file that is otherwise well under the per-file cap. The last two are checked against the part's declared size before its bytes are read. Nothing was stored, and the message names bytes only — never a filename, a key or a path.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/upload-too-large
    Conflict:
      description: |
        **409.** The request conflicts with the current state. On `DELETE /v1/admin/users/{id}` this is the last-`ADMIN` guard: an install whose only administrator has been deleted has no way back in. `concurrent-modification` means another request changed the row first — reload and retry.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/conflict
                          - https://trove.finance/errors/concurrent-modification
    TotpStateConflict:
      description: |
        **409.** The account's TOTP state does not allow this. `totp-already-enabled` refuses a re-enrolment that would silently replace a working factor; `totp-not-enrolled` means there is no enrolment in progress to confirm.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/totp-already-enabled
                          - https://trove.finance/errors/totp-not-enrolled
    InviteExpired:
      description: |
        **410.** The invitation has expired or has already been redeemed. Gone rather than 404 because the link was real; the member should ask an admin for a new one.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/invite-expired
    LoginThrottled:
      description: |
        **429.** The sign-in or registration was refused before any password was verified, for one of two reasons, and the slug says which. `account-locked` is the brute-force gate: too many failed attempts from this client address inside the lockout window (a registration refused as `email-taken` counts as one), checked before a credential is read so it costs an attacker the same whether or not the account exists. The gate fails closed, so it also answers `account-locked` when the request carries no resolvable client address, or when the failed-attempt count cannot be read (a database error); in those two cases nothing was wrong with the caller's attempts, `Retry-After` is 60 seconds, and the same request can be repeated once the store or the proxy chain is healthy. `rate-limited` is the request-rate limiter in front of it: too many calls to this route from this client address, regardless of whether they failed. Both carry `Retry-After` in seconds.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/account-locked
                          - https://trove.finance/errors/rate-limited
    RateLimited:
      description: |
        **429.** A request-rate limit was exceeded. The limiter keys on the authenticated user when there is one and on the client address otherwise, except on the anonymous sign-in routes (`register`, `login`, `login/totp`, `refresh`, `logout`, `password/reset`), which are always keyed on the client address so that a session cannot buy a second budget there, and matches the request against the rules in `rate_limit_config`, so the ceiling that was hit depends on the route. `Retry-After` carries the number of seconds to wait. Every route on this API except `GET /v1/status` can answer this.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/rate-limited
    LimiterUnavailable:
      description: |
        **503.** The rate limiter could not reach a decision, and every route under `/v1/auth` refuses rather than passing the request through. That direction is deliberate: an outage of the counting machinery must not become a way of switching brute-force protection off on the sign-in surface. Retry after the interval in `Retry-After`; the request itself was never processed, so it is safe to repeat.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/service-unavailable
    QueryRejected:
      description: |
        **400.** A query parameter failed validation — a `page` below zero, a `limit` outside its range, or a value that is not a number at all. `fieldErrors` names the parameter. There is no request body on these operations, so `malformed-request` cannot occur.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
    AiSettingsRejected:
      description: |
        **400.** The body failed validation, or the endpoint URL was refused by the egress policy. `outbound-url-rejected` names the rule when the URL's shape is refused (the scheme, the missing opt-in, credentials before the host). A refusal by address reads the same whatever the address, its range, or whether the name resolves at all: anything more would turn the validator into the internal network probe it exists to prevent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/outbound-url-rejected
    AiEgressRejected:
      description: |
        **400.** The stored endpoint URL no longer passes the egress policy. The policy is re-evaluated on every outbound call and never cached from the moment the settings were saved, so a URL that was legal when it was written is refused here once the install turns `TROVE_EGRESS_ALLOW_PRIVATE` off, the user withdraws their own `allowPrivateEndpoint`, or the name starts resolving to an address the policy blocks.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/outbound-url-rejected
    CoachRequestRejected:
      description: |
        **400.** The body failed validation (`messages` empty, a last turn that is not `role: user`, blank `content`), was not parseable JSON, or the caller's **stored** endpoint URL no longer passes the egress policy. The last one is not a body problem at all: the policy is re-evaluated on every outbound call, so a URL that was legal when it was saved is refused here once the install turns `TROVE_EGRESS_ALLOW_PRIVATE` off, the member withdraws their own `allowPrivateEndpoint`, or the name starts resolving to a blocked address — the same `outbound-url-rejected` the settings routes answer, on a route that never accepted a URL. It is the member's own to fix in Settings, which is why it is not dressed up as a 500. On a streamed request the same refusal arrives as the in-band error frame instead, because the response is already open.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/outbound-url-rejected
    AiDisabled:
      description: |
        **409.** The caller has not configured an AI endpoint, or has turned theirs off. Every AI-backed feature answers this rather than a 500 or an empty result, so a client can treat it as "the feature is off for this member" and offer the settings screen. AI is off by default and on no install is it required. On the two configuration-time routes it means only "nothing to call": `GET /v1/ai/models` answers it when no endpoint URL is saved, and `POST /v1/ai/settings/test` when no endpoint URL or no chat model is saved. Neither of them asks for `enabled`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/ai-disabled
    AiEndpointFailure:
      description: |
        **502.** The caller's own AI endpoint is at fault, not Trove and not the request. `ai-unreachable` is a refused connection, a TLS failure or an unusable answer; `ai-endpoint-unauthorized` is the endpoint rejecting the stored API key (401/403 upstream), which is a settings problem the member can fix; `ai-model-missing` means the endpoint answered but does not serve the model the settings name. `detail` never repeats the endpoint's response body, which may contain the prompt.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/ai-unreachable
                          - https://trove.finance/errors/ai-endpoint-unauthorized
                          - https://trove.finance/errors/ai-model-missing
    AiTimeout:
      description: |
        **504.** The endpoint did not answer inside the deadline. The deadline is the caller's own `readTimeoutMs`, capped
        at four times the install's `TROVE_HTTP_READ_TIMEOUT_MS` (120 s at the
        default 30000 ms); a local model on modest hardware legitimately needs longer than a cloud one, which is why the value is per user at all.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/ai-timeout
    AiPolicyBlocked:
      description: |
        **403**, and the operation can reach it two ways. `ai-policy-blocked` is the caller's own privacy tier refusing the payload: a coach question is built from the household's ledger, so it is classified `SENSITIVE`, and a `CLOUD_OK` endpoint is somebody else's server — the refusal happens before any connection is opened, and the fix is the member's own (`privacyTier: LOCAL_ONLY`, or a different endpoint), not an administrator's. `forbidden` and `csrf-header-missing` are the ordinary cookie-mode CSRF refusals every mutating route can answer; bearer callers never see those two.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/ai-policy-blocked
                          - https://trove.finance/errors/forbidden
                          - https://trove.finance/errors/csrf-header-missing
    InternalServerError:
      description: |
        **500.** Something failed that the server does not describe. `detail` is always the same generic sentence and `requestId` is the string to quote when reporting it; the specifics are in the server log under that id. `encryption-failed` and `storage-failure` are the two internal faults that carry their own slug.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/internal-server-error
                          - https://trove.finance/errors/encryption-failed
                          - https://trove.finance/errors/storage-failure
    ExportNotReady:
      description: |
        **409.** The run exists and belongs to the caller, but there is no file to send: it is still `PENDING` or `GENERATING`, or it `FAILED`. Deliberately not a 404 — the run is real, and a client polling for it should keep polling (or read `errorMessage`) rather than conclude the id is dead.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/conflict
    WebhookRejected:
      description: |
        **400.** The body failed validation, or the target URL was refused by the shared egress policy. `outbound-url-rejected` names the rule when the URL's shape is refused (plain `http`, credentials before the host). A refusal by address (loopback, private, carrier-grade NAT, IPv6 unique-local or transition, link-local, the cloud instance-metadata address, or a name that does not resolve) reads the same whatever the reason, so this route cannot become the internal network probe the policy exists to prevent. The same policy runs again on every delivery attempt, so passing here is not a promise that a later delivery will be attempted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        enum:
                          - https://trove.finance/errors/validation-error
                          - https://trove.finance/errors/malformed-request
                          - https://trove.finance/errors/outbound-url-rejected

  # ---------------------------------------------------------------- schemas
  #
  # RESPONSE schemas are closed (`additionalProperties: false`) wherever the DTO
  # is a closed Java record, and their `required` lists every field the server
  # always sets. A field the record always serialises but whose value may be null
  # is `required` AND `nullable: true` (the record is annotated
  # `@JsonInclude(ALWAYS)`); a field that is dropped from the JSON when null is
  # simply absent from `required` (`@JsonInclude(NON_NULL)`).
  #
  # REQUEST schemas are deliberately NOT closed: the server is configured with
  # `FAIL_ON_UNKNOWN_PROPERTIES` disabled, so it accepts and ignores unknown
  # keys, and a closed schema would describe a stricter server than the one that
  # ships. Their constraints mirror the DTOs' Bean Validation annotations
  # exactly; `minLength: 1` stands in for `@NotBlank`, which JSON Schema cannot
  # express (the server also rejects all-whitespace).
  #
  # NOTE for the Wire phase: because request enums (locale, currency, country,
  # role, auth mode) are the values the server ACCEPTS, a negative test that
  # deliberately posts an out-of-enum value to assert a 400 will be flagged by
  # request validation. Validate responses on those cases, or whitelist them.
  schemas:

    # ---- envelope -----------------------------------------------------------
    SuccessEnvelope:
      type: object
      description: |
        The success half of the `ApiResponse` envelope. Composed with `allOf`
        rather than parameterised, so each operation states its own `data` type
        and generated clients get an exact shape instead of `unknown`.

        It is intentionally **not** closed: `additionalProperties: false` here
        would, in JSON Schema draft-04/2020-12 alike, reject the `data` that the
        sibling subschema contributes.
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Always `true` on this branch of the envelope.
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      example:
        success: true

    EmptySuccess:
      type: object
      description: |
        The whole body of an operation that returns no value. `data` is **omitted**,
        not null — the envelope is serialised with `@JsonInclude(NON_NULL)` — so
        the literal body on the wire is `{"success":true}`.
      required: [success]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
      example:
        success: true

    ErrorEnvelope:
      type: object
      description: The failure half of the envelope. `data` and `meta` are never present.
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorResponse'
      example:
        success: false
        error:
          type: https://trove.finance/errors/not-found
          title: Not Found
          status: 404
          detail: No account in this household uses that email address.
          instance: /api/v1/auth/password/reset-request
          requestId: 99999999-8888-4777-8666-555555555555

    PaginationMeta:
      type: object
      description: |
        Pagination for a listed collection, present on every operation whose
        response declares it — `GET /v1/audit`, `GET /v1/transactions`, `GET
        /v1/chat/history`, `GET /v1/insights`, `GET /v1/receipts`, `GET
        /v1/notifications`, `GET /v1/tax-export/runs` and `GET /v1/me/export`. The capped lists
        (`security-events`, `invites`) omit it: they are bounded, not paged.
      required: [total, page, limit]
      additionalProperties: false
      properties:
        total:
          type: integer
          format: int64
          description: Total matching rows across all pages.
          example: 137
        page:
          type: integer
          format: int32
          description: Zero-based index of the page returned.
          example: 0
        limit:
          type: integer
          format: int32
          description: Maximum rows per page.
          example: 50
      example:
        total: 137
        page: 0
        limit: 50

    ErrorResponse:
      type: object
      description: |
        RFC 7807 problem details, carried inside the envelope rather than as a
        `application/problem+json` document — one body shape for every answer the
        API gives.
      required: [type, title, status, detail, instance]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: |
            `https://trove.finance/errors/<slug>`. **The slug is the contract** —
            clients switch on it, never on the prose in `title` or `detail`, and
            never on the status alone (several slugs share a status and mean
            different things). The complete set the server can emit:

            | slug | status | meaning |
            | --- | --- | --- |
            | `validation-error` | 400 | one or more fields failed validation; see `fieldErrors` |
            | `malformed-request` | 400 | the body is not parseable JSON |
            | `email-taken` | 400 | that address already has an account |
            | `password-policy` | 400 | the password was refused by the policy |
            | `reset-invalid` | 400 | the reset link is unknown, expired or spent |
            | `outbound-url-rejected` | 400 | a supplied URL failed the egress policy |
            | `unauthorized` | 401 | no usable session |
            | `credentials-invalid` | 401 | sign-in refused (deliberately indistinguishable) |
            | `totp-invalid` | 401 | that authentication code is not valid |
            | `forbidden` | 403 | the role check or the CSRF token refused it |
            | `csrf-header-missing` | 403 | cookie-authenticated mutation without `X-Requested-With` |
            | `step-up-required` | 403 | this action needs the current password (and code) |
            | `registration-closed` | 403 | this install is invite-only |
            | `ai-policy-blocked` | 403 | the privacy tier forbids sending this payload to this endpoint |
            | `not-found` | 404 | no such resource in the caller's household |
            | `invite-invalid` | 404 | unknown, revoked or mis-addressed invitation |
            | `method-not-allowed` | 405 | wrong verb for this path |
            | `conflict` | 409 | the request fights the current state |
            | `concurrent-modification` | 409 | another request won the race; reload |
            | `totp-not-enrolled` | 409 | no enrolment in progress |
            | `totp-already-enabled` | 409 | a second factor is already in force |
            | `ai-disabled` | 409 | the caller has configured no AI endpoint, or turned theirs off |
            | `invite-expired` | 410 | the invitation has expired or been redeemed |
            | `upload-too-large` | 413 | the upload exceeds the configured maximum |
            | `answer-too-long` | 413 | a streamed coach answer outran the length this server stores |
            | `account-locked` | 429 | the per-address sign-in gate refused: too many failed attempts from this address, no resolvable address, or the attempt count could not be read |
            | `rate-limited` | 429 | a rate limit was exceeded |
            | `internal-server-error` | 500 | unexplained; quote `requestId` |
            | `encryption-failed` | 500 | a field could not be encrypted or decrypted |
            | `storage-failure` | 500 | an object store operation failed |
            | `service-unavailable` | 503 | a dependency is not answering |
            | `ai-unreachable` | 502 | the caller's own AI endpoint could not be reached |
            | `ai-endpoint-unauthorized` | 502 | that endpoint rejected the stored API key |
            | `ai-model-missing` | 502 | that endpoint does not serve the configured model |
            | `ai-timeout` | 504 | that endpoint did not answer inside the deadline |

            `rate-limited` is emitted by every operation except `GET /v1/status`
            — the limiter sits in front of them all — and `service-unavailable`
            by every operation under `/v1/auth`, which refuses rather than
            passing a request through when the limiter cannot decide.
            `upload-too-large` is emitted by the two operations that accept a
            file, `POST /v1/imports` and `POST /v1/receipts/upload`.
            `answer-too-long` is **in-band only**: no HTTP response of this API
            carries it. It is the last frame of a streamed
            `POST /v1/chat/completions` whose answer outran the length the server
            stores — the endpoint did not fail, so none of the `ai-*` slugs
            would be true, and what arrived is still persisted and still on the
            member's screen. The non-streaming form of the same operation caps
            silently inside its 200.
            `ai-policy-blocked` is emitted by `POST /v1/chat/completions`, the
            first route to carry a payload built from the household's ledger: a
            coach question is classified `SENSITIVE`, and a member whose own
            `privacyTier` is `CLOUD_OK` is refused before any connection opens.
            The other AI-gateway callers (receipt vision, categorisation) reach
            the same refusal on background work that serves no route.
          enum:
            - https://trove.finance/errors/validation-error
            - https://trove.finance/errors/malformed-request
            - https://trove.finance/errors/email-taken
            - https://trove.finance/errors/password-policy
            - https://trove.finance/errors/reset-invalid
            - https://trove.finance/errors/outbound-url-rejected
            - https://trove.finance/errors/unauthorized
            - https://trove.finance/errors/credentials-invalid
            - https://trove.finance/errors/totp-invalid
            - https://trove.finance/errors/forbidden
            - https://trove.finance/errors/csrf-header-missing
            - https://trove.finance/errors/step-up-required
            - https://trove.finance/errors/registration-closed
            - https://trove.finance/errors/ai-policy-blocked
            - https://trove.finance/errors/not-found
            - https://trove.finance/errors/invite-invalid
            - https://trove.finance/errors/method-not-allowed
            - https://trove.finance/errors/conflict
            - https://trove.finance/errors/concurrent-modification
            - https://trove.finance/errors/totp-not-enrolled
            - https://trove.finance/errors/totp-already-enabled
            - https://trove.finance/errors/ai-disabled
            - https://trove.finance/errors/invite-expired
            - https://trove.finance/errors/upload-too-large
            - https://trove.finance/errors/answer-too-long
            - https://trove.finance/errors/account-locked
            - https://trove.finance/errors/rate-limited
            - https://trove.finance/errors/internal-server-error
            - https://trove.finance/errors/encryption-failed
            - https://trove.finance/errors/storage-failure
            - https://trove.finance/errors/service-unavailable
            - https://trove.finance/errors/ai-unreachable
            - https://trove.finance/errors/ai-endpoint-unauthorized
            - https://trove.finance/errors/ai-model-missing
            - https://trove.finance/errors/ai-timeout
          example: https://trove.finance/errors/validation-error
        title:
          type: string
          description: The HTTP reason phrase for `status`. Not for display.
          example: Bad Request
        status:
          type: integer
          format: int32
          description: Repeats the HTTP status code.
          minimum: 100
          maximum: 599
          example: 400
        detail:
          type: string
          description: |
            A sentence written for the account's owner. Safe to show, but a client
            that wants its own copy should key it off the slug — 500s always say
            the same generic thing.
          example: One or more fields failed validation.
        instance:
          type: string
          description: |
            The matched route template, e.g. `/api/v1/auth/invites/{token}` — never
            the caller's raw URI. When nothing matched, the URI with its last
            segment replaced by `*`.
          example: /api/v1/auth/register
        requestId:
          type: string
          format: uuid
          description: |
            The correlation id, also in the `X-Request-Id` response header. Absent
            only if the filter chain was bypassed.
          example: 99999999-8888-4777-8666-555555555555
        fieldErrors:
          type: array
          description: |
            Present only when field-level validation failed — a 400 with slug
            `validation-error`, `email-taken` or `password-policy`. Never on any
            other status.
          items:
            $ref: '#/components/schemas/FieldError'
      example:
        type: https://trove.finance/errors/validation-error
        title: Bad Request
        status: 400
        detail: One or more fields failed validation.
        instance: /api/v1/auth/register
        requestId: 99999999-8888-4777-8666-555555555555
        fieldErrors:
          - field: email
            message: must be a well-formed email address

    FieldError:
      type: object
      description: One rejected field. `field` is the JSON property name as sent.
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: must not be blank
      example:
        field: password
        message: must not be blank

    # ---- shared value types -------------------------------------------------
    UserRole:
      type: string
      description: |
        `ADMIN` may administer the household (invites, settings, members, reset
        links); `MEMBER` may not. One household per install in this version.
      enum: [MEMBER, ADMIN]
      example: MEMBER

    CurrencyCode:
      type: string
      description: |
        The account's currency. Two supported, both two-decimal (owner decision:
        Canada and the United States only).
      enum: [CAD, USD]
      example: CAD

    CountryCode:
      type: string
      description: |
        The account's tax jurisdiction. It seeds the currency and the locale at
        registration and is not writable through the preferences route.
      enum: [CA, US]
      example: CA

    LocaleCode:
      type: string
      description: |
        The display locale. Exactly two are accepted; anything else is 400
        `validation-error`. Seeded from `country` at registration.
      enum: [en-CA, en-US]
      example: en-CA

    Timezone:
      type: string
      description: |
        An IANA time zone id, validated with `ZoneId.of`. Registration falls back
        to `UTC` on an unrecognised value rather than losing the sign-up; the
        profile and preferences routes reject it with 400 `validation-error`.
      maxLength: 64
      example: America/Halifax

    # ---- status -------------------------------------------------------------
    ServerStatus:
      type: object
      description: |
        The bare `GET /v1/status` body. Not enveloped, on purpose.
      required: [status, version, time]
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            The actuator aggregate collapsed to two words. Anything that is not
            `UP` — down, out of service, unknown — is `DEGRADED`; which component
            is unhappy is management-port information.
          enum: [UP, DEGRADED]
          example: UP
        version:
          type: string
          description: |
            The build version from `build-info.properties`, or the literal
            `unknown` when the jar was built without it.
          example: 0.1.0-SNAPSHOT
        time:
          type: string
          format: date-time
          description: Server time when the probe was answered, ISO-8601 UTC.
          example: '2026-09-04T14:27:31.482913Z'
      example:
        status: UP
        version: 0.1.0-SNAPSHOT
        time: '2026-09-04T14:27:31.482913Z'

    # ---- session ------------------------------------------------------------
    AuthUser:
      type: object
      description: The compact identity returned alongside a session.
      required: [id, email, displayName, householdId, role, totpEnabled]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          maxLength: 320
          example: member@example.test
        displayName:
          type: string
          maxLength: 100
          example: Example Member
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000a1
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnabled:
          type: boolean
          description: Whether a second factor is currently in force on this account.
          example: false
      example:
        id: 00000000-0000-4000-8000-000000000001
        email: member@example.test
        displayName: Example Member
        householdId: 00000000-0000-4000-8000-0000000000a1
        role: MEMBER
        totpEnabled: false

    CookieSession:
      type: object
      description: |
        The cookie-mode session body. **No tokens**: they are in the `Set-Cookie`
        headers, where a script cannot read them. Also the exact body of
        `POST /v1/auth/password`, which returns the user and deliberately mints
        nothing.
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
      example:
        user:
          id: 00000000-0000-4000-8000-000000000001
          email: member@example.test
          displayName: Example Member
          householdId: 00000000-0000-4000-8000-0000000000a1
          role: MEMBER
          totpEnabled: false

    BearerSession:
      type: object
      description: |
        The bearer-mode session body. All four fields are present together or the
        response is not this shape.
      required: [user, accessToken, refreshToken, expiresIn]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        accessToken:
          type: string
          description: |
            HMAC-signed JWT (HS256 to HS512, set by the length of
            `TROVE_JWT_SECRET`), 15-minute lifetime. Hold it in memory only.
          example: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-ACCESS-TOKEN.not-a-real-signature
        refreshToken:
          type: string
          description: |
            Opaque, single-use, rotated on every refresh — but reuse has two
            branches, and a client that implements only the second will sign its
            user out for using the application normally. Re-presenting a
            just-spent token **inside a 30-second grace window**
            (`trove.auth.refresh.reuse-grace`) returns the same successor again
            with a normal 200: that is two browser tabs racing a 401, or one
            retried mobile request, not an attack, and no security event is
            recorded. **Outside** that window the whole refresh family is
            revoked and every later call — including one with the successor —
            is 401 `unauthorized` and needs a fresh sign-in.
          example: cmVmcmVzaC10b2tlbi1FWEFNUExFLW5vdC1yZWFs
        expiresIn:
          type: integer
          format: int64
          description: Seconds until `accessToken` expires (900).
          example: 900
      example:
        user:
          id: 00000000-0000-4000-8000-000000000001
          email: member@example.test
          displayName: Example Member
          householdId: 00000000-0000-4000-8000-0000000000a1
          role: MEMBER
          totpEnabled: false
        accessToken: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-ACCESS-TOKEN.not-a-real-signature
        refreshToken: cmVmcmVzaC10b2tlbi1FWEFNUExFLW5vdC1yZWFs
        expiresIn: 900

    TotpChallenge:
      type: object
      description: |
        The password was right and a second factor is owed. **A success, not an
        error** — the client shows the code screen and posts the challenge back to
        `POST /v1/auth/login/totp`. Valid for 60 seconds.
      required: [challengeToken]
      additionalProperties: false
      properties:
        challengeToken:
          type: string
          description: |
            A short-lived JWT of type `totp_challenge`. It is accepted by that one
            route and refused everywhere else, exactly as a full access token is
            refused there.
          example: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-TOTP-CHALLENGE.not-a-real-signature
      example:
        challengeToken: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-TOTP-CHALLENGE.not-a-real-signature

    Session:
      description: |
        A completed session in whichever shape the auth mode asked for. Exactly
        one branch matches: the cookie body has only `user`, the bearer body has
        all four fields.
      oneOf:
        - $ref: '#/components/schemas/CookieSession'
        - $ref: '#/components/schemas/BearerSession'

    LoginResponse:
      description: |
        What a sign-in returns: a session, or a second factor being owed. Clients
        discriminate on the presence of `challengeToken` — there is no
        discriminator property, because the shapes are disjoint and the shipped
        clients already test for that field.
      oneOf:
        - $ref: '#/components/schemas/CookieSession'
        - $ref: '#/components/schemas/BearerSession'
        - $ref: '#/components/schemas/TotpChallenge'

    CookieRefresh:
      type: object
      description: |
        Cookie-mode rotation. The new pair is in the `Set-Cookie` headers; only
        the access token's lifetime crosses into the body, so a client can
        schedule its next refresh.
      required: [expiresIn]
      additionalProperties: false
      properties:
        expiresIn:
          type: integer
          format: int64
          example: 900
      example:
        expiresIn: 900

    BearerRefresh:
      type: object
      description: Bearer-mode rotation. Both new tokens, and the old refresh token is spent.
      required: [accessToken, refreshToken, expiresIn]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          example: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-ACCESS-TOKEN.not-a-real-signature
        refreshToken:
          type: string
          example: cmVmcmVzaC10b2tlbi1FWEFNUExFLXJvdGF0ZWQ
        expiresIn:
          type: integer
          format: int64
          example: 900
      example:
        accessToken: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-ACCESS-TOKEN.not-a-real-signature
        refreshToken: cmVmcmVzaC10b2tlbi1FWEFNUExFLXJvdGF0ZWQ
        expiresIn: 900

    RefreshResponse:
      description: |
        The result of a rotation, in whichever shape the token's carrier implies.
      oneOf:
        - $ref: '#/components/schemas/CookieRefresh'
        - $ref: '#/components/schemas/BearerRefresh'

    # ---- profile and preferences -------------------------------------------
    MeResponse:
      type: object
      description: |
        The full account, read fresh from the database on every call. Note the id
        is `userId` here and `id` on `AuthUser` — both are the same value; the two
        shapes are what the shipped clients already consume.
      required:
        - userId
        - email
        - displayName
        - householdId
        - role
        - totpEnabled
        - currency
        - country
        - timezone
        - locale
        - onboardingCompleted
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          maxLength: 320
          example: member@example.test
        displayName:
          type: string
          maxLength: 100
          example: Example Member
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000a1
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnabled:
          type: boolean
          example: false
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        timezone:
          $ref: '#/components/schemas/Timezone'
        locale:
          $ref: '#/components/schemas/LocaleCode'
        onboardingCompleted:
          type: boolean
          description: Whether the account has finished first-run setup.
          example: true
      example:
        userId: 00000000-0000-4000-8000-000000000001
        email: member@example.test
        displayName: Example Member
        householdId: 00000000-0000-4000-8000-0000000000a1
        role: MEMBER
        totpEnabled: false
        currency: CAD
        country: CA
        timezone: America/Halifax
        locale: en-CA
        onboardingCompleted: true

    PreferencesResponse:
      type: object
      description: |
        All six fields are always present (`@JsonInclude(ALWAYS)`); `region` is the
        only one that can be null. `currency` and `country` are shown here but are
        not writable through this resource.
      required: [timezone, locale, currency, country, onboardingCompleted, region]
      additionalProperties: false
      properties:
        timezone:
          $ref: '#/components/schemas/Timezone'
        locale:
          $ref: '#/components/schemas/LocaleCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        onboardingCompleted:
          type: boolean
          example: true
        region:
          type: string
          nullable: true
          maxLength: 3
          description: |
            Sub-national region — a province or state code, upper-cased and
            trimmed by the server. Null when unset, and null is a value a client
            can write.
          example: NS
      example:
        timezone: America/Halifax
        locale: en-CA
        currency: CAD
        country: CA
        onboardingCompleted: true
        region: NS

    SecurityEventView:
      type: object
      description: |
        One row of the caller's security history, newest first.
      required: [id, type, at, ip, userAgent]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        type:
          type: string
          description: |
            The event kind. Not modelled as an enum because the column is a plain
            string and later steps add kinds; the values written today are
            `LOGIN_OK`, `LOGIN_FAIL`, `LOCKOUT`, `TOTP_ENROL`, `TOTP_DISABLE`,
            `PASSWORD_CHANGE`, `PASSWORD_RESET`, `SESSION_REVOKE`,
            `REFRESH_REUSE_DETECTED`, `BANK_CONNECTION_ADD`,
            `BANK_CONNECTION_REMOVE`, `EXPORT`, `ACCOUNT_DELETE`, `ADMIN_INVITE`,
            `INVITE_CREATED`, `INVITE_ACCEPTED`, `KEY_ROTATE` and
            `EGRESS_SETTING_CHANGE`. A client must tolerate an unknown one.
          example: LOGIN_OK
        at:
          type: string
          format: date-time
          description: When it happened, ISO-8601 UTC.
          example: '2026-09-04T14:20:05.117Z'
        ip:
          type: string
          nullable: true
          description: The client address as the server saw it, or null if it was not recorded.
          example: 203.0.113.7
        userAgent:
          type: string
          nullable: true
          description: The request's user agent, or null.
          example: TroveMobile/0.1 (example build)
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        type: LOGIN_OK
        at: '2026-09-04T14:20:05.117Z'
        ip: 203.0.113.7
        userAgent: TroveMobile/0.1 (example build)

    # ---- providers and invitations -----------------------------------------
    ProvidersResponse:
      type: object
      description: What the sign-in page should offer on this install.
      required: [registrationOpen, local, oidc]
      additionalProperties: false
      properties:
        registrationOpen:
          type: boolean
          description: |
            Whether self-serve sign-up is allowed right now. Read from the
            household row, so an admin's runtime change is reflected immediately.
            False on a default install — the ordinary path is an invitation.
          example: false
        local:
          type: boolean
          description: Whether email-and-password sign-in is offered. Always `true` in this version.
          example: true
        oidc:
          $ref: '#/components/schemas/OidcProvider'
      example:
        registrationOpen: false
        local: true
        oidc:
          enabled: false
          startUrl: null
          displayName: null

    OidcProvider:
      type: object
      description: |
        Single sign-on, if configured. All three fields are always present; the
        last two are null when `enabled` is false.
      required: [enabled, startUrl, displayName]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          example: true
        startUrl:
          type: string
          nullable: true
          description: |
            **Absolute** URL to begin sign-on — `{publicUrl}/api/v1/auth/start`,
            which 302s to the provider. Absolute rather than relative because the
            mobile client has no page origin to resolve a path against.
          example: https://trove.example.test/api/v1/auth/start
        displayName:
          type: string
          nullable: true
          description: The label for the button, e.g. the identity provider's name.
          example: Example SSO
      example:
        enabled: true
        startUrl: https://trove.example.test/api/v1/auth/start
        displayName: Example SSO

    InvitePreviewResponse:
      type: object
      description: |
        The public verdict on an invitation token. All three fields are always
        present; `email` and `expiresAt` are null whenever `valid` is false, and
        `email` is also null for an invitation that is open to anyone holding the
        link.
      required: [valid, email, expiresAt]
      additionalProperties: false
      properties:
        valid:
          type: boolean
          description: Whether this token can be redeemed right now.
          example: true
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          nullable: true
          maxLength: 320
          description: |
            The address this invitation is bound to, or null if it is unbound.
            Registration with a bound invitation must use this address.
          example: invitee@example.test
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-07T14:00:00Z'
      example:
        valid: true
        email: invitee@example.test
        expiresAt: '2026-09-07T14:00:00Z'

    InviteResponse:
      type: object
      description: |
        An invitation as an admin sees it. All eight fields are always present.
        **`token` and `url` are populated only while the invitation can still be
        redeemed** and go null once it is accepted, revoked or expired — so a
        client must type them as nullable and hide the copy-link control when they
        are.
      required: [id, email, token, url, expiresAt, createdAt, acceptedAt, createdByEmail]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000c1
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          nullable: true
          maxLength: 320
          description: The address the invitation is bound to, or null if it is open.
          example: invitee@example.test
        token:
          type: string
          nullable: true
          description: |
            The raw token, decrypted from storage for this response. Null once the
            invitation is no longer usable.
          example: aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        url:
          type: string
          nullable: true
          description: |
            The redemption link, `{publicUrl}/invite/{token}`. Null exactly when
            `token` is.
          example: https://trove.example.test/invite/aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        expiresAt:
          type: string
          format: date-time
          description: 72 hours after creation.
          example: '2026-09-07T14:00:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When it was redeemed, or null if it has not been.
          example: null
        createdByEmail:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          nullable: true
          maxLength: 320
          description: The admin who minted it, or null if that account has since been deleted.
          example: admin@example.test
      example:
        id: 00000000-0000-4000-8000-0000000000c1
        email: invitee@example.test
        token: aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        url: https://trove.example.test/invite/aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        expiresAt: '2026-09-07T14:00:00Z'
        createdAt: '2026-09-04T14:00:00Z'
        acceptedAt: null
        createdByEmail: admin@example.test

    # ---- account security ---------------------------------------------------
    TotpEnrolment:
      type: object
      description: |
        An enrolment in progress. **The factor is not yet in force** — it is
        enabled only when `POST /v1/auth/totp/confirm` sees one live code.
      required: [secret, otpauthUri, digits, periodSeconds]
      additionalProperties: false
      properties:
        secret:
          type: string
          description: The base32 shared secret, for manual entry.
          example: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
        otpauthUri:
          type: string
          description: The `otpauth://` URI to render as a QR code.
          example: otpauth://totp/Trove:member@example.test?secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAA&issuer=Trove&digits=6&period=30
        digits:
          type: integer
          format: int32
          description: Code length.
          example: 6
        periodSeconds:
          type: integer
          format: int32
          description: Code rotation period.
          example: 30
      example:
        secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
        otpauthUri: otpauth://totp/Trove:member@example.test?secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAA&issuer=Trove&digits=6&period=30
        digits: 6
        periodSeconds: 30

    TotpConfirmResponse:
      type: object
      description: |
        The recovery codes, shown **once**. They are stored hashed, so a client
        that does not surface them here has lost them.
      required: [recoveryCodes]
      additionalProperties: false
      properties:
        recoveryCodes:
          type: array
          description: Single-use codes, in the order they were minted.
          items:
            type: string
            example: example-code-0001
      example:
        recoveryCodes:
          - example-code-0001
          - example-code-0002
          - example-code-0003

    PasswordResetLinkResponse:
      type: object
      description: |
        An admin-minted reset link, to be handed over out of band. This is the
        only time it is readable.
      required: [url, expiresAt]
      additionalProperties: false
      properties:
        url:
          type: string
          description: '`{publicUrl}/reset-password/{token}`. Single use.'
          example: https://trove.example.test/reset-password/cmVzZXQtdG9rZW4tRVhBTVBMRQ
        expiresAt:
          type: string
          format: date-time
          description: One hour after minting.
          example: '2026-09-04T15:00:00Z'
      example:
        url: https://trove.example.test/reset-password/cmVzZXQtdG9rZW4tRVhBTVBMRQ
        expiresAt: '2026-09-04T15:00:00Z'

    # ---- administration -----------------------------------------------------
    AdminUserResponse:
      type: object
      description: A member of the household, as an admin sees them.
      required: [id, email, displayName, role, active, totpEnabled, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000002
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          maxLength: 320
          example: member@example.test
        displayName:
          type: string
          maxLength: 100
          example: Example Member
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
          description: |
            A deactivated member cannot sign in; sign-in still answers
            `credentials-invalid`. This is also false for a member inside the
            deletion grace — a member removed by `DELETE /v1/me` or
            `DELETE /v1/admin/users/{id}` stays listed here, inactive, until the
            purge erases them, so that an administrator can find them and call
            `POST /v1/admin/users/{id}/restore`. A restore of a member who was
            merely deactivated rather than deleted answers 409.
          example: true
        totpEnabled:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-08-30T09:15:00Z'
      example:
        id: 00000000-0000-4000-8000-000000000002
        email: member@example.test
        displayName: Example Member
        role: MEMBER
        active: true
        totpEnabled: false
        createdAt: '2026-08-30T09:15:00Z'

    AdminSettingsResponse:
      type: object
      description: The household's settings.
      required: [registrationOpen, scheduledSyncEnabled]
      additionalProperties: false
      properties:
        registrationOpen:
          type: boolean
          description: |
            Whether anyone may sign up without an invitation. Stored on the
            household row so it survives a restart.
          example: false
        scheduledSyncEnabled:
          type: boolean
          description: |
            Whether the server syncs every SimpleFIN-connected account on its
            own, once a day (`trove.simplefin.scheduled-sync-cron`). Off by
            default. A scheduled run that fails tells the account's owner once,
            when the account goes from working to failing, not every day.
          example: false
      example:
        registrationOpen: false
        scheduledSyncEnabled: false

    AuditLogEntry:
      type: object
      description: |
        One mutating request, as `GET /v1/audit` returns it. Written after the
        response has been sent, on a bounded background executor, so a slow or
        failing audit write can never delay or fail the request it describes.
      required: [id, method, path, status, userId, clientIp, requestId, durationMs, at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The audit row.
          example: 00000000-0000-4000-8000-0000000000a1
        method:
          type: string
          description: The HTTP method. Only mutating methods are recorded.
          enum: [POST, PUT, PATCH, DELETE]
          example: DELETE
        path:
          type: string
          description: |
            The matched route template, context path included — never the raw
            URI. When the request matched no handler at all (a 404, or a refusal
            before dispatch) it is the URI with its last segment replaced by `*`,
            which is the same redaction the request log uses.
          example: /api/v1/admin/users/{id}
        status:
          type: integer
          format: int32
          description: The status the client actually received.
          minimum: 100
          maximum: 599
          example: 200
        userId:
          type: string
          format: uuid
          nullable: true
          description: |
            The signed-in account, or null for an anonymous request. Deliberately
            not a foreign key: the row is written after the response, on another
            thread, and a hard reference would drop the evidence exactly when the
            subject no longer resolves.
          example: 00000000-0000-4000-8000-000000000002
        clientIp:
          type: string
          nullable: true
          description: |
            The caller's address as the server resolved it — the socket peer, or
            the client address a trusted proxy declared. Never a value taken
            straight from a caller-supplied `X-Forwarded-For`.
          example: 203.0.113.7
        requestId:
          type: string
          format: uuid
          description: |
            The same correlation id the response carried in `X-Request-Id`, which
            is what joins this row to the application log for that request.
          example: 99999999-8888-4777-8666-555555555555
        durationMs:
          type: integer
          format: int64
          description: How long the request took, in milliseconds.
          minimum: 0
          example: 42
        at:
          type: string
          format: date-time
          description: When the request completed, in UTC.
          example: 2026-09-04T18:30:00Z
      example:
        id: 00000000-0000-4000-8000-0000000000a1
        method: DELETE
        path: /api/v1/admin/users/{id}
        status: 200
        userId: 00000000-0000-4000-8000-000000000002
        clientIp: 203.0.113.7
        requestId: 99999999-8888-4777-8666-555555555555
        durationMs: 42
        at: 2026-09-04T18:30:00Z

    # ---- request bodies -----------------------------------------------------
    RegisterRequest:
      type: object
      description: |
        A sign-up. **The household is never taken from this body** — it comes from
        the invitation being redeemed, or from the one household this install has
        when self-serve sign-up is open. Anything else would be an insecure direct
        object reference at the front door.
      required: [email, password, displayName]
      properties:
        inviteToken:
          type: string
          nullable: true
          maxLength: 128
          description: |
            The raw token from an invitation link. Absent or blank means a
            self-serve sign-up, which is refused with 403 `registration-closed`
            unless an admin has opened registration.
          example: aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          minLength: 1
          maxLength: 320
          description: |
            Lower-cased and trimmed by the server. Must match the invitation's
            address when the invitation is bound to one.
          example: invitee@example.test
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: |
            Checked against the password policy after the field constraints; a
            refusal is 400 `password-policy` with a `fieldErrors` entry for
            `password`. The policy's own minimum is longer than one character.
          example: not-a-real-password-example
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          example: Example Member
        currency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because an
            explicit null is meaningful: absent or null defaults to `CAD`.
          example: CAD
        country:
          type: string
          nullable: true
          enum: [CA, US, null]
          description: |
            Same value set as `CountryCode`. Absent or null defaults to `CA`, and
            it also seeds the locale.
          example: CA
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: |
            An IANA zone id. **Unlike every other route, an unrecognised value
            here does not fail the request** — it falls back to `UTC`, because a
            browser reporting a zone this JRE does not know must not cost somebody
            their registration.
          example: America/Halifax
      example:
        inviteToken: aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        email: invitee@example.test
        password: not-a-real-password-example
        displayName: Example Member
        currency: CAD
        country: CA
        timezone: America/Halifax

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          minLength: 1
          maxLength: 320
          example: member@example.test
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          example: not-a-real-password-example
      example:
        email: member@example.test
        password: not-a-real-password-example

    TotpLoginRequest:
      type: object
      description: |
        The second half of a two-factor sign-in. `challengeToken` is **optional**:
        when it is absent (or blank) the server falls back to the
        `__Host-trove_totp_challenge` cookie, which is what the OIDC redirect
        leaves for a browser that never held a token.
      required: [code]
      properties:
        challengeToken:
          type: string
          nullable: true
          maxLength: 4096
          description: The token a password login returned. Wins over the cookie when both are present.
          example: eyJraWQiOiJrMSIsImFsZyI6IkhTMjU2In0.EXAMPLE-TOTP-CHALLENGE.not-a-real-signature
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            The current authenticator code, or a recovery code. Wide enough for
            both; the length of a valid code is not enforced here.
          example: '000000'
      example:
        code: '000000'

    RefreshRequest:
      type: object
      nullable: true
      description: |
        Optional in every sense: the whole body may be omitted, it may be a
        literal JSON `null`, and the one field in it may be absent. A browser
        sends nothing of substance and relies on `__Host-trove_refresh`; mobile
        sends the token.

        **`nullable: true` on the body is not decoration.** The shipped web client
        calls `api.post('/v1/auth/refresh', null)`
        (`apps/web/src/api/client.ts:229`), and axios with a JSON content type
        serialises that as the four bytes `null` rather than as an empty body. So
        an explicit JSON null is what the browser half of the contract actually
        puts on the wire on every session rotation, and the server has to accept
        it — a schema that refused it would describe a server that logs every web
        user out.
      properties:
        refreshToken:
          type: string
          nullable: true
          maxLength: 4096
          description: |
            The token to spend. Blank counts as absent, and the server then reads
            the cookie.
          example: cmVmcmVzaC10b2tlbi1FWEFNUExFLW5vdC1yZWFs
      example:
        refreshToken: cmVmcmVzaC10b2tlbi1FWEFNUExFLW5vdC1yZWFs

    PasswordChangeRequest:
      type: object
      description: |
        Both fields are required. `currentPassword` is the step-up: holding a
        session is not evidence of who is at the keyboard.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          example: not-a-real-password-example
        newPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: Checked against the password policy; a refusal is 400 `password-policy`.
          example: another-fake-password-example
      example:
        currentPassword: not-a-real-password-example
        newPassword: another-fake-password-example

    PasswordResetLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          minLength: 1
          maxLength: 320
          description: |
            An address in the calling admin's **own** household. Any other is 404
            `not-found` — resolving across the install would let an admin of one
            household mint a working reset link for a member of another.
          example: member@example.test
      example:
        email: member@example.test

    PasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The raw token from the reset link. Single use, one-hour life.
          example: cmVzZXQtdG9rZW4tRVhBTVBMRQ
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: |
            Checked against the policy **before** the token is consumed, so a
            refusal leaves the link usable.
          example: another-fake-password-example
      example:
        token: cmVzZXQtdG9rZW4tRVhBTVBMRQ
        password: another-fake-password-example

    TotpSetupRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: The account's current password. A wrong one is 403 `step-up-required`.
          example: not-a-real-password-example
      example:
        password: not-a-real-password-example

    TotpConfirmRequest:
      type: object
      description: No password here — the enrolment this confirms was started behind one.
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: One live code from the authenticator the secret was scanned into.
          example: '000000'
      example:
        code: '000000'

    TotpDisableRequest:
      type: object
      description: |
        Password **and** code. Either one alone would let through exactly the
        attacker the second factor exists to stop.
      required: [password, code]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          example: not-a-real-password-example
        code:
          type: string
          minLength: 1
          maxLength: 32
          example: '000000'
      example:
        password: not-a-real-password-example
        code: '000000'

    UpdateMeRequest:
      type: object
      description: |
        A partial update; every field is optional and an absent or null one is
        left untouched. There is no way to clear either field to null.
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 100
          description: |
            Trimmed by the server. Blank after trimming is 400 `validation-error`
            — the field constraint allows it, the service does not.
          example: Example Member
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: |
            An IANA zone id, and here an unrecognised one **is** 400
            `validation-error`.
          example: America/Halifax
      example:
        displayName: Example Member
        timezone: America/Halifax

    PreferencesUpdateRequest:
      type: object
      description: |
        A patch. **Absence and an explicit null are different for `region`:** the
        key being absent leaves the region alone, `null` (or `""`) clears it. The
        other three fields treat an explicit null as a no-op, exactly like
        absence. `currency` and `country` are not writable.
      properties:
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: An IANA zone id; an unrecognised one is 400 `validation-error`.
          example: America/Halifax
        locale:
          type: string
          nullable: true
          enum: [en-CA, en-US, null]
          description: |
            Same value set as `LocaleCode`; anything else is 400
            `validation-error`. The DTO's own field limit is 10 characters, which
            is why an over-long value is a validation error rather than a 500. An
            explicit null is a no-op, like absence.
          example: en-CA
        onboardingCompleted:
          type: boolean
          nullable: true
          example: true
        region:
          type: string
          nullable: true
          maxLength: 3
          description: |
            A province or state code; upper-cased and trimmed by the server. Send
            `null` to clear it.
          example: NS
      example:
        timezone: America/Halifax
        locale: en-CA
        onboardingCompleted: true
        region: NS

    CreateInviteRequest:
      type: object
      description: |
        Optional in full — `{}` is the normal case and so is omitting the body
        entirely. An invitation with no `email` may be redeemed by anyone holding
        the link.
      properties:
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+$'
          nullable: true
          maxLength: 320
          description: |
            Bind the invitation to one address. Lower-cased by the server;
            registration with a different address is refused as `invite-invalid`,
            the same answer an unknown token gets.
          example: invitee@example.test
        role:
          type: string
          nullable: true
          enum: [MEMBER, ADMIN, null]
          description: |
            Same value set as `UserRole`. Absent or null defaults to `MEMBER`.
          example: MEMBER
      example:
        email: invitee@example.test
        role: MEMBER

    AdminSettingsRequest:
      type: object
      description: A partial update; an absent or null field leaves the setting alone.
      properties:
        registrationOpen:
          type: boolean
          nullable: true
          example: true
        scheduledSyncEnabled:
          type: boolean
          nullable: true
          example: true
      example:
        registrationOpen: true

    AdminRoleRequest:
      type: object
      description: The role to give the member.
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
      example:
        role: ADMIN

    # ---- categories ----------------------------------------------------------
    CategoryResponse:
      type: object
      description: |
        A category, whether system-seeded or the household's own — one shape
        for every operation in this group, unlike the old service, which
        serialised the raw JPA entity (nested `parent`, a field literally named
        `system`) on GET while only POST used a DTO.
      required: [id, householdId, slug, name, icon, parentId, isSystem, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000d1
        householdId:
          type: string
          format: uuid
          nullable: true
          description: Null for a system category.
          example: 00000000-0000-4000-8000-000000000001
        slug:
          type: string
          maxLength: 60
          description: Server-derived stable identifier; never accepted from a request.
          example: food.coffee
        name:
          type: string
          maxLength: 100
          example: Coffee Shops
        icon:
          type: string
          nullable: true
          maxLength: 50
          example: coffee
        parentId:
          type: string
          format: uuid
          nullable: true
          example: null
        isSystem:
          type: boolean
          description: |
            `true` exactly when `householdId` is null. A system category cannot
            be renamed or deleted through `PUT`/`DELETE` on this resource.
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000d1
        householdId: null
        slug: food.coffee
        name: Coffee Shops
        icon: coffee
        parentId: null
        isSystem: true
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    CategoryRequest:
      type: object
      description: |
        `POST`/`PUT` body. Carries exactly `name`, `parentId` and `icon` — never
        `id`, `householdId` or `slug`, which is the G3 fix
        (docs/recovery/01-FINDINGS.md): the old service bound the JPA entity
        itself as the request body, so a client-supplied `id` matching an
        existing system category performed a merge over it.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The server also rejects a name that is all whitespace.
          example: Coffee Shops
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Must resolve to a category visible to the caller's household
            (system or its own), and must not create a cycle.
          example: null
        icon:
          type: string
          nullable: true
          maxLength: 50
          example: coffee
      example:
        name: Coffee Shops
        parentId: null
        icon: coffee

    CategoryRuleResponse:
      type: object
      description: |
        One household merchant rule. `merchant` is the normalised, stored
        pattern — not necessarily byte-for-byte what the caller originally
        typed, since normalisation (Unicode folding, punctuation and
        card/reference-suffix stripping) runs on every write.
      required: [id, householdId, merchant, matchType, categoryId, categoryName, confidence,
        source, priority, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        merchant:
          type: string
          maxLength: 255
          example: STARBUCKS
        matchType:
          $ref: '#/components/schemas/MatchType'
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000d1
        categoryName:
          type: string
          nullable: true
          description: |
            Null only if the referenced category has since become unreachable to
            this household — not expected in ordinary operation, since a
            category still referenced by a rule cannot be deleted.
          example: Coffee Shops
        confidence:
          $ref: '#/components/schemas/Confidence'
        source:
          $ref: '#/components/schemas/MappingSource'
        priority:
          type: integer
          format: int32
          description: |
            Lower sorts first. Breaks ties between PREFIX rules that could both
            match the same input merchant; written by the reorder endpoint.
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        householdId: 00000000-0000-4000-8000-000000000001
        merchant: STARBUCKS
        matchType: EXACT
        categoryId: 00000000-0000-4000-8000-0000000000d1
        categoryName: Coffee Shops
        confidence: '0.950'
        source: RULE
        priority: 0
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    CategoryRuleRequest:
      type: object
      description: |
        `POST`/`PUT` body for one rule. `merchant` is normalised server-side
        before it is stored or compared, so callers need not pre-normalise it.
        `confidence` is optional and defaults to `"0.900"` when absent.
      required: [merchant, matchType, categoryId]
      properties:
        merchant:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The raw pattern to match — a full merchant name for `EXACT`, or a
            leading fragment for `PREFIX`. The server also rejects a value that
            is all whitespace, or that normalises to nothing at all.
          example: Starbucks
        matchType:
          $ref: '#/components/schemas/MatchType'
        categoryId:
          type: string
          format: uuid
          description: |
            Must resolve to a category visible to the caller's household
            (system or its own).
          example: 00000000-0000-4000-8000-0000000000d1
        confidence:
          $ref: '#/components/schemas/Confidence'
      example:
        merchant: Starbucks
        matchType: EXACT
        categoryId: 00000000-0000-4000-8000-0000000000d1
        confidence: '0.950'

    ReorderRulesRequest:
      type: object
      description: |
        Sets each rule's `priority` to its index in `orderedIds` (`0` first).
        Every id must already belong to one of the caller's household's own
        `RULE`-sourced rows, or the whole request is refused before anything is
        written — there is no partial reorder.
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          example:
            - 00000000-0000-4000-8000-0000000000e1
            - 00000000-0000-4000-8000-0000000000e2
      example:
        orderedIds:
          - 00000000-0000-4000-8000-0000000000e1
          - 00000000-0000-4000-8000-0000000000e2

    DryRunRequest:
      type: object
      description: |
        "Test this rule against merchant X" — runs the household's own rules,
        the built-in community defaults and the `Uncategorised` fallback
        against `merchant` and returns what it would resolve to. Writes
        nothing.
      required: [merchant]
      properties:
        merchant:
          type: string
          minLength: 1
          maxLength: 500
          example: STARBUCKS #4471
        description:
          type: string
          nullable: true
          maxLength: 500
          description: Reserved for a future description-based rule tier; not yet used for matching.
          example: null
      example:
        merchant: STARBUCKS #4471

    CategorisationResultResponse:
      type: object
      description: The dry-run result — a direct projection of `CategorisationService`'s pipeline output.
      required: [categoryId, categoryName, confidence, source]
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          description: |
            Never absent — the pipeline always resolves to a category, falling
            back to `Uncategorised` rather than answering "none".
          example: 00000000-0000-4000-8000-0000000000d1
        categoryName:
          type: string
          example: Coffee Shops
        confidence:
          $ref: '#/components/schemas/Confidence'
        source:
          type: string
          nullable: true
          enum: [RULE, USER, AI, null]
          description: |
            Null when the match came from the built-in community-registry tier
            or the `Uncategorised` fallback — neither is a persisted household
            row, so neither can honestly claim `RULE`, `USER` or `AI`.
          example: RULE
      example:
        categoryId: 00000000-0000-4000-8000-0000000000d1
        categoryName: Coffee Shops
        confidence: '0.990'
        source: null

    MatchType:
      type: string
      enum: [EXACT, PREFIX]
      description: |
        `EXACT` requires the stored value to equal the normalised merchant
        string; `PREFIX` requires the stored value to be a leading substring of
        it.
      example: EXACT

    MappingSource:
      type: string
      enum: [RULE, USER, AI]
      description: |
        How a merchant mapping came to exist: `RULE` — created explicitly
        through this API; `USER` — learned from a member correcting a
        transaction's category; `AI` — a confident AI categorisation result.
        Only `RULE` rows are reachable through the rules controller.
      example: RULE

    Confidence:
      type: string
      pattern: '^\d+(\.\d+)?$'
      description: |
        A decimal string in `[0.000, 1.000]`, serialised as a string like every
        other `BigDecimal` field in this API (never a JSON number, so a client's
        float type cannot round it).
      example: '0.900'

    # ---- ai -----------------------------------------------------------------
    PrivacyTier:
      type: string
      description: |
        How far the caller lets their own data travel. `LOCAL_ONLY` means the
        endpoint is treated as a local, private model and payloads classified as
        sensitive may be sent to it; `CLOUD_OK` means the member accepts that the
        endpoint is somebody else's server and the sensitive payloads are held
        back. It is a per-member statement about a per-member endpoint, and it
        governs what the server sends, not what the endpoint promises.
      enum: [LOCAL_ONLY, CLOUD_OK]
      example: CLOUD_OK

    AiSettingsResponse:
      type: object
      description: |
        The caller's own AI configuration. **The API key is never here in any
        form** — `hasApiKey` is the whole of what this response says about it.
        Every field is always present; the ones that can be null say so.
      required:
        - enabled
        - endpointUrl
        - hasApiKey
        - model
        - visionModel
        - allowPrivateEndpoint
        - privacyTier
        - connectTimeoutMs
        - readTimeoutMs
        - lastTestAt
        - lastTestOk
        - updatedAt
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: |
            Whether AI features are on for this member. False until they turn it
            on, on every install; nothing in Trove requires an AI endpoint.
          example: true
        endpointUrl:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            The OpenAI-compatible base URL, e.g. `https://api.example.test/v1`.
            Null when none is configured.
          example: https://ai.example.test/v1
        hasApiKey:
          type: boolean
          description: Whether a key is stored. The key itself never leaves the server.
          example: true
        model:
          type: string
          nullable: true
          maxLength: 200
          description: The chat model id, as the endpoint names it. Null when unset.
          example: qwen2.5:14b
        visionModel:
          type: string
          nullable: true
          maxLength: 200
          description: |
            The model used for receipt images. Optional even with AI on — without
            it, receipts fall back to the manual path rather than failing.
          example: qwen2.5-vl:7b
        allowPrivateEndpoint:
          type: boolean
          description: |
            This member's own opt-in to a private, loopback or link-local target.
            It is one of two keys: the install must also set
            `TROVE_EGRESS_ALLOW_PRIVATE`, and a private target is reachable only
            when both are true.
          example: false
        privacyTier:
          $ref: '#/components/schemas/PrivacyTier'
        connectTimeoutMs:
          type: integer
          format: int32
          minimum: 100
          maximum: 60000
          description: |
            Milliseconds to establish the connection, capped on use by the
            install's `TROVE_HTTP_CONNECT_TIMEOUT_MS`. The stored value is what
            was asked for; the effective one is the smaller of the two.
          example: 5000
        readTimeoutMs:
          type: integer
          format: int32
          minimum: 1000
          maximum: 600000
          description: |
            Milliseconds to wait for an answer, capped on use at four times the
            install's `TROVE_HTTP_READ_TIMEOUT_MS` (120 s at the default). The
            stored value is what was asked for; the effective one is the smaller
            of the two.
          example: 120000
        lastTestAt:
          type: string
          format: date-time
          nullable: true
          description: When `POST /v1/ai/settings/test` last ran. Null if never.
          example: '2026-09-04T16:41:02.113Z'
        lastTestOk:
          type: boolean
          nullable: true
          description: Whether that last test succeeded. Null if never run.
          example: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the row was last written. Null for a member who has never saved
            anything and is looking at the defaults.
          example: '2026-09-04T16:40:55.802Z'
      example:
        enabled: true
        endpointUrl: https://ai.example.test/v1
        hasApiKey: true
        model: qwen2.5:14b
        visionModel: qwen2.5-vl:7b
        allowPrivateEndpoint: false
        privacyTier: CLOUD_OK
        connectTimeoutMs: 5000
        readTimeoutMs: 120000
        lastTestAt: '2026-09-04T16:41:02.113Z'
        lastTestOk: true
        updatedAt: '2026-09-04T16:40:55.802Z'

    AiSettingsUpdateRequest:
      type: object
      description: |
        A **replace**. `enabled`, `allowPrivateEndpoint` and `privacyTier` are
        required; every other field is written as sent, so omitting a nullable one
        clears it.

        `apiKey` is the exception and cannot be otherwise: it is write-only, so it
        never comes back from a GET and a client has nothing to send back. Absent
        or null keeps the stored key; a non-blank value replaces it; a blank one
        is 400 `validation-error` rather than a silent clear, because "clear the
        key" has its own route.

        With `enabled: true`, `endpointUrl` and `model` are required — enabling a
        feature that cannot run is a configuration error worth refusing at the
        moment it is made rather than at the first receipt.
      required: [enabled, allowPrivateEndpoint, privacyTier]
      properties:
        enabled:
          type: boolean
          example: true
        endpointUrl:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            An absolute `http`/`https` URL with no credentials before the host.
            `https` unless both private-target keys are set.

            Checked against the egress policy when it is new or changed, and on
            any save that turns AI on or opts into private targets; and checked
            again, with the address re-pinned, on every outbound call, which is
            the control. A save that only turns AI off or withdraws
            `allowPrivateEndpoint` is never refused for the URL it resends —
            those are the edits that make an install safer, and PUT is a replace
            so a client has to resend the stored URL to make them.
          example: https://ai.example.test/v1
        apiKey:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          description: |
            Write-only. Stored AES-GCM-encrypted and never returned. Absent or
            null leaves the stored key alone; the server also rejects an
            all-whitespace value.
          example: sk-example-not-a-real-key
        model:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: |
            The chat model id. Null clears it; a blank or all-whitespace string
            is 400 `validation-error`, because a form that cannot tell "left
            alone" from "emptied" should not be able to wipe a working model
            with a 200.
          example: qwen2.5:14b
        visionModel:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: |
            The receipt-image model id, or null to clear. Blank is refused, as
            for `model`.
          example: qwen2.5-vl:7b
        allowPrivateEndpoint:
          type: boolean
          description: |
            This member's half of the private-target opt-in. Setting it does not
            by itself make a LAN address reachable — `TROVE_EGRESS_ALLOW_PRIVATE`
            has to be on as well.
          example: false
        privacyTier:
          $ref: '#/components/schemas/PrivacyTier'
        connectTimeoutMs:
          type: integer
          format: int32
          nullable: true
          minimum: 100
          maximum: 60000
          description: Absent or null keeps the current value.
          example: 5000
        readTimeoutMs:
          type: integer
          format: int32
          nullable: true
          minimum: 1000
          maximum: 600000
          description: Absent or null keeps the current value.
          example: 120000
      example:
        enabled: true
        endpointUrl: https://ai.example.test/v1
        apiKey: sk-example-not-a-real-key
        model: qwen2.5:14b
        visionModel: qwen2.5-vl:7b
        allowPrivateEndpoint: false
        privacyTier: CLOUD_OK
        connectTimeoutMs: 5000
        readTimeoutMs: 120000

    AiConnectionTestResponse:
      type: object
      description: |
        A successful connection test. Every failure is an error response with one
        of the typed AI slugs instead, so `ok` is always `true` here — it exists
        so the shape reads correctly in a client that logs the payload.
      required: [ok, endpointHost, checkedAt, modelCount, visionModelPresent]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        endpointHost:
          type: string
          description: |
            The host that was contacted, without the scheme, path or query — enough
            for a member to confirm they reached what they meant to, and nothing
            that could carry a token in a query string.
          example: ai.example.test
        checkedAt:
          type: string
          format: date-time
          description: When the test ran; also written to `lastTestAt`.
          example: '2026-09-04T16:41:02.113Z'
        modelCount:
          type: integer
          format: int32
          description: How many models the endpoint listed.
          example: 12
        visionModelPresent:
          type: boolean
          nullable: true
          description: |
            Whether the configured `visionModel` is among them. Null when none is
            configured. A vision model that is absent is reported rather than
            refused: receipts fall back to the manual path, so it is a warning,
            where a missing chat model is 502 `ai-model-missing`.
          example: true
      example:
        ok: true
        endpointHost: ai.example.test
        checkedAt: '2026-09-04T16:41:02.113Z'
        modelCount: 12
        visionModelPresent: true

    AiModel:
      type: object
      description: |
        One entry of the endpoint's `GET /models`, narrowed to the three fields
        every OpenAI-compatible server sets. Anything else the endpoint returns is
        dropped rather than passed through: this is third-party output and the
        response schema is closed.
      required: [id, ownedBy, created]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 200
          description: The model id, to be sent back as `model` in the settings.
          example: qwen2.5:14b
        ownedBy:
          type: string
          nullable: true
          maxLength: 200
          description: The endpoint's `owned_by`, when it sets one.
          example: library
        created:
          type: integer
          format: int64
          nullable: true
          description: The endpoint's `created`, seconds since the epoch, when it sets one.
          example: 1735689600
      example:
        id: qwen2.5:14b
        ownedBy: library
        created: 1735689600

    # ---- coach + insights (collapse step 13) --------------------------------
    ChatTurnRole:
      type: string
      description: |
        Who said a turn. `SYSTEM` never appears in a request or a response: the
        system prompt and the ledger context block are the server's own
        construction and are not part of the member's conversation.
      enum: [USER, ASSISTANT]
      example: USER

    ChatCompletionRequest:
      type: object
      description: |
        The turn being sent. **The last entry is the question** and it must be
        `role: user`; anything before it is ignored, because the history the
        model sees is rebuilt from the server's own store for the session named
        by `X-Session-Id`. A client that sent a fabricated `assistant` turn would
        otherwise be putting words into the coach's mouth.
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            The turns the client is sending, oldest first. Only the last is used.
          items:
            $ref: '#/components/schemas/ChatTurnRequest'
      example:
        messages:
          - role: user
            content: What did I spend the most on this month?

    ChatTurnRequest:
      type: object
      description: One turn in a `ChatCompletionRequest`.
      required: [role, content]
      properties:
        role:
          type: string
          description: |
            `user` or `assistant`, lower case, the OpenAI-compatible spelling both
            clients already send. The last turn must be `user`; a request whose
            last turn is anything else is 400 `validation-error`.
          enum: [user, assistant]
          example: user
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            The text of the turn. The server also rejects an all-whitespace
            value. Four thousand characters is the cap on one question; the
            conversation as a whole is bounded by the history window instead.
          example: What did I spend the most on this month?

    ChatCompletionResponse:
      type: object
      description: |
        A whole answer, for `stream=false`. Deliberately **not** OpenAI's
        `choices[]` shape: nothing in Trove routes on a choice index, one answer
        is returned, and a client that has to reach through two arrays to find it
        is being asked to model a protocol it does not speak. The streaming body
        keeps the OpenAI delta frames because that is what both clients' SSE
        readers parse.
      required: [sessionId, role, content, model, createdAt]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
          description: The conversation this answer belongs to; also in `X-Session-Id`.
          example: 00000000-0000-4000-8000-0000000000c1
        role:
          type: string
          enum: [ASSISTANT]
          description: Always `ASSISTANT`. Present so the shape matches a history entry.
          example: ASSISTANT
        content:
          type: string
          description: |
            The model's text, with control characters removed and the length
            capped. It is rendered to a human and never interpreted — no id, no
            category, no URL the server fetches and no command is ever taken
            from it.
          example: You spent the most on Groceries this month — $412.50 CAD across 14 purchases.
        model:
          type: string
          nullable: true
          maxLength: 100
          description: |
            The model the endpoint says it used, which need not be the one asked
            for. Null when the endpoint reported none.
          example: qwen2.5:14b
        createdAt:
          type: string
          format: date-time
          description: When the answer was stored.
          example: '2026-09-05T18:04:11Z'

    CoachMessageResponse:
      type: object
      description: |
        One stored turn, decrypted for its owner. The content column holds
        AES-GCM ciphertext at rest and there is no plaintext copy anywhere — no
        preview, no derived title, no search index.
      required: [id, sessionId, role, content, model, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000d1
        sessionId:
          type: string
          format: uuid
          description: The conversation this turn belongs to.
          example: 00000000-0000-4000-8000-0000000000c1
        role:
          $ref: '#/components/schemas/ChatTurnRole'
        content:
          type: string
          example: What did I spend the most on this month?
        model:
          type: string
          nullable: true
          maxLength: 100
          description: The model that produced an `ASSISTANT` turn; null on a `USER` turn.
          example: qwen2.5:14b
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T18:04:11Z'

    InsightResponse:
      type: object
      description: |
        One weekly note about the caller's own week. Stored encrypted for the
        same reason as a conversation: a sentence naming what a member spent on
        is that member's ledger.
      required: [id, weekStart, content, delivered, createdAt, deliveredAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        weekStart:
          type: string
          format: date
          description: |
            The Monday of the week this note describes, in the **recipient's**
            timezone — not the server's. It is also the idempotence key: at most
            one note exists per member per `weekStart`.
          example: '2026-08-31'
        content:
          type: string
          description: |
            The note, decrypted for its owner. Model output, rendered and never
            interpreted.
          example: You spent $412.50 CAD less than the week before, mostly on dining out.
        delivered:
          type: boolean
          description: |
            Whether this note has been handed to the member anywhere beyond this
            route. Reading this page does not set it — a GET stays safe.
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-08-31T08:30:04Z'
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: When `delivered` became true, or null.
          example: null

    # ---- accounts, transactions, dashboard (collapse step 6) -----------------
    MoneyAmount:
      type: string
      description: |
        A monetary amount as a decimal **string**, never a JSON number
        (§5.4): the server serialises every `BigDecimal` with a global
        serializer so that a client cannot parse a ledger figure into an
        IEEE-754 double. Stored as `NUMERIC(19,4)`, so a value read back from
        the database carries four decimal places (`"12.3400"`); a value sent to
        the server may carry fewer. Never scientific notation.
      pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
      example: '12.3400'

    SourceKind:
      type: string
      description: |
        Where an account's transactions come from. `MANUAL` is the
        credential-less account (gap P2-13): nothing fetches for it, and it is
        the only kind that accepts a hand-entered transaction. The other three
        are fetched or uploaded: SIMPLEFIN accounts are fetched from the
        SimpleFIN bridge (`POST /v1/accounts/exchange-setup-token`, then sync);
        OFX and CSV are uploaded through `POST /v1/imports`.
      enum: [SIMPLEFIN, OFX, CSV, MANUAL]
      example: MANUAL

    AccountType:
      type: string
      description: The financial product an account is, for display and reporting.
      enum: [CHECKING, SAVINGS, CREDIT_CARD, INVESTMENT, OTHER]
      example: CHECKING

    AccountSyncStatus:
      type: string
      description: |
        The state of the account's most recent sync. `SYNCING` is a **claim**,
        not a hint: it is written by a conditional update that only one caller
        can win, which is what makes two overlapping syncs impossible rather
        than merely unlikely.
      enum: [PENDING, SYNCING, OK, ERROR]
      example: PENDING

    SyncRunStatus:
      type: string
      description: |
        How one sync run ended. `PARTIAL_FAILURE` means the fetch succeeded and
        some rows were refused — `transactionsFailed` says how many. `FAILED`
        means the source itself could not be reached, and nothing was written.
      enum: [RUNNING, SUCCESS, PARTIAL_FAILURE, FAILED]
      example: SUCCESS

    TransactionType:
      type: string
      description: |
        What kind of movement a transaction is. All seven values of the shared
        ingestion vocabulary: a budget aggregate nets a `REFUND` against
        `DEBIT` spend, and `TRANSFER` legs are excluded from spend and income
        entirely.
      enum: [DEBIT, CREDIT, TRANSFER, FEE, INTEREST, REFUND, OTHER]
      example: DEBIT

    AccountResponse:
      type: object
      description: |
        One connected account. The encrypted source credentials are never part
        of this shape — the DTO has no field for them at all, rather than a
        field somebody has to remember to strip.
      required: [id, householdId, createdBy, sourceKind, displayName, institution, accountType,
        currency, syncStatus, lastSyncedAt, errorMessage, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000a1
        householdId:
          type: string
          format: uuid
          description: The owning household — the scope, and the same for every member.
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member who added the account, for audit only. Null once that
            account is deleted; it never affects who can see the row.
          example: 00000000-0000-4000-8000-000000000002
        sourceKind:
          $ref: '#/components/schemas/SourceKind'
        displayName:
          type: string
          maxLength: 200
          example: Everyday Chequing
        institution:
          type: string
          nullable: true
          maxLength: 200
          example: Example Credit Union
        accountType:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        syncStatus:
          $ref: '#/components/schemas/AccountSyncStatus'
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until a sync has succeeded at least once.
          example: '2026-09-04T14:00:00Z'
        errorMessage:
          type: string
          nullable: true
          description: Why the last sync failed; null once one succeeds.
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'

    AccountRequest:
      type: object
      description: |
        `POST /v1/accounts` body. Carries no id, no household and no
        credentials: the household comes from the signed token and a source's
        credentials are exchanged by their own flow, never posted here.
      required: [sourceKind, displayName, accountType]
      properties:
        sourceKind:
          $ref: '#/components/schemas/SourceKind'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: The server also rejects a label that is all whitespace.
          example: Everyday Chequing
        institution:
          type: string
          nullable: true
          maxLength: 200
          example: Example Credit Union
        accountType:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      example:
        sourceKind: MANUAL
        displayName: Cash
        institution: null
        accountType: OTHER
        currency: CAD

    AccountUpdateRequest:
      type: object
      description: |
        `PUT /v1/accounts/{id}` body. `sourceKind` and `currency` are absent on
        purpose — see the operation.
      required: [displayName, accountType]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          example: Everyday Chequing
        institution:
          type: string
          nullable: true
          maxLength: 200
          example: Example Credit Union
        accountType:
          $ref: '#/components/schemas/AccountType'
      example:
        displayName: Everyday Chequing
        institution: Example Credit Union
        accountType: CHECKING

    SyncLogResponse:
      type: object
      description: |
        One sync run. Append-only: written `RUNNING` when the run starts and
        updated exactly once when it ends, each in its own short transaction so
        that a partial failure can still be recorded.
      required: [id, householdId, accountId, sourceKind, status, transactionsFetched,
        transactionsNew, transactionsUpdated, transactionsSkipped, transactionsFailed,
        errorMessage, startedAt, completedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000c1
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        accountId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000a1
        sourceKind:
          $ref: '#/components/schemas/SourceKind'
        status:
          $ref: '#/components/schemas/SyncRunStatus'
        transactionsFetched:
          type: integer
          format: int32
          description: How many rows the source offered.
          example: 12
        transactionsNew:
          type: integer
          format: int32
          description: Rows inserted.
          example: 12
        transactionsUpdated:
          type: integer
          format: int32
          description: Rows already present that this run changed — a pending row that posted.
          example: 0
        transactionsSkipped:
          type: integer
          format: int32
          description: Rows already present and unchanged.
          example: 0
        transactionsFailed:
          type: integer
          format: int32
          description: Rows the run refused. Non-zero exactly when `status` is `PARTIAL_FAILURE`.
          example: 0
        errorMessage:
          type: string
          nullable: true
          description: Set on `FAILED` and on `PARTIAL_FAILURE`; null on `SUCCESS`.
          example: null
        startedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the run is `RUNNING`.
          example: '2026-09-04T14:00:03Z'

    # ---- setup-token exchange and file import (step 7) ----------------------
    ExchangeSetupTokenRequest:
      type: object
      description: |
        A one-time setup token to exchange for a permanent connection.
      required: [sourceKind, setupToken]
      properties:
        sourceKind:
          type: string
          description: |
            Which bridge the token belongs to. Only SimpleFIN issues setup
            tokens; the field exists so a second bridge can be added without a
            second route.
          enum: [SIMPLEFIN]
          example: SIMPLEFIN
        setupToken:
          type: string
          description: |
            The base64 token the member copied from their bridge. It decodes to
            a one-time claim URL. The server also rejects an all-whitespace
            value. Never logged, never echoed in an error.
          minLength: 1
          maxLength: 4096
          example: aHR0cHM6Ly9icmlkZ2UuZXhhbXBsZS5jb20vc2ltcGxlZmluL2NsYWltL2RlbW8=
      example:
        sourceKind: SIMPLEFIN
        setupToken: aHR0cHM6Ly9icmlkZ2UuZXhhbXBsZS5jb20vc2ltcGxlZmluL2NsYWltL2RlbW8=

    ExchangeSetupTokenResponse:
      type: object
      description: |
        What the exchange produced. `accountIds` is the list a client counts to
        tell the member how many accounts were connected; a re-exchange returns
        the same ids rather than new ones.
      required: [accountIds, syncLogs]
      additionalProperties: false
      properties:
        accountIds:
          type: array
          description: One id per bridge account, created or reused, in bridge order.
          items:
            type: string
            format: uuid
          example: ['00000000-0000-4000-8000-0000000000a1']
        syncLogs:
          type: array
          description: |
            The initial sync run for each of those accounts, in the same order.
            A run that could not reach the bridge is a `FAILED` log here, not an
            HTTP error: the accounts were still connected.
          items:
            $ref: '#/components/schemas/SyncLogResponse'

    ImportSourceKind:
      type: string
      description: |
        The two source kinds that come from a file. `SIMPLEFIN` is fetched over
        the network and `MANUAL` is typed in, so neither has a file to batch —
        which is also what the `import_batch.source_kind` CHECK says.
      enum: [CSV, OFX]
      example: CSV

    ImportBatchStatus:
      type: string
      description: |
        Where a batch is. `PREVIEW` has written nothing; `COMMITTED` has written
        its rows; `UNDONE` has had them taken back out. The transitions are
        one-way: a committed batch is never previewed again and an undone batch
        is never re-committed.
      enum: [PREVIEW, COMMITTED, UNDONE]
      example: PREVIEW

    ImportRowVerdict:
      type: string
      description: |
        What committing would do with one parsed row. `DUPLICATE` matched a
        stored transaction on its identifier; `FUZZY_DUPLICATE` matched one by
        date and amount because the row carries no identifier of its own;
        `INVALID` cannot be accepted at all and `reason` says why.
      enum: [NEW, DUPLICATE, FUZZY_DUPLICATE, INVALID]
      example: NEW

    CsvColumnMapping:
      type: object
      description: |
        Which column of a CSV file holds which field. Every column name is the
        header text as it appears in the file; a file with no header row is
        addressed by ordinal written as a decimal string.

        Either `amountColumn` alone (a single signed column, the common case) or
        `debitColumn` **and** `creditColumn` together (the two-column layout) is
        populated, never both shapes at once. A row with both a debit and a
        credit cell filled in is refused rather than netted — it is a file the
        sniffer has misread, and guessing would silently halve a statement.

        `balanceColumn` is recognised so that a running-balance column is not
        mistaken for an amount. Its values are never stored.
      required: [dateColumn, descriptionColumn, amountColumn, debitColumn, creditColumn,
        currencyColumn, balanceColumn, dateFormat, delimiter, charset, hasHeader]
      additionalProperties: false
      properties:
        dateColumn:
          type: string
          nullable: true
          example: Date
        descriptionColumn:
          type: string
          nullable: true
          example: Description
        amountColumn:
          type: string
          nullable: true
          example: Amount
        debitColumn:
          type: string
          nullable: true
          example: null
        creditColumn:
          type: string
          nullable: true
          example: null
        currencyColumn:
          type: string
          nullable: true
          description: Optional. When absent the account's own currency is used, never a literal.
          example: null
        balanceColumn:
          type: string
          nullable: true
          description: Recognised and deliberately not persisted.
          example: null
        dateFormat:
          type: string
          nullable: true
          description: |
            A `java.time` pattern such as `yyyy-MM-dd`, `dd/MM/yyyy` or
            `MM/dd/yyyy`. Null while the file's dates are ambiguous and the
            member has not chosen — see `dateFormatCandidates`.
          example: dd/MM/yyyy
        delimiter:
          type: string
          description: The field separator the sniffer settled on.
          enum: [',', ';', "\t", '|']
          example: ','
        charset:
          type: string
          description: |
            How the bytes were decoded. A UTF-8 byte-order mark is consumed
            rather than becoming part of the first header name.
          example: UTF-8
        hasHeader:
          type: boolean
          description: Whether the first line is a header row rather than data.
          example: true

    CsvColumnMappingRequest:
      type: object
      description: |
        An adjustment to the mapping the preview detected. Every field is
        optional and an omitted one keeps its detected value; this is what the
        member sends after correcting a column the sniffer guessed wrong, or
        after choosing between two candidate date formats.

        **`amountColumn` and the `debitColumn`/`creditColumn` pair are mutually
        exclusive.** A file's amount arrives either as one signed column or as a
        debit/credit pair, never both, so naming `amountColumn` here clears any
        detected pair and naming either half of the pair clears any detected
        `amountColumn`. That is what makes a correction of the sniffer's shape
        actually take effect on the commit; a request that names both is read
        the way the parser reads it, so the pair wins. An empty string is not
        naming a column: it clears the field it is sent for without switching
        shape.
      properties:
        dateColumn:
          type: string
          nullable: true
        descriptionColumn:
          type: string
          nullable: true
        amountColumn:
          type: string
          nullable: true
        debitColumn:
          type: string
          nullable: true
        creditColumn:
          type: string
          nullable: true
        currencyColumn:
          type: string
          nullable: true
        balanceColumn:
          type: string
          nullable: true
        dateFormat:
          type: string
          nullable: true
          description: One of the `dateFormatCandidates` the preview offered, or any valid pattern.
          example: dd/MM/yyyy
        hasHeader:
          type: boolean
          nullable: true
      example:
        dateFormat: dd/MM/yyyy

    DateFormatCandidate:
      type: object
      description: |
        One way the file's dates could be read, with the values that make the
        question unanswerable from the data alone. `03/09/2026` is the third of
        September in Canada and the ninth of March in the United States, and no
        amount of sniffing can tell which the member's bank meant — so the
        preview offers both and the commit uses the one that comes back.
      required: [format, sampleValues, interpretedDates]
      additionalProperties: false
      properties:
        format:
          type: string
          description: A `java.time` pattern to send back on the commit.
          example: dd/MM/yyyy
        sampleValues:
          type: array
          description: Date cells taken from the file, in the order they appear.
          items:
            type: string
          example: ['03/09/2026', '11/09/2026']
        interpretedDates:
          type: array
          description: What those same cells mean under `format`, position for position.
          items:
            type: string
            format: date
          example: ['2026-09-03', '2026-09-11']

    ImportPreviewRow:
      type: object
      description: |
        One parsed row as the member's own preview shows it, before anything is
        written. Every field is nullable because a row that cannot be parsed is
        still worth showing with the reason it was refused.
      required: [ordinal, date, description, merchantName, amount, currency, type, verdict, reason]
      additionalProperties: false
      properties:
        ordinal:
          type: integer
          format: int32
          description: The row's position in the file, counting data rows from 1.
          example: 1
        date:
          type: string
          format: date
          nullable: true
          example: '2026-09-03'
        description:
          type: string
          nullable: true
          example: GROCERY STORE #123
        merchantName:
          type: string
          nullable: true
          example: Grocery Store
        amount:
          type: string
          nullable: true
          description: |
            The absolute value as a decimal string; `type` carries the
            direction. Same convention and same wire form as `MoneyAmount`.
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          example: '42.5000'
        currency:
          type: string
          enum: [CAD, USD]
          description: |
            The currency this row would be recorded in: the file's own value
            where it states one this server supports, and the account's
            otherwise — a blank cell and a code such as `GBP` mean the same
            thing here and are shown the same way. Always stated, so a client
            never has to know the account's currency to render the preview.
          example: CAD
        type:
          type: string
          nullable: true
          enum: [DEBIT, CREDIT, TRANSFER, FEE, INTEREST, REFUND, OTHER, null]
          example: DEBIT
        verdict:
          $ref: '#/components/schemas/ImportRowVerdict'
        reason:
          type: string
          nullable: true
          description: Why the row is `INVALID`; null otherwise. Never quotes the row itself.
          example: null

    ImportPreviewResponse:
      type: object
      description: |
        An uploaded batch and what committing it would do. **Nothing in this
        answer has been written to the ledger** — the counts are a projection
        against the household's ledger as it stands right now.

        `rows` is a sample, not the file: enough for the member to see that the
        columns were read the way they meant them, capped so that a fifty-thousand
        row statement does not become a fifty-thousand row response.

        `mapping` is **absent**, not null, on an OFX batch — an OFX file has no
        columns to map. It is written that way rather than as a nullable member
        because a `$ref` with a `nullable` sibling is invisible to the request
        validator and is a Redocly `nullable-type-sibling` error.
      required: [id, householdId, accountId, sourceKind, status, originalFilename, rowCount,
        newCount, duplicateCount, fuzzyDuplicateCount, invalidCount,
        dateFormatCandidates, rows, warnings, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000d1
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        accountId:
          type: string
          format: uuid
          description: |
            The account the rows will be written to — the one the caller named,
            or the one the file's own `ACCTID` resolved to.
          example: 00000000-0000-4000-8000-0000000000a1
        sourceKind:
          $ref: '#/components/schemas/ImportSourceKind'
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        originalFilename:
          type: string
          nullable: true
          description: |
            The name the browser sent, kept for display only. It is never part
            of a storage path: keys are minted by the object store.
          example: statement-2026-09.csv
        rowCount:
          type: integer
          format: int32
          description: Data rows the file yielded, refused ones included.
          example: 42
        newCount:
          type: integer
          format: int32
          description: Rows that would be inserted.
          example: 40
        duplicateCount:
          type: integer
          format: int32
          description: Rows already in the ledger under the same identifier.
          example: 2
        fuzzyDuplicateCount:
          type: integer
          format: int32
          description: |
            Rows matched by date and amount because they carry no identifier of
            their own. Zero for CSV and OFX, which both give every row a stable
            id — it is reported so that a source that stops doing so is visible.
          example: 0
        invalidCount:
          type: integer
          format: int32
          description: Rows that cannot be accepted at all.
          example: 0
        mapping:
          $ref: '#/components/schemas/CsvColumnMapping'
        dateFormatCandidates:
          type: array
          description: |
            Populated only when the file's dates are genuinely ambiguous.
            Empty otherwise, which is the normal case.
          items:
            $ref: '#/components/schemas/DateFormatCandidate'
        rows:
          type: array
          description: |
            The first rows of the file as they were parsed. Empty for a batch
            that is no longer in `PREVIEW`.
          items:
            $ref: '#/components/schemas/ImportPreviewRow'
        warnings:
          type: array
          description: |
            Things the member should read before committing — a column that was
            recognised but is not used, a batch that is past previewing. Never
            quotes file content.
          items:
            type: string
          example: []
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T03:20:00Z'

    ImportCommitRequest:
      type: object
      description: |
        An optional adjustment to what the preview detected. An absent body, or
        an absent `mapping`, commits exactly what the preview described. Fields
        the mapping omits keep their detected values.

        `mapping` is CSV only. Sending it on an OFX batch is refused: an OFX file
        has no columns to map, and silently ignoring the field would let a member
        believe an adjustment took effect. Omit the member entirely rather than
        sending an explicit null.
      properties:
        mapping:
          $ref: '#/components/schemas/CsvColumnMappingRequest'
      example:
        mapping:
          dateFormat: dd/MM/yyyy

    TransactionResponse:
      type: object
      description: |
        One transaction, however it got here — fetched, imported or entered by
        hand. `amount` is the absolute value and `type` carries the direction;
        that is the convention every source normalises onto, so a client never
        has to guess a sign convention per institution.
      required: [id, householdId, accountId, createdBy, providerTransactionId, amount, currency,
        type, description, merchantName, date, postedAt, pending, manual, categoryId,
        transferGroupId, importBatchId, tags, notes, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        accountId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000a1
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: The member whose action produced the row, for audit only.
          example: 00000000-0000-4000-8000-000000000002
        providerTransactionId:
          type: string
          nullable: true
          maxLength: 255
          description: |
            The identifier the source gave this transaction — the exact
            deduplication key. Null for a hand-entered row, and for a source
            that offers no stable id.
          example: simplefin-2026-09-04-0001
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        type:
          $ref: '#/components/schemas/TransactionType'
        description:
          type: string
          nullable: true
          description: The raw text the source supplied.
          example: SQ *BLUE DOOR COFFEE
        merchantName:
          type: string
          nullable: true
          maxLength: 255
          example: Blue Door Coffee
        date:
          type: string
          format: date
          description: The calendar date the source reported, not a settlement instant.
          example: '2026-09-04'
        postedAt:
          type: string
          format: date-time
          nullable: true
          description: When it settled; null while `pending` is true.
          example: '2026-09-04T18:12:00Z'
        pending:
          type: boolean
          description: Authorised but not yet settled.
          example: false
        manual:
          type: boolean
          description: |
            True for a hand-entered row. It is what stops a sync or an import
            undo from overwriting or removing it, and it is the only kind of row
            `DELETE /v1/transactions/{id}` will remove.
          example: false
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: |
            The category this row counts against. Set on insert by the
            categorisation pipeline (or by the caller on manual entry) and
            changed by a `PATCH`. Null for a row written before a category could
            be resolved, or after a member clears it with `PATCH {categoryId:
            null}`.
          example: 00000000-0000-4000-8000-0000000000d1
        transferGroupId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on both legs of an internal transfer, by the pairing job or by
            hand, so every spend and income aggregate can exclude them.
          example: null
        importBatchId:
          type: string
          format: uuid
          nullable: true
          description: The import that produced this row, for undo. Null for everything else.
          example: null
        tags:
          type: array
          nullable: true
          description: Free-form member tags. Null when none have ever been set.
          items:
            type: string
            maxLength: 50
          example: [travel, business]
        notes:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'

    ManualTransactionRequest:
      type: object
      description: |
        `POST /v1/transactions` body — hand-entered rows only. No `currency`
        (the account's), no `pending`, no `providerTransactionId`: those belong
        to a source.
      required: [accountId, amount, date]
      properties:
        accountId:
          type: string
          format: uuid
          description: Must be an account of this household whose `sourceKind` is `MANUAL`.
          example: 00000000-0000-4000-8000-0000000000a1
        amount:
          type: string
          description: |
            The absolute value, as a decimal string with at most two decimal
            places (accounts are CAD or USD, whose smallest unit is the cent), so
            nothing is silently rounded. Zero and negative values are rejected —
            direction is `type`.
          pattern: '^[0-9]{1,15}(\.[0-9]{1,2})?$'
          example: '4.75'
        date:
          type: string
          format: date
          example: '2026-09-04'
        type:
          allOf:
            - $ref: '#/components/schemas/TransactionType'
          description: Omitted means `DEBIT`.
        merchant:
          type: string
          nullable: true
          maxLength: 255
          description: Stored as `merchantName`, and what the categorisation pipeline matches on.
          example: Blue Door Coffee
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Pins the category and skips the pipeline. Must be visible to this
            household — a system category or its own.
          example: null
        notes:
          type: string
          nullable: true
          maxLength: 2000
          example: Paid in cash
      example:
        accountId: 00000000-0000-4000-8000-0000000000a1
        amount: '4.75'
        date: '2026-09-04'
        type: DEBIT
        merchant: Blue Door Coffee
        categoryId: null
        notes: Paid in cash

    TransactionPatchRequest:
      type: object
      description: |
        `PATCH /v1/transactions/{id}` body. **Presence is meaningful**: a field
        that is absent is left alone, and a field present with `null` is
        cleared. Sending `{}` is a valid no-op.
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Writes `transaction.category_id` and pins the choice in
            `category_override`, so a re-sync cannot undo it. `null` clears both.
          example: 00000000-0000-4000-8000-0000000000d1
        merchantName:
          type: string
          nullable: true
          maxLength: 255
          example: Blue Door Coffee
        notes:
          type: string
          nullable: true
          maxLength: 2000
          example: Reimbursable
        tags:
          type: array
          nullable: true
          maxItems: 50
          description: At most 50 tags of at most 50 characters each. Blank tags are dropped.
          items:
            type: string
            maxLength: 50
          example: [travel]
        transferGroupId:
          type: string
          format: uuid
          nullable: true
          description: |
            Marks this row as one leg of a transfer, or, with `null`, unlinks it.
          example: null
      example:
        categoryId: 00000000-0000-4000-8000-0000000000d1
        notes: Reimbursable

    DashboardCurrencyTotals:
      type: object
      description: |
        One currency's subtotals. Currencies are never converted into one
        another, so the dashboard reports each separately rather than inventing
        a rate.
      required: [currency, spentToday, transactionsToday, spentThisMonth, incomeThisMonth,
        netThisMonth]
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        spentToday:
          $ref: '#/components/schemas/MoneyAmount'
        transactionsToday:
          type: integer
          format: int32
          description: |
            How many transactions of any type, excluding internal-transfer legs,
            fell on the caller's own today.
          example: 3
        spentThisMonth:
          $ref: '#/components/schemas/MoneyAmount'
        incomeThisMonth:
          $ref: '#/components/schemas/MoneyAmount'
        netThisMonth:
          $ref: '#/components/schemas/MoneyAmount'

    DashboardTodayResponse:
      type: object
      description: |
        Today and this month for the caller's household, with the boundaries
        computed in the caller's own timezone.
      required: [date, timezone, currency, spentToday, transactionsToday, spentThisMonth,
        incomeThisMonth, netThisMonth, byCurrency]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: The calendar date these figures describe, in `timezone`.
          example: '2026-09-04'
        timezone:
          type: string
          maxLength: 64
          description: The IANA zone the boundaries were computed in — the caller's own.
          example: America/Halifax
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        spentToday:
          $ref: '#/components/schemas/MoneyAmount'
        transactionsToday:
          type: integer
          format: int32
          example: 3
        spentThisMonth:
          $ref: '#/components/schemas/MoneyAmount'
        incomeThisMonth:
          $ref: '#/components/schemas/MoneyAmount'
        netThisMonth:
          $ref: '#/components/schemas/MoneyAmount'
        byCurrency:
          type: array
          description: |
            One entry per currency that has at least one transaction that is not
            a paired internal-transfer leg, dated from the first of the caller's
            current month through the caller's today, ordered by currency code.
            Empty when there are none.
            An array rather than an object keyed by code, so a generated client
            gets a typed list instead of an index signature.
          items:
            $ref: '#/components/schemas/DashboardCurrencyTotals'
      example:
        date: '2026-09-04'
        timezone: America/Halifax
        currency: CAD
        spentToday: '4.7500'
        transactionsToday: 1
        spentThisMonth: '412.1900'
        incomeThisMonth: '2500.0000'
        netThisMonth: '2087.8100'
        byCurrency:
          - currency: CAD
            spentToday: '4.7500'
            transactionsToday: 1
            spentThisMonth: '412.1900'
            incomeThisMonth: '2500.0000'
            netThisMonth: '2087.8100'

    # ---- net worth (collapse step 9) ----------------------------------------
    NetWorthRange:
      type: string
      description: |
        The window `GET /v1/networth/series` reports. The source
        `@Pattern`-validated exactly these four literal values, so this is
        modelled as a real enum rather than a free string: an out-of-range
        value is 400 `validation-error`, predicted by the document rather
        than discovered at runtime. `3M`, `6M` and `1Y` reach back 90, 180 and
        365 days from the caller's own today; `ALL` reaches back to 2000-01-01.
      enum: [3M, 6M, 1Y, ALL]
      default: 1Y
      example: 1Y

    AssetType:
      type: string
      description: What kind of asset this is, for display and reporting.
      enum: [CASH, INVESTMENT, REAL_ESTATE, VEHICLE, OTHER]
      example: CASH

    LiabilityType:
      type: string
      description: What kind of liability this is, for display and reporting.
      enum: [MORTGAGE, CAR_LOAN, STUDENT_LOAN, CREDIT_CARD, OTHER]
      example: CREDIT_CARD

    AssetResponse:
      type: object
      description: One asset in the household's net-worth ledger.
      required: [id, householdId, createdBy, name, assetType, value, currency, accountId,
        createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000c1
        householdId:
          type: string
          format: uuid
          description: The owning household — the scope, and the same for every member.
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member who added the asset, for audit only. Null once that
            member is deleted; it never affects who can see the row.
          example: 00000000-0000-4000-8000-000000000002
        name:
          type: string
          maxLength: 200
          example: Everyday Chequing
        assetType:
          $ref: '#/components/schemas/AssetType'
        value:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        accountId:
          type: string
          format: uuid
          nullable: true
          description: |
            The linked `connected_account`, or `null` for a plain manual
            entry. Cleared automatically if that account is later removed.
          example: 00000000-0000-4000-8000-0000000000a1
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000c1
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        name: Everyday Chequing
        assetType: CASH
        value: '5230.5000'
        currency: CAD
        accountId: null
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    AssetRequest:
      type: object
      description: |
        `POST /v1/networth/assets` body. Carries no id and no household — the
        household comes from the signed token.
      required: [name, assetType, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The server also rejects a name that is all whitespace.
          example: Everyday Chequing
        assetType:
          $ref: '#/components/schemas/AssetType'
        value:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        currency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because an
            explicit null is meaningful: defaults to the calling member's own
            `users.currency` when omitted OR sent explicitly as `null`. There
            is no server-side default currency literal.
          example: CAD
        accountId:
          type: string
          format: uuid
          nullable: true
          description: |
            An existing `connected_account` in the caller's own household, or
            omitted/`null` for a plain manual entry. One naming another
            household's account, or no account at all, is 400
            `validation-error`.
          example: null
      example:
        name: Everyday Chequing
        assetType: CASH
        value: '5230.5000'
        currency: CAD
        accountId: null

    AssetUpdateRequest:
      type: object
      description: |
        `PUT /v1/networth/assets/{id}` body. `currency` is absent on purpose —
        see the operation.
      required: [name, assetType, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Everyday Chequing
        assetType:
          $ref: '#/components/schemas/AssetType'
        value:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        accountId:
          type: string
          format: uuid
          nullable: true
          description: Provide the connected account's id to link it, or omit/send `null` to leave it unlinked (this is a full replace, not a partial patch).
          example: null
      example:
        name: Everyday Chequing
        assetType: CASH
        value: '5400.0000'
        accountId: null

    LiabilityResponse:
      type: object
      description: One liability in the household's net-worth ledger.
      required: [id, householdId, createdBy, name, liabilityType, balance, interestRate,
        currency, accountId, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000d1
        householdId:
          type: string
          format: uuid
          description: The owning household — the scope, and the same for every member.
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member who added the liability, for audit only. Null once
            that member is deleted; it never affects who can see the row.
          example: 00000000-0000-4000-8000-000000000002
        name:
          type: string
          maxLength: 200
          example: Visa Credit Card
        liabilityType:
          $ref: '#/components/schemas/LiabilityType'
        balance:
          $ref: '#/components/schemas/MoneyAmount'
        interestRate:
          type: string
          description: |
            A percentage, not money — e.g. `"19.9900"` means 19.99%. Zero
            when the debt is interest-free. A decimal string for the same
            reason `MoneyAmount` is (§5.4).
          pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
          example: '19.9900'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        accountId:
          type: string
          format: uuid
          nullable: true
          description: |
            The linked `connected_account`, or `null` for a plain manual
            entry. Cleared automatically if that account is later removed.
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000d1
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        name: Visa Credit Card
        liabilityType: CREDIT_CARD
        balance: '1250.0000'
        interestRate: '19.9900'
        currency: CAD
        accountId: null
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    LiabilityRequest:
      type: object
      description: |
        `POST /v1/networth/liabilities` body. Carries no id and no household —
        the household comes from the signed token.
      required: [name, liabilityType, balance]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The server also rejects a name that is all whitespace.
          example: Visa Credit Card
        liabilityType:
          $ref: '#/components/schemas/LiabilityType'
        balance:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        interestRate:
          type: string
          nullable: true
          description: |
            Defaults to zero (zero-interest debt) when omitted OR sent explicitly as `null`.
          pattern: '^(100(\.0{1,4})?|[0-9]{1,2}(\.[0-9]{1,4})?)$'
          example: '19.9900'
        currency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because an
            explicit null is meaningful: defaults to the calling member's own
            `users.currency` when omitted OR sent explicitly as `null`. There
            is no server-side default currency literal.
          example: CAD
        accountId:
          type: string
          format: uuid
          nullable: true
          description: |
            An existing `connected_account` in the caller's own household, or
            omitted/`null` for a plain manual entry. One naming another
            household's account, or no account at all, is 400
            `validation-error`.
          example: null
      example:
        name: Visa Credit Card
        liabilityType: CREDIT_CARD
        balance: '1250.0000'
        interestRate: '19.9900'
        currency: CAD
        accountId: null

    LiabilityUpdateRequest:
      type: object
      description: |
        `PUT /v1/networth/liabilities/{id}` body. `currency` is absent on
        purpose — see the operation.
      required: [name, liabilityType, balance]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Visa Credit Card
        liabilityType:
          $ref: '#/components/schemas/LiabilityType'
        balance:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        interestRate:
          type: string
          nullable: true
          description: |
            A full replace, not a partial patch: omitted OR sent explicitly as `null` resets to
            zero, matching creation's own default.
          pattern: '^(100(\.0{1,4})?|[0-9]{1,2}(\.[0-9]{1,4})?)$'
          example: '21.9900'
        accountId:
          type: string
          format: uuid
          nullable: true
          description: Provide the connected account's id to link it, or omit/send `null` to leave it unlinked (this is a full replace, not a partial patch).
          example: null
      example:
        name: Visa Credit Card
        liabilityType: CREDIT_CARD
        balance: '1100.0000'
        interestRate: '21.9900'
        accountId: null

    NetWorthSnapshotResponse:
      type: object
      description: |
        One `net_worth_snapshot` row — one currency, one date. `POST
        /v1/networth/snapshot` answers an array of these, one per currency
        present in the household.
      required: [id, householdId, createdBy, snapshotDate, totalAssets, totalLiabilities,
        netWorth, currency, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            Who triggered this snapshot: the calling member for `POST
            /v1/networth/snapshot`, the household's own administrator for the
            daily job (there is no "caller" to attribute a scheduled write
            to). For audit only, never a scope.
          example: 00000000-0000-4000-8000-000000000002
        snapshotDate:
          type: string
          format: date
          description: |
            A LOCAL date, resolved through the household's own boundary — never
            the container's UTC clock.
          example: '2026-09-04'
        totalAssets:
          $ref: '#/components/schemas/MoneyAmount'
        totalLiabilities:
          $ref: '#/components/schemas/MoneyAmount'
        netWorth:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: |
            A database-generated column, `totalAssets - totalLiabilities`,
            computed by Postgres so it can never drift from the two figures it
            is derived from.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T23:30:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        snapshotDate: '2026-09-04'
        totalAssets: '5230.5000'
        totalLiabilities: '1250.0000'
        netWorth: '3980.5000'
        currency: CAD
        createdAt: '2026-09-04T23:30:00Z'

    NetWorthPoint:
      type: object
      description: One dated point on a single-currency net-worth series.
      required: [snapshotDate, totalAssets, totalLiabilities, netWorth]
      additionalProperties: false
      properties:
        snapshotDate:
          type: string
          format: date
          example: '2026-09-04'
        totalAssets:
          $ref: '#/components/schemas/MoneyAmount'
        totalLiabilities:
          $ref: '#/components/schemas/MoneyAmount'
        netWorth:
          $ref: '#/components/schemas/MoneyAmount'
      example:
        snapshotDate: '2026-09-04'
        totalAssets: '5230.5000'
        totalLiabilities: '1250.0000'
        netWorth: '3980.5000'

    NetWorthSeries:
      type: object
      description: One currency's net-worth history over the requested range.
      required: [currency, points]
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        points:
          type: array
          description: Oldest first. Empty when this currency has no snapshots in range.
          items:
            $ref: '#/components/schemas/NetWorthPoint'
      example:
        currency: CAD
        points:
          - snapshotDate: '2026-09-04'
            totalAssets: '5230.5000'
            totalLiabilities: '1250.0000'
            netWorth: '3980.5000'

    NetWorthSeriesResponse:
      type: object
      description: |
        The household's net-worth history, grouped by currency (F2) — never
        one blended series. `GET /v1/networth/series` never writes; an empty
        `series` list means no snapshots exist in the requested range, and
        the client is not told data was captured that was not.
      required: [primaryCurrency, series]
      additionalProperties: false
      properties:
        primaryCurrency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: The caller's own `users.currency`. Never a literal.
        series:
          type: array
          description: |
            One entry per currency that has at least one snapshot in range,
            ordered by currency code. Empty when the household has none.
          items:
            $ref: '#/components/schemas/NetWorthSeries'
      example:
        primaryCurrency: CAD
        series:
          - currency: CAD
            points:
              - snapshotDate: '2026-09-04'
                totalAssets: '5230.5000'
                totalLiabilities: '1250.0000'
                netWorth: '3980.5000'

    # ---- subscriptions (collapse step 10) -----------------------------------
    BillingCycle:
      type: string
      description: |
        The cadence a recurring charge was classified into. Each carries a
        canonical length in days and a tolerance window, and a merchant's
        inter-charge gaps must fall inside one window for at least 70% of the
        observed intervals before that cycle is assigned: `WEEKLY` 7 +/- 3,
        `BIWEEKLY` 14 +/- 3, `MONTHLY` 30 +/- 3, `QUARTERLY` 90 +/- 5,
        `ANNUAL` 365 +/- 10.

        The tolerance is also what decides when a charge is genuinely late —
        see `SubscriptionSignal.RED`.
      enum: [WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, ANNUAL]
      example: MONTHLY

    SubscriptionSignal:
      type: string
      description: |
        How the subscription looked at the last scan.

        * `GREEN` — behaving as expected.
        * `AMBER` — the detected price has changed at some point; `previousAmount`
          says what it was and an alert was raised at the time.
        * `RED` — a charge was expected and has not been observed:
          `nextChargeDate` is further in the past than the cycle's own tolerance
          window allows. Bank posting delays are absorbed by that tolerance, so
          `RED` means the charge is genuinely missing, not merely late. A
          subscription whose next charge is more than three whole billing cycles
          overdue is treated as stopped: it is left out of `GET /v1/subscriptions`
          and of every summary figure (run rate, counts, `next14Days`) until
          charges resume, but stays readable by id. So `RED` on a listed row means
          overdue by more than the tolerance but not yet three cycles.
      enum: [GREEN, AMBER, RED]
      example: GREEN

    SubscriptionAlertType:
      type: string
      description: |
        What a `subscription_alert` row is about. This version raises only
        `PRICE_INCREASE`; `UPCOMING` and `PAYMENT_FAILED` are declared because
        the column's CHECK constraint admits them and a client's union should be
        complete, but nothing writes them yet — upcoming charges are served by
        the summary's `next14Days`, and delivery of any of these as a
        notification is not built. A `PRICE_INCREASE` alert is raised alongside
        a SUBSCRIPTION_PRICE_CHANGE notification (sent only if the member has
        subscription alerts enabled) and a `subscription.price_changed` webhook.
        That event, and so the notification and webhook, also fires when the
        price falls, but no alert row is written for a decrease.
      enum: [PRICE_INCREASE, UPCOMING, PAYMENT_FAILED]
      example: PRICE_INCREASE

    SubscriptionResponse:
      type: object
      description: |
        One recurring charge detected in the household's ledger. Written only by
        detection; the only field a member can change is `cancelled`, through
        `DELETE /v1/subscriptions/{id}`.
      required: [id, householdId, createdBy, merchantName, categoryId, normalizedAmount,
        previousAmount, currency, billingCycle, nextChargeDate, signal, priceChanged,
        firstSeenDate, lastSeenDate, cancelled, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000f1
        householdId:
          type: string
          format: uuid
          description: The owning household — the scope, and the same for every member.
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member the detection was attributed to — the caller for
            `POST /v1/subscriptions/scan`, the household's own administrator for
            the nightly job, which has no caller. Audit only; it never affects
            who can see the row, and it is null once that member is deleted.
          example: 00000000-0000-4000-8000-000000000002
        merchantName:
          type: string
          maxLength: 200
          description: |
            The NORMALISED merchant name — upper-cased, accents folded,
            apostrophes removed, store numbers and card/reference suffixes
            stripped, punctuation collapsed to single spaces. It is the natural
            key within the household, which is why `SPOTIFY #1234` and
            `Spotify` are one subscription and not two. Clients display it as-is
            or title-case it; the raw bank strings are on the transactions.
          example: SPOTIFY
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: |
            The category of the charges this was detected from, when they carry
            one. Null when they are uncategorised, and cleared automatically if
            that category is later deleted.
          example: 00000000-0000-4000-8000-0000000000a7
        normalizedAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: |
            What the subscription costs NOW, in `currency` — the median of the
            most recent run of charges at the current price level, not a mean
            over the whole history. A mean would report a figure the member was
            never charged as soon as the price moved.
        previousAmount:
          type: string
          nullable: true
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: |
            A `MoneyAmount`, written inline because it is nullable: a `nullable`
            sibling on an `allOf` reference is a Redocly `nullable-type-sibling`
            error and is invisible to the validator's Nullable keyword.

            What it cost before the most recent price change, in the same
            `currency`. Null when the price has never changed, and reset to null
            if the charges switch currency, because an amount in a currency the
            subscription is no longer billed in cannot be compared to the
            current one.
          example: '9.9900'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        nextChargeDate:
          type: string
          format: date
          nullable: true
          description: |
            `lastSeenDate` advanced by exactly one billing cycle, as a LOCAL
            date resolved through the household's own boundary. Calendar
            arithmetic, not day counting: a monthly charge last seen on 31
            January projects onto 28 February (29 in a leap year), and an annual
            one last seen on 29 February projects onto 28 February.

            **A date in the past is not an error.** It means the charge was
            expected and has not been observed; the row carries the `RED` signal
            and is left out of the summary's `next14Days`. It is never rolled
            forward, because inventing a future date for a subscription that may
            simply have ended would be a claim the ledger does not support.
          example: '2026-10-04'
        signal:
          $ref: '#/components/schemas/SubscriptionSignal'
        priceChanged:
          type: boolean
          description: |
            Whether the detected price has ever changed. Sticky: a later scan
            that sees no change does not clear it, so `previousAmount` and this
            flag together are the row's permanent record of the last change.
          example: false
        firstSeenDate:
          type: string
          format: date
          description: The earliest charge this detection is built from.
          example: '2026-03-04'
        lastSeenDate:
          type: string
          format: date
          description: The most recent charge this detection is built from.
          example: '2026-09-04'
        cancelled:
          type: boolean
          description: |
            True once a member has dismissed it with
            `DELETE /v1/subscriptions/{id}`. A cancelled row is excluded from
            `GET /v1/subscriptions` and from every summary figure, as is one
            whose charges have stopped (see `SubscriptionSignal`), but is still
            readable by id and is still kept current by the scan — it is never
            un-cancelled and never raises another alert.
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T02:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-05T02:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000f1
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        merchantName: SPOTIFY
        categoryId: null
        normalizedAmount: '11.9900'
        previousAmount: '9.9900'
        currency: CAD
        billingCycle: MONTHLY
        nextChargeDate: '2026-10-04'
        signal: AMBER
        priceChanged: true
        firstSeenDate: '2026-03-04'
        lastSeenDate: '2026-09-04'
        cancelled: false
        createdAt: '2026-09-04T02:00:00Z'
        updatedAt: '2026-09-05T02:00:00Z'

    SubscriptionAlertResponse:
      type: object
      description: |
        One anomaly raised against a detected subscription. Alerts are written
        by detection and never deleted; acknowledging one sets `isRead`.
      required: [id, householdId, createdBy, subscriptionId, alertType, alertMessage, isRead,
        createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000f9
        householdId:
          type: string
          format: uuid
          description: The owning household — the scope, and the same for every member.
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member the detection run was attributed to. Audit only; null
            once that member is deleted.
          example: 00000000-0000-4000-8000-000000000002
        subscriptionId:
          type: string
          format: uuid
          description: |
            The `detected_subscription` this is about. Deleting that row deletes
            its alerts with it, but no route in this version deletes one —
            `DELETE /v1/subscriptions/{id}` is a soft delete and leaves the
            alerts standing.
          example: 00000000-0000-4000-8000-0000000000f1
        alertType:
          $ref: '#/components/schemas/SubscriptionAlertType'
        alertMessage:
          type: string
          description: |
            A sentence written for the member, naming the merchant and both
            amounts with their currency. Safe to display; a client that wants
            its own wording should build it from `subscriptionId` instead.
          example: SPOTIFY went up from 9.99 CAD to 11.99 CAD.
        isRead:
          type: boolean
          description: |
            Whether the alert has been acknowledged. Unread alerts are what
            `GET /v1/subscriptions/alerts` returns.
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T02:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000f9
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        subscriptionId: 00000000-0000-4000-8000-0000000000f1
        alertType: PRICE_INCREASE
        alertMessage: SPOTIFY went up from 9.99 CAD to 11.99 CAD.
        isRead: false
        createdAt: '2026-09-05T02:00:00Z'

    SubscriptionCurrencyTotals:
      type: object
      description: |
        One currency's subscription totals. Currencies are never converted into
        one another, so the summary reports each separately rather than
        inventing a rate.
      required: [currency, monthlyRunRate, activeCount, flaggedCount]
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        monthlyRunRate:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: |
            The sum of this currency's active subscriptions, each normalised to
            a month: `WEEKLY x 52/12`, `BIWEEKLY x 26/12`, `MONTHLY x 1`,
            `QUARTERLY / 3`, `ANNUAL / 12`.
        activeCount:
          type: integer
          format: int32
          description: Active subscriptions billed in this currency.
          example: 4
        flaggedCount:
          type: integer
          format: int32
          description: How many of those carry an `AMBER` or `RED` signal.
          example: 1

    SubscriptionCurrencyAmount:
      type: object
      description: One currency's share of a single day's charges.
      required: [currency, amount]
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        amount:
          $ref: '#/components/schemas/MoneyAmount'

    UpcomingCharge:
      type: object
      description: |
        The subscriptions whose next charge falls on one date, so the client can
        render a calendar strip without regrouping the list itself.
      required: [date, subscriptions, totals]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: A LOCAL date in the caller's own timezone.
          example: '2026-09-12'
        subscriptions:
          type: array
          description: The subscriptions due that day, ordered by merchant name.
          items:
            $ref: '#/components/schemas/SubscriptionResponse'
        totals:
          type: array
          description: |
            That day's total per currency — one entry per currency present among
            `subscriptions`, never one blended figure.
          items:
            $ref: '#/components/schemas/SubscriptionCurrencyAmount'

    SubscriptionSummaryResponse:
      type: object
      description: |
        The household's subscription aggregate. Every money figure is inside
        `byCurrency` or `next14Days[].totals`; there is deliberately no
        top-level total, because a household holding subscriptions in two
        currencies has no single one.
      required: [currency, activeCount, flaggedCount, byCurrency, next14Days]
      additionalProperties: false
      properties:
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: |
            The CALLING member's own `users.currency`, never a literal and never
            derived from the rows. It is the currency this member reads figures
            in, and it may not appear in `byCurrency` at all — a member whose
            currency is USD in a household with only CAD subscriptions sees
            `currency: USD` and one CAD entry.
        activeCount:
          type: integer
          format: int32
          description: |
            Active subscriptions across every currency. A subscription more than
            three whole billing cycles overdue counts as stopped and is left out.
          example: 5
        flaggedCount:
          type: integer
          format: int32
          description: |
            How many of those carry an `AMBER` or `RED` signal — the ones asking
            for a look.
          example: 1
        byCurrency:
          type: array
          description: |
            One entry per currency the household actually holds active
            subscriptions in, ordered by currency code. Empty when it has none.
            An array rather than an object keyed by code, so a generated client
            gets a typed list instead of an index signature.
          items:
            $ref: '#/components/schemas/SubscriptionCurrencyTotals'
        next14Days:
          type: array
          description: |
            Charges projected over the next fourteen calendar days from the
            caller's own today, one entry per date that has at least one,
            ordered oldest first. A subscription whose projected date has
            already passed is not here — it is `RED` instead.
          items:
            $ref: '#/components/schemas/UpcomingCharge'
      example:
        currency: CAD
        activeCount: 2
        flaggedCount: 1
        byCurrency:
          - currency: CAD
            monthlyRunRate: '23.98'
            activeCount: 2
            flaggedCount: 1
        next14Days:
          - date: '2026-09-12'
            subscriptions:
              - id: 00000000-0000-4000-8000-0000000000f1
                householdId: 00000000-0000-4000-8000-000000000001
                createdBy: 00000000-0000-4000-8000-000000000002
                merchantName: SPOTIFY
                categoryId: null
                normalizedAmount: '11.9900'
                previousAmount: '9.9900'
                currency: CAD
                billingCycle: MONTHLY
                nextChargeDate: '2026-09-12'
                signal: AMBER
                priceChanged: true
                firstSeenDate: '2026-03-12'
                lastSeenDate: '2026-08-12'
                cancelled: false
                createdAt: '2026-09-04T02:00:00Z'
                updatedAt: '2026-09-05T02:00:00Z'
            totals:
              - currency: CAD
                amount: '11.9900'

    # ------------------------------------------------------------ budgets and goals (step 8)
    BudgetType:
      type: string
      description: |
        How a period constrains its envelopes.

        * `FLEXIBLE` — no constraint. Allocations may total anything.
        * `ZERO_BASED` — every dollar allocated: the envelope allocations must
          sum to exactly the period's `totalIncome` after any envelope write.
        * `ROLLOVER` — unspent envelope balance carries into the next month
          (`allocated + rolloverAmount - spent`, floored at zero) when the
          `envelope-rollover` job processes the finished month.
      enum: [FLEXIBLE, ZERO_BASED, ROLLOVER]
      example: FLEXIBLE

    BudgetPeriodRequest:
      type: object
      description: |
        `POST /v1/budgets` body. Carries no id and no household — the household
        comes from the signed token.
      required: [month, totalIncome]
      properties:
        month:
          type: string
          format: date
          description: |
            Any day inside the target calendar month; the server normalises it
            to the first of that month before storing.
          example: '2026-09-01'
        totalIncome:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        currency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because an
            explicit null is meaningful: defaults to the creating member's own
            `users.currency` when omitted OR sent explicitly as `null`. There is
            no server-side default currency literal (finding F1).
          example: CAD
        budgetType:
          type: string
          nullable: true
          enum: [FLEXIBLE, ZERO_BASED, ROLLOVER, null]
          description: |
            Same value set as `BudgetType`; omitted or explicitly `null` means
            `FLEXIBLE`.
          example: FLEXIBLE
      example:
        month: '2026-09-01'
        totalIncome: '5000.00'
        currency: CAD
        budgetType: ROLLOVER

    BudgetPeriodUpdateRequest:
      type: object
      description: |
        `PUT /v1/budgets/{id}` body — a full replace of the two mutable fields,
        so both are required. `month` and `currency` are not writable.
      required: [totalIncome, budgetType]
      properties:
        totalIncome:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        budgetType:
          $ref: '#/components/schemas/BudgetType'
      example:
        totalIncome: '5200.00'
        budgetType: ROLLOVER

    BudgetPeriodResponse:
      type: object
      description: One month of a household's budget.
      required: [id, householdId, createdBy, month, totalIncome, currency, budgetType,
        rolledOverAt, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        householdId:
          type: string
          format: uuid
          description: The owning household — the scope, and the same for every member.
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member who opened the period, for audit only. Null once that
            member is deleted; it never affects who can see the row.
          example: 00000000-0000-4000-8000-000000000002
        month:
          type: string
          format: date
          description: Always the first of the month — the stored, normalised value.
          example: '2026-09-01'
        totalIncome:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        budgetType:
          $ref: '#/components/schemas/BudgetType'
        rolledOverAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the `envelope-rollover` job carried this period's unspent
            balances into the following month, or `null` while that has not
            happened. It is the marker that makes the job idempotent and
            catch-up safe: the job decides what is still owed from this column,
            not from "today is the first of the month", so a container that was
            down at the boundary does not cost a household its rollover.
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        month: '2026-09-01'
        totalIncome: '5000.0000'
        currency: CAD
        budgetType: ROLLOVER
        rolledOverAt: null
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    EnvelopeRequest:
      type: object
      description: |
        `POST /v1/budgets/{id}/envelopes` body. The period comes from the path
        and the household from the signed token, so neither appears here.

        `spent` and `rolloverAmount` are deliberately absent: `spent` is
        rewritten from the ledger and `rolloverAmount` is written only by the
        rollover job. A client that could set either could make a budget say
        anything.
      required: [categoryId, allocated]
      properties:
        categoryId:
          type: string
          format: uuid
          description: |
            A category this household can use — a system category or one of its
            own. One it cannot use is 400 `validation-error`.
          example: 00000000-0000-4000-8000-0000000000f1
        allocated:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        currency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because an
            explicit null is meaningful: omitted or `null` means the PERIOD's
            currency. An envelope only ever sums transactions of its own
            currency.
          example: CAD
      example:
        categoryId: 00000000-0000-4000-8000-0000000000f1
        allocated: '400.00'
        currency: CAD

    EnvelopeUpdateRequest:
      type: object
      description: |
        `PUT /v1/budgets/{id}/envelopes/{envelopeId}` body. `allocated` is the
        only writable field and it is required — `categoryId`, `currency`,
        `spent` and `rolloverAmount` are all fixed or computed.
      required: [allocated]
      properties:
        allocated:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
      example:
        allocated: '450.00'

    EnvelopeHealth:
      type: object
      description: |
        Computed on every read from the envelope's amounts and where today falls
        inside the period's month, in the CALLER's own timezone. Never stored:
        it depends on the clock, not on the row. `expectedSpend` is (`allocated` +
        `rolloverAmount`) multiplied by the elapsed fraction of the month, and
        `remainingAmount` is `allocated` + `rolloverAmount` less `spent`, floored
        at zero.

        For a month already over, the pace is 100 %; for one not yet begun it is
        0 %. The pre-collapse calculator used today's day-of-month whatever
        month the period covered, so a September envelope read on the 5th of
        October reported a 5 %-elapsed pace.
      required: [healthPercentage, paceMarkerPercentage, overPace, remainingAmount, expectedSpend]
      additionalProperties: false
      properties:
        healthPercentage:
          type: integer
          format: int32
          minimum: 0
          description: |
            `spent / (allocated + rolloverAmount)` as a percentage, rounded
            half-up. Above 100 means the envelope is over budget. Zero when
            allocated plus `rolloverAmount` is zero.
          example: 62
        paceMarkerPercentage:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How far through the period's month the caller currently is.
          example: 50
        overPace:
          type: boolean
          description: |
            `spent` is more than 110 % of `expectedSpend`, the linear-pace
            expectation for today. Like `healthPercentage` and `expectedSpend`,
            it is measured against `allocated` + `rolloverAmount`; it is false
            when that sum is zero. The 10 % buffer absorbs ordinary day-to-day
            variance.
          example: true
        remainingAmount:
          $ref: '#/components/schemas/MoneyAmount'
        expectedSpend:
          $ref: '#/components/schemas/MoneyAmount'
      example:
        healthPercentage: 62
        paceMarkerPercentage: 50
        overPace: true
        remainingAmount: '150.0000'
        expectedSpend: '200.0000'

    EnvelopeResponse:
      type: object
      description: |
        One budgeted category inside a period.

        `spent` is the ledger's own answer, rewritten — never incremented —
        from the household's transactions in this category, month and currency:
        `DEBIT` less `REFUND`, transfer legs excluded, exactly the rule the
        dashboard uses. Because it is a rewrite, recategorising a transaction or
        re-running a sync cannot double-count it (§6 D1, §9 risk 4).
      required: [id, householdId, periodId, categoryId, categoryName, allocated, spent,
        rolloverAmount, currency, health, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e2
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        periodId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000f1
        categoryName:
          type: string
          description: |
            Joined from `category` on every read rather than denormalised onto
            the envelope: the pre-collapse table stored a copy of the name, so
            renaming a category left every envelope showing the old one.
          example: Groceries
        allocated:
          $ref: '#/components/schemas/MoneyAmount'
        spent:
          $ref: '#/components/schemas/MoneyAmount'
        rolloverAmount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        health:
          $ref: '#/components/schemas/EnvelopeHealth'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e2
        householdId: 00000000-0000-4000-8000-000000000001
        periodId: 00000000-0000-4000-8000-0000000000e1
        categoryId: 00000000-0000-4000-8000-0000000000f1
        categoryName: Groceries
        allocated: '400.0000'
        spent: '250.0000'
        rolloverAmount: '0.0000'
        currency: CAD
        health:
          healthPercentage: 62
          paceMarkerPercentage: 50
          overPace: true
          remainingAmount: '150.0000'
          expectedSpend: '200.0000'
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    GoalRequest:
      type: object
      description: |
        `POST /v1/goals` body. `currentAmount` and `achieved` are not accepted:
        a goal starts at zero and unmet whatever the caller sends.
      required: [name, targetAmount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The server also rejects a name that is all whitespace.
          example: Emergency Fund
        targetAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        currency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because an
            explicit null is meaningful: defaults to the creating member's own
            `users.currency` when omitted OR sent explicitly as `null`.
          example: CAD
        deadline:
          type: string
          format: date
          nullable: true
          description: Omitted or `null` for an open-ended goal.
          example: '2026-12-31'
      example:
        name: Emergency Fund
        targetAmount: '10000.00'
        currency: CAD
        deadline: '2026-12-31'

    GoalUpdateRequest:
      type: object
      description: |
        `PUT /v1/goals/{id}` body — a full replace of the writable fields.
        `achieved` is derived from `currentAmount >= targetAmount` on every
        write and is never sent; `currency` is not writable.
      required: [name, targetAmount, currentAmount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The server also rejects a name that is all whitespace.
          example: Emergency Fund
        targetAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        currentAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: Zero or greater; a negative value is 400 `validation-error`.
        deadline:
          type: string
          format: date
          nullable: true
          description: |
            `null` clears the deadline and makes the goal open-ended; omitting
            the field does the same, because this is a full replace.
          example: '2026-12-31'
      example:
        name: Emergency Fund
        targetAmount: '10000.00'
        currentAmount: '2500.00'
        deadline: '2026-12-31'

    GoalResponse:
      type: object
      description: One of the household's savings goals.
      required: [id, householdId, createdBy, name, targetAmount, currentAmount, deadline,
        currency, achieved, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e3
        householdId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The member who started the goal, for audit only. Null once that
            member is deleted.
          example: 00000000-0000-4000-8000-000000000002
        name:
          type: string
          maxLength: 200
          example: Emergency Fund
        targetAmount:
          $ref: '#/components/schemas/MoneyAmount'
        currentAmount:
          $ref: '#/components/schemas/MoneyAmount'
        deadline:
          type: string
          format: date
          nullable: true
          description: '`null` for an open-ended goal.'
          example: '2026-12-31'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        achieved:
          type: boolean
          description: Derived from `currentAmount >= targetAmount`, never client-supplied.
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-04T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e3
        householdId: 00000000-0000-4000-8000-000000000001
        createdBy: 00000000-0000-4000-8000-000000000002
        name: Emergency Fund
        targetAmount: '10000.0000'
        currentAmount: '2500.0000'
        deadline: '2026-12-31'
        currency: CAD
        achieved: false
        createdAt: '2026-09-04T14:00:00Z'
        updatedAt: '2026-09-04T14:00:00Z'

    # ---- tax export (collapse step 15) --------------------------------------
    TaxExportStatus:
      type: string
      description: |
        Where a run is. `PENDING` is recorded synchronously by the POST;
        `GENERATING` is set by the background worker when it picks the run up;
        `COMPLETE` means there is a file to download; `FAILED` carries a reason
        in `errorMessage`. Only `COMPLETE` can be downloaded.
      enum: [PENDING, GENERATING, COMPLETE, FAILED]
      example: COMPLETE

    TaxExportFormat:
      type: string
      description: |
        What the generated file is. `CSV` is the machine-readable one an
        accountant imports; `PDF` renders the same columns for printing. Both
        carry the member's own amounts and labels. Amounts are always
        positive; the final `type` column (`DEBIT`, `CREDIT`, `REFUND`, `FEE`,
        `INTEREST`, `TRANSFER`, `OTHER`) says which way the money moved. The
        per-tax-line totals are spending only: a `DEBIT` adds, a `REFUND`
        subtracts, and every other type is listed on its row but never added
        into a total. This is an export, not a tax calculation.
      enum: [CSV, PDF]
      example: CSV

    TaxLineMappingResponse:
      type: object
      description: |
        One category and the tax line the caller's export will file it under.

        `lineCode` and `lineLabel` are empty strings and `deductible` is false
        when no row exists for this category in this jurisdiction — the category
        still appears here, and its transactions still appear in the export with
        empty tax-line cells.
      required: [categoryId, categorySlug, categoryName, jurisdiction, lineCode, lineLabel,
        deductible, overridden]
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000f1
        categorySlug:
          type: string
          description: |
            The category's stable dotted identifier, e.g. `business.software`.
            This is the id other tooling joins on; the name is display text.
          maxLength: 60
          example: business.software
        categoryName:
          type: string
          maxLength: 100
          example: Software
        jurisdiction:
          $ref: '#/components/schemas/CountryCode'
        lineCode:
          type: string
          description: |
            The code a human reads off the form, e.g. `8810` on a T2125 or
            `SchC-18` on a Schedule C. `NONE` is a seeded row meaning "this
            category has no line on either form"; the empty string means no row
            exists at all. Never interpreted by the server.
          maxLength: 20
          example: '8810'
        lineLabel:
          type: string
          description: The line's wording on the form, as a human would read it.
          maxLength: 200
          example: T2125 line 8810 — Office expenses
        deductible:
          type: boolean
          description: |
            The seed's or the member's own assertion about the line. A label
            only: nothing in Trove multiplies it by anything.
          example: true
        overridden:
          type: boolean
          description: |
            `true` when this row is the caller's own override, `false` when it is
            the install-wide seed or when there is no row at all.
          example: false
      example:
        categoryId: 00000000-0000-4000-8000-0000000000f1
        categorySlug: business.software
        categoryName: Software
        jurisdiction: CA
        lineCode: '8810'
        lineLabel: T2125 line 8810 — Office expenses
        deductible: true
        overridden: false

    TaxLineMappingRequest:
      type: object
      description: |
        A member's own mapping for one category. Upserted on
        `(jurisdiction, categoryId, callerId)`, so repeating the call replaces
        the previous override rather than adding a second one.
      required: [jurisdiction, lineCode, lineLabel, deductible]
      properties:
        jurisdiction:
          $ref: '#/components/schemas/CountryCode'
        lineCode:
          type: string
          description: |
            The form's line code. `minLength: 1`; the server also rejects an
            all-whitespace value.
          minLength: 1
          maxLength: 20
          example: '9270'
        lineLabel:
          type: string
          description: |
            How the line reads on the form. `minLength: 1`; the server also
            rejects an all-whitespace value.
          minLength: 1
          maxLength: 200
          example: T2125 line 9270 — Other expenses
        deductible:
          type: boolean
          example: true
      example:
        jurisdiction: CA
        lineCode: '9270'
        lineLabel: T2125 line 9270 — Other expenses
        deductible: true

    CreateTaxExportRunRequest:
      type: object
      description: |
        Everything the server needs to start a run. The jurisdiction is
        deliberately **not** here: it comes from the caller's own
        `users.country` and is stamped onto the row, so a run stays reproducible
        from its own row after the member changes country.
      required: [taxYear, format]
      properties:
        taxYear:
          type: integer
          format: int32
          description: |
            The calendar year to export, 1 January to 31 December inclusive. The
            server additionally refuses anything later than the current year **in
            the caller's own timezone** with 400 `validation-error`; the wide
            upper bound here is the schema's, not the server's.
          minimum: 2000
          maximum: 2100
          example: 2025
        format:
          $ref: '#/components/schemas/TaxExportFormat'
      example:
        taxYear: 2025
        format: CSV

    TaxExportRunResponse:
      type: object
      description: |
        One export run of the caller's. `userId` is the scope, not audit: a
        household mate cannot read, download or delete this row.
      required: [id, userId, taxYear, jurisdiction, format, status, fileSizeBytes, errorMessage,
        createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000a9
        userId:
          type: string
          format: uuid
          description: The member the run belongs to — always the caller.
          example: 00000000-0000-4000-8000-000000000002
        taxYear:
          type: integer
          format: int32
          example: 2025
        jurisdiction:
          $ref: '#/components/schemas/CountryCode'
        format:
          $ref: '#/components/schemas/TaxExportFormat'
        status:
          $ref: '#/components/schemas/TaxExportStatus'
        fileSizeBytes:
          type: integer
          format: int64
          nullable: true
          description: |
            Size of the generated file. Null until the run is `COMPLETE`, and
            null for ever on a `FAILED` one.
          example: 4096
        errorMessage:
          type: string
          nullable: true
          description: |
            Why a `FAILED` run failed, truncated. Never a stack trace and never
            the address of anything.
          maxLength: 500
          example: Export generation could not be queued
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-05T14:00:02Z'
      example:
        id: 00000000-0000-4000-8000-0000000000a9
        userId: 00000000-0000-4000-8000-000000000002
        taxYear: 2025
        jurisdiction: CA
        format: CSV
        status: COMPLETE
        fileSizeBytes: 4096
        errorMessage: null
        createdAt: '2026-09-05T14:00:00Z'
        updatedAt: '2026-09-05T14:00:02Z'

    # ---- notifications ------------------------------------------------------
    StepUpRequest:
      type: object
      description: |
        The re-proof a sensitive action asks for. Holding a session is not
        evidence of who is at the keyboard — the borrowed unlocked laptop, the
        exfiltrated bearer token — so the account's own factors are demanded
        again.

        **Neither field is required by the schema, because which one applies
        depends on the account.** A member with a local password must send
        `password`, and `code` as well where a second factor is enrolled. A
        member who signs in only through an identity provider has no password to
        send and proves an enrolled `code` alone. A member with neither is
        refused 403 `step-up-required` whatever they send, with a message saying
        to ask an administrator for a password-reset link first. Sending a field
        the account does not use is ignored; sending a wrong one is 403.
      properties:
        password:
          type: string
          format: password
          description: |
            The caller's current password. Required for any account that has one.
          minLength: 1
          maxLength: 1024
          example: not-a-real-password-example
        code:
          type: string
          description: |
            A current code from the enrolled authenticator, or one of the
            single-use recovery codes. Required for any account with a second
            factor.
          minLength: 1
          maxLength: 32
          example: '000000'
      example:
        password: not-a-real-password-example
        code: '000000'

    DataExportStatus:
      type: string
      description: |
        Where a data-export run is. `PENDING` is recorded synchronously by the
        POST; `GENERATING` is set by the background worker when it picks the run
        up; `COMPLETE` means there is an archive to download until `expiresAt`;
        `FAILED` carries a reason in `errorMessage`. Only a `COMPLETE` run that
        has not expired can be downloaded.
      enum: [PENDING, GENERATING, COMPLETE, FAILED]
      example: COMPLETE

    DataExportRunResponse:
      type: object
      description: |
        One full-data-export run of the caller's. `userId` is the scope, not
        audit: a household mate cannot read, download or delete this row.

        The storage key is deliberately absent — the download route resolves it
        itself, and a client that held it could only be tempted to build a path
        from it.
      required: [id, userId, status, fileSizeBytes, errorMessage, expiresAt, createdAt,
        updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        userId:
          type: string
          format: uuid
          description: The member the run belongs to — always the caller.
          example: 00000000-0000-4000-8000-000000000002
        status:
          $ref: '#/components/schemas/DataExportStatus'
        fileSizeBytes:
          type: integer
          format: int64
          nullable: true
          description: |
            Size of the generated archive. Null until the run is `COMPLETE`, null
            for ever on a `FAILED` one, and null again once the sweep has removed
            an expired archive.
          example: 20480
        errorMessage:
          type: string
          nullable: true
          description: |
            Why a `FAILED` run failed, truncated. Never a stack trace, never a
            file path and never the name of anything on disk.
          maxLength: 500
          example: The export could not be queued
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the download link stops working — by default 24 hours after
            the archive was written (operator setting
            `trove.data-export.download-ttl`). Null until the run is `COMPLETE`. A download after this
            instant is 409 `conflict`, and a scheduled sweep deletes the file
            itself.
          example: '2026-09-07T14:00:02Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-06T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-06T14:00:02Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        userId: 00000000-0000-4000-8000-000000000002
        status: COMPLETE
        fileSizeBytes: 20480
        errorMessage: null
        expiresAt: '2026-09-07T14:00:02Z'
        createdAt: '2026-09-06T14:00:00Z'
        updatedAt: '2026-09-06T14:00:02Z'

    NotificationTypeCode:
      type: string
      description: |
        What a notification is about. The set is closed and is exactly what
        this server can write: the `notification_log.type` and
        `in_app_notification.type` CHECK constraints carry the same five
        values, so a producer that invented a sixth would fail its INSERT
        rather than ship an inbox row no client can render.

        `RECEIPT_PROCESSED` reaches the inbox only when a receipt needs a human
        — `REVIEW_REQUIRED` or `FAILED`. A receipt that processed cleanly is
        silent, because an inbox that says "nothing happened" is one people stop
        opening. The `receipt.processed` webhook is delivered on every outcome;
        the webhook is not the inbox.

        `TAX_REMINDER` and `CUSTOM` from the pre-collapse service are gone —
        the first with the tax engine (owner decision 2), the second because
        an arbitrary caller-named type was only reachable through the
        `/internal/notifications/send` route this API no longer has.
      enum:
        - BUDGET_THRESHOLD
        - SUBSCRIPTION_PRICE_CHANGE
        - SYNC_FAILED
        - WEEKLY_DIGEST
        - RECEIPT_PROCESSED
      example: BUDGET_THRESHOLD

    NotificationResponse:
      type: object
      description: |
        One row of the caller's inbox. Closed: the DTO is a closed record and
        an accidental extra field would fail every integration test rather
        than ship.
      required: [id, type, title, body, actionUrl, read, dismissed, createdAt, readAt, dismissedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000b7
        type:
          $ref: '#/components/schemas/NotificationTypeCode'
        title:
          type: string
          description: One line, already localised to the recipient's own figures.
          example: Groceries is at 92% of its September budget
        body:
          type: string
          description: |
            The full text. Plain text, not HTML: this string is rendered by the
            web bell and the mobile inbox, and neither should be asked to trust
            markup that a merchant name could have contributed to.
          example: You have spent CAD 368.00 of the CAD 400.00 budgeted for Groceries this month.
        actionUrl:
          type: string
          nullable: true
          description: |
            A relative in-app path the client may deep-link to, or null. Always
            relative (`/budgets/...`), never absolute — a notification is not a
            way to send a member off this install.
          example: /budgets/2026-09
        read:
          type: boolean
          description: Whether the recipient has seen it. Drives the unread badge.
          example: false
        dismissed:
          type: boolean
          description: |
            Always `false` in this response: a dismissed notification is not
            returned by `GET /v1/notifications`. It is present so that the
            single-row body of `PATCH /v1/notifications/{id}/read` has the same
            shape as a list element.
          example: false
        createdAt:
          type: string
          format: date-time
          example: 2026-09-05T18:00:00Z
        readAt:
          type: string
          format: date-time
          nullable: true
          example: null
        dismissedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    UnreadCountResponse:
      type: object
      description: The unread, undismissed count for the caller.
      required: [unread]
      additionalProperties: false
      properties:
        unread:
          type: integer
          format: int64
          minimum: 0
          example: 3

    MarkedReadResponse:
      type: object
      description: How many rows `POST /v1/notifications/read-all` changed.
      required: [marked]
      additionalProperties: false
      properties:
        marked:
          type: integer
          format: int32
          minimum: 0
          example: 3

    NotificationPreferencesResponse:
      type: object
      description: |
        The caller's own notification preferences. Closed, and deliberately
        carrying **no push field of any kind** — no `pushEnabled`, no
        `apnsToken`, no `fcmToken`, no device list. The pre-collapse table had
        all three; they are dropped rather than moved (owner decision,
        2026-09-03), and the closed schema is what makes a future accidental
        re-addition fail the build.

        `taxReminderEnabled` is gone with the tax engine (owner decision 2).
      required:
        - inAppEnabled
        - emailEnabled
        - emailAddress
        - weeklyDigestEnabled
        - subscriptionAlertEnabled
        - syncFailureAlertEnabled
        - budgetAlertThresholdPercent
        - updatedAt
      additionalProperties: false
      properties:
        inAppEnabled:
          type: boolean
          description: |
            Whether new notifications announce themselves. The inbox row is
            written either way — it is the durable record of what this server
            told this member, and losing it is the defect this whole area was
            rebuilt to fix — but with this off the row arrives already read, so
            it never contributes to the unread badge.
          example: true
        emailEnabled:
          type: boolean
          description: |
            Whether the email channel is attempted. **Defaults to false.** The
            channel is implemented and unit-tested but is off on every install
            until an operator configures SMTP, so defaulting it on would promise
            a delivery this server cannot make.
          example: false
        emailAddress:
          type: string
          nullable: true
          maxLength: 320
          pattern: '^[^\s@]+@[^\s@]+$'
          description: |
            Where email notifications go, or null. The email channel mails it
            only when it matches the member's own sign-in address (letter case
            aside): nothing proves a member owns any other address, so another
            address is stored but never mailed until address verification
            exists. The server also applies Jakarta `@Email`, which is stricter
            than this pattern.
          example: alerts@example.test
        emailAvailable:
          type: boolean
          readOnly: true
          description: |
            Whether this server can send email at all: true only when an
            operator has configured and enabled the email channel
            (`SMTP_ENABLED=true`). Read-only, and not part of the update body.
            While it is false, clients hide the email toggle and address,
            because nothing would ever be mailed; `emailEnabled` and
            `emailAddress` are still stored and returned as written.

            This server always sends it. It is left out of `required` on
            purpose: a mobile build talks to whatever server version its
            household runs, and a server older than this field does not send
            it. A client treats an absent value as false.
          example: false
        weeklyDigestEnabled:
          type: boolean
          description: |
            Whether this member is in the Monday digest. The job triggers at
            08:00 UTC; the week it reports is the last complete Monday-to-Sunday
            week in **this member's own timezone**, and the figures are in this
            member's own `currency`, reported per currency when the household's
            ledger holds more than one.
          example: true
        subscriptionAlertEnabled:
          type: boolean
          description: Whether a detected price change notifies this member.
          example: true
        syncFailureAlertEnabled:
          type: boolean
          description: |
            Whether a failed or partially failed account sync notifies this
            member. A successful sync never does: an inbox that says "nothing
            happened" every hour is an inbox nobody reads.
          example: true
        budgetAlertThresholdPercent:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          description: |
            The share of an envelope's allocation, as a whole percent, at which
            this member wants to be told. Default 90.

            **A whole percent, not a ratio.** The pre-collapse column was
            `NUMERIC(3,2)`, which put a non-money decimal into a schema whose
            standing rule is that every numeric column is `NUMERIC(19,4)`; an
            integer percent is not a numeric column at all and cannot become a
            double by accident.

            Members of one household may hold different values and each is
            honoured: the envelope publishes a crossing when **any** member's
            threshold is crossed, and each member is notified when their own is.
            Above 100 is allowed and means "only once I am over budget by that
            much"; 200 is in practice an opt-out.
          example: 90
        updatedAt:
          type: string
          format: date-time
          description: When the row was last written. Set when the defaults are created.
          example: 2026-09-05T18:00:00Z

    NotificationPreferencesUpdateRequest:
      type: object
      description: |
        A partial update: every field is optional and an omitted one is left
        unchanged. Open, like every request schema here, because the server
        runs with `FAIL_ON_UNKNOWN_PROPERTIES` disabled and a closed schema
        would describe a stricter server than the one that ships.

        There is no push field to send. A body carrying `pushEnabled`,
        `apnsToken` or `fcmToken` is accepted and ignored, exactly as any other
        unknown field is.
      properties:
        inAppEnabled:
          type: boolean
          example: true
        emailEnabled:
          type: boolean
          example: false
        emailAddress:
          type: string
          nullable: true
          maxLength: 320
          pattern: '^[^\s@]+@[^\s@]+$'
          description: |
            An explicit `null` clears the stored address — this is the only way
            to unset it, and the one field where `null` and "omitted" differ.
            Mailed only when it matches the member's own sign-in address; any
            other address is stored but never mailed. The server also applies
            Jakarta `@Email`.
          example: alerts@example.test
        weeklyDigestEnabled:
          type: boolean
          example: true
        subscriptionAlertEnabled:
          type: boolean
          example: true
        syncFailureAlertEnabled:
          type: boolean
          example: true
        budgetAlertThresholdPercent:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          description: Whole percent of an envelope's allocation; 1 to 200.
          example: 80

    # ---- webhooks -----------------------------------------------------------
    WebhookResponse:
      type: object
      description: |
        One of the caller's webhook subscriptions. Closed, and the shared
        signing secret is not in it in any form — `hasSecret` is the whole of
        what this API says about it, the same shape `AiSettingsResponse` uses
        for the AI API key.
      required: [id, targetUrl, enabled, eventTypes, hasSecret, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000c7
        targetUrl:
          type: string
          description: |
            The HTTPS endpoint deliveries are POSTed to. Returned as it was
            saved; it is re-checked against the egress policy before every
            attempt, so a URL listed here is not a promise that it is still
            reachable.
          example: https://hooks.example.test/trove
        enabled:
          type: boolean
          description: |
            Whether deliveries are attempted. Always `true` on creation; there
            is no route in this version that flips it, and it exists so that a
            future operator action can stop a subscription without deleting its
            delivery history.
          example: true
        eventTypes:
          type: array
          description: |
            Which events this subscription wants. An empty array means every
            event the member's own ledger raises.
          items:
            type: string
            minLength: 1
            maxLength: 50
          example: [budget.threshold_crossed, sync.completed]
        hasSecret:
          type: boolean
          description: |
            Always `true`. A secret is required at creation, is stored
            encrypted, and cannot be removed except by deleting the
            subscription. The field exists so that the shape does not change
            the day an optional-secret subscription becomes possible, and so
            that no client author ever looks for the secret itself here.
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2026-09-05T18:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-09-05T18:00:00Z

    WebhookCreateRequest:
      type: object
      description: |
        Open, like every request schema here. `secret` is write-only: it is
        encrypted at rest and appears in no response.
      required: [targetUrl, secret]
      properties:
        targetUrl:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            An absolute `https` URL. Checked by the shared egress policy, which
            refuses plain `http`, credentials before the host, and any name
            that resolves to a loopback, private, carrier-grade-NAT, IPv6
            unique-local, link-local or cloud-metadata address — every address
            it resolves to, not just the first. A refusal is 400
            `outbound-url-rejected`. The server also rejects an all-whitespace
            value.
          example: https://hooks.example.test/trove
        secret:
          type: string
          minLength: 16
          maxLength: 128
          description: |
            The shared secret every delivery is signed with (Standard Webhooks
            `webhook-signature: v1,<base64>`, HMAC-SHA256 keyed with this
            string's UTF-8 bytes over `<webhook-id>.<webhook-timestamp>.<raw
            body>`). Sixteen characters minimum, because a short shared
            secret is guessable offline from a single captured delivery. Stored
            AES-GCM-encrypted and never returned or logged.
          example: a-long-enough-webhook-secret
        eventTypes:
          type: array
          nullable: true
          maxItems: 20
          description: |
            Which events to deliver. Omitted, `null` and `[]` all mean the same
            thing: every event this member's ledger raises. The explicit null is
            allowed because the server accepts one — the request record's
            component is nullable and normalises it — and a request schema that
            refused what the server accepts would describe a stricter server
            than the one that ships. The vocabulary is
            `budget.threshold_crossed`, `subscription.price_changed`,
            `sync.completed` and `receipt.processed`; it is not written as an
            enum because the server accepts any non-blank string of at most 50 characters and
            does not check it against this list. Only the four names above are
            ever delivered. A name outside the list is stored but never matches
            an event, so a subscription that lists only unknown names receives
            nothing.
          items:
            type: string
            minLength: 1
            maxLength: 50
          example: [budget.threshold_crossed]

    # ---- receipts (§4.10) ---------------------------------------------------
    ReceiptStatus:
      type: string
      description: |
        Where a receipt is in its pipeline. `COMPLETE` and `FAILED` are
        terminal; every other value means work is in flight, and the stage
        names are the pipeline's own.

        The pre-collapse enum also carried `QUEUED` and `OCR`. Both are gone:
        no code path ever assigned `QUEUED`, and the OCR stage was a separate
        service that no longer exists — the vision model reads the image
        directly.
      enum:
        - UPLOADED
        - VALIDATING
        - PARSING
        - EXTRACTING
        - MATCHING
        - TAX_SPLIT
        - SCORING
        - COMPLETE
        - FAILED
      example: COMPLETE

    ReceiptSource:
      type: string
      description: |
        How the image arrived. `UPLOAD` is a file the member chose, `SCAN` a
        photograph taken in the app. Defaults to `UPLOAD` when absent.

        The pre-collapse enum also had `EMAIL`; there is no email ingress in
        this design, so a value nothing can produce is not in the contract.
      enum: [UPLOAD, SCAN]
      default: UPLOAD
      example: UPLOAD

    DecimalQuantity:
      type: string
      description: |
        A count of items on a receipt line, as a decimal **string** — the same
        global `BigDecimal` serialisation every numeric field on this API uses,
        so a client's float type cannot round it. Fractional values are real
        (half a kilogram of loose goods), which is why it is not an integer.
      pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
      example: '1.0000'

    ReceiptUploadResponse:
      type: object
      description: |
        What `POST /v1/receipts/upload` answers. Three fields on purpose: the
        row exists, its fields do not yet, and a fuller shape would invite a
        client to render an empty receipt.
      required: [id, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        status: UPLOADED
        createdAt: '2026-09-05T14:00:00Z'

    ReceiptLineItemResponse:
      type: object
      description: |
        One line of a receipt, promoted from the extraction once the pipeline's
        composite confidence cleared its threshold. Line items are written once
        and never updated in place.
      required: [id, description, quantity, unitPrice, totalPrice, taxable]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e9
        description:
          type: string
          description: The item as printed on the receipt.
          example: Oat milk latte
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unitPrice:
          $ref: '#/components/schemas/MoneyAmount'
        totalPrice:
          $ref: '#/components/schemas/MoneyAmount'
        taxable:
          type: boolean
          description: |
            Whether the extractor believed the item attracts sales tax.
            Defaults to true, because most goods do.
          example: true
      example:
        id: 00000000-0000-4000-8000-0000000000e9
        description: Oat milk latte
        quantity: '1.0000'
        unitPrice: '5.7500'
        totalPrice: '5.7500'
        taxable: true

    ReceiptSummaryResponse:
      type: object
      description: |
        One row of the household's receipt list — enough to render a list item
        and no more. The full row, with its line items, is
        `GET /v1/receipts/{id}`.
      required: [id, status, source, extractedMerchant, extractedAmount, extractedCurrency,
        extractedDate, confidence, reviewRequired, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        source:
          $ref: '#/components/schemas/ReceiptSource'
        extractedMerchant:
          type: string
          nullable: true
          maxLength: 200
          description: Null until something extracts it, and for ever if nothing does.
          example: Blue Bottle Coffee
        extractedAmount:
          type: string
          nullable: true
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: |
            The receipt total, same shape as `MoneyAmount`, spelled out here
            because null is meaningful: it stays null until something extracts
            it or a member enters it.
          example: '12.3400'
        extractedCurrency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`, spelled out here because null is
            meaningful. It is never defaulted to a literal: the pipeline takes
            the uploader's own `users.currency` unless an explicit ISO code
            appears on the receipt itself.
          example: CAD
        extractedDate:
          type: string
          format: date
          nullable: true
          description: |
            The date printed on the receipt, read in the uploader's own
            country's format — `05/06/2026` is 5 June for a Canadian member and
            6 May for an American one.
          example: '2026-06-05'
        confidence:
          type: string
          nullable: true
          pattern: '^\d+(\.\d+)?$'
          description: |
            The pipeline's composite confidence in `[0.000, 1.000]`, same shape
            as `Confidence`, spelled out here because null is meaningful: null
            until the pipeline has scored, and null for ever on a receipt that
            never ran it.
          example: '0.940'
        reviewRequired:
          type: boolean
          description: |
            Whether a human should look at the fields. True is the ordinary
            state on an install with no vision model — it means "the image is
            stored and the fields are yours to fill in", not "something went
            wrong".
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T14:00:00Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        status: COMPLETE
        source: UPLOAD
        extractedMerchant: null
        extractedAmount: null
        extractedCurrency: null
        extractedDate: null
        confidence: null
        reviewRequired: true
        createdAt: '2026-09-05T14:00:00Z'

    ReceiptResponse:
      type: object
      description: |
        A receipt in full.

        **The tax split is receipt-scoped and stays here.** `gstAmount`,
        `pstAmount` and `hstAmount` are reverse-calculated from the total for
        Canadian members only, from their own province, and they are a
        convenience for the member reading this screen. No export carries them:
        the tax-time export is the member's own amounts and labels, with no
        rate and no computed figure of any kind.
      required: [id, status, source, uploadSizeBytes, extractedMerchant, extractedAmount,
        extractedCurrency, extractedDate, gstAmount, pstAmount, hstAmount, confidence,
        reviewRequired, matchedTransactionId, thumbnailUrl, lineItems, errorMessage,
        processingStartedAt, processingCompletedAt, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        source:
          $ref: '#/components/schemas/ReceiptSource'
        uploadSizeBytes:
          type: integer
          format: int64
          description: |
            Size of the file the member sent, before re-encoding. The stored
            JPEG is usually smaller.
          example: 148320
        extractedMerchant:
          type: string
          nullable: true
          maxLength: 200
          example: Blue Bottle Coffee
        extractedAmount:
          type: string
          nullable: true
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: Same shape as `MoneyAmount`; null until extracted or entered.
          example: '12.3400'
        extractedCurrency:
          type: string
          nullable: true
          enum: [CAD, USD, null]
          description: |
            Same value set as `CurrencyCode`; null until set, and never
            defaulted to a literal.
          example: CAD
        extractedDate:
          type: string
          format: date
          nullable: true
          example: '2026-06-05'
        gstAmount:
          type: string
          nullable: true
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: |
            Canadian GST reverse-calculated from the total, same shape as
            `MoneyAmount`. Null for a member whose country is not `CA`, and
            null while the total is unknown.
          example: '0.5900'
        pstAmount:
          type: string
          nullable: true
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: Provincial sales tax; zero in an HST province.
          example: '0.8600'
        hstAmount:
          type: string
          nullable: true
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: Harmonised sales tax; zero outside an HST province.
          example: '0.0000'
        confidence:
          type: string
          nullable: true
          pattern: '^\d+(\.\d+)?$'
          description: Same shape as `Confidence`; null until the pipeline has scored.
          example: '0.940'
        reviewRequired:
          type: boolean
          example: true
        matchedTransactionId:
          type: string
          format: uuid
          nullable: true
          description: |
            The transaction this receipt is attached to, or null. Whenever this
            is set, that transaction's own `receiptId` names this receipt —
            both halves are written together.
          example: 00000000-0000-4000-8000-0000000000b1
        thumbnailUrl:
          type: string
          nullable: true
          description: |
            The **path** to this receipt's thumbnail on this API, or null when
            there is no thumbnail row. Never an absolute URL, never presigned
            and never a data URI; fetching it needs the caller's own
            credentials.
          example: /api/v1/receipts/00000000-0000-4000-8000-0000000000e1/thumbnail
        lineItems:
          type: array
          description: |
            Empty until the pipeline scores high enough to promote them, and
            empty for ever on a receipt whose fields were entered by hand.
          items:
            $ref: '#/components/schemas/ReceiptLineItemResponse'
        errorMessage:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Why a `FAILED` receipt failed, in one sentence. Never a stack trace,
            never a path, never the address of anything.
          example: Unsupported file type
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-05T14:00:01Z'
        processingCompletedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-05T14:00:09Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-05T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-05T14:00:09Z'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        status: COMPLETE
        source: UPLOAD
        uploadSizeBytes: 148320
        extractedMerchant: Blue Bottle Coffee
        extractedAmount: '12.3400'
        extractedCurrency: CAD
        extractedDate: '2026-06-05'
        gstAmount: '0.5900'
        pstAmount: '0.8600'
        hstAmount: '0.0000'
        confidence: '0.940'
        reviewRequired: false
        matchedTransactionId: 00000000-0000-4000-8000-0000000000b1
        thumbnailUrl: /api/v1/receipts/00000000-0000-4000-8000-0000000000e1/thumbnail
        lineItems: []
        errorMessage: null
        processingStartedAt: '2026-09-05T14:00:01Z'
        processingCompletedAt: '2026-09-05T14:00:09Z'
        createdAt: '2026-09-05T14:00:00Z'
        updatedAt: '2026-09-05T14:00:09Z'

    ReceiptStatusResponse:
      type: object
      description: |
        The poll target's whole body. Four fields, so that watching a receipt
        through its pipeline is cheap.
      required: [id, status, reviewRequired, confidence]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-0000000000e1
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        reviewRequired:
          type: boolean
          example: true
        confidence:
          type: string
          nullable: true
          pattern: '^\d+(\.\d+)?$'
          description: Same shape as `Confidence`; null until the pipeline has scored.
          example: '0.940'
      example:
        id: 00000000-0000-4000-8000-0000000000e1
        status: COMPLETE
        reviewRequired: true
        confidence: null

    ReceiptPatchRequest:
      type: object
      description: |
        Manual fields for a receipt. Every property is optional and an absent
        one is left alone; there is no way to clear a field back to null here.
        A body with no property at all is 400 `validation-error` rather than a
        silent no-op.
      properties:
        extractedMerchant:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The merchant. The server also rejects an all-whitespace value.
          example: Blue Bottle Coffee
        extractedAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: |
            The receipt total. `MoneyAmount` admits a negative because the
            ledger has negative amounts elsewhere; a receipt total does not, and
            the server refuses one below zero with 400 `validation-error`. Zero
            or greater and at most 1000000000.
        extractedCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        extractedDate:
          type: string
          format: date
          description: The date printed on the receipt.
          example: '2026-06-05'
        matchedTransactionId:
          type: string
          format: uuid
          description: |
            A transaction of this household to attach the receipt to. The
            transaction's own `receiptId` is written in the same database
            transaction. An id that is not this household's is 404.
          example: 00000000-0000-4000-8000-0000000000b1
      example:
        extractedMerchant: Blue Bottle Coffee
        extractedAmount: '12.34'
        extractedCurrency: CAD
        extractedDate: '2026-06-05'
        matchedTransactionId: 00000000-0000-4000-8000-0000000000b1

    ReceiptReviewRequest:
      type: object
      description: |
        The reviewer's verdict. `true` clears `reviewRequired`; `false` marks
        the receipt `FAILED` — the member saying the extraction is not worth
        correcting. The image stays stored and downloadable either way.
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: Whether the extracted fields are good enough to keep.
          example: true
      example:
        accepted: true
