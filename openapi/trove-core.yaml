  # ---------------------------------------------------------------- audit
  /v1/audit:
    get:
      operationId: listAuditLog
      tags: [Administration]
      summary: The household's request log
      description: |
        **Requires the `ADMIN` role.**

        One row per mutating request (`POST`, `PUT`, `PATCH`, `DELETE`) the
        install handled: what was called, what it answered, who was signed in,
        from where, and how long it took. Newest first, paged. Reads are not
        recorded — they would dominate the table, and the question it exists to
        answer is "what changed, and who changed it".

        `path` is the matched **route template** (`/api/v1/admin/users/{id}`),
        never the caller's raw URI. One route on this API (`GET
        /v1/auth/invites/{token}`) carries a live credential in the path. It is
        a read, so it is never recorded, but the table stores the route template
        regardless, so that a future change to the audit scope could never turn
        it into a second, permanent, plaintext copy of every invitation token
        this install has issued. Nothing else about the request is kept: no body, no headers, no
        query string, no token.

        Scoped to the caller's own household. `userId` and `clientIp` are null
        when the server had neither — an unauthenticated request has no user, and
        a request made in-process has no address — and `userId` keeps the raw id
        of an account that is later deleted, because an incident review must not
        be erasable by deleting an account.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            One page of the household's audit log. `meta` carries the totals, so a
            client renders its page controls from the same fetch that rendered the
            rows.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogEntry'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

