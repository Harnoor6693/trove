        otherwise 400 `validation-error`; the column carries a real foreign key
        to `category` with `ON DELETE RESTRICT`, so a category an envelope
        budgets cannot vanish underneath it.

        **One envelope per category per period**: a second envelope for a
        category the period already budgets is 409 `conflict`.

        `currency` defaults to the PERIOD's currency when omitted. An envelope
        only ever sums transactions of its own currency, and a household holding
        one CAD and one USD envelope in the same month is a normal case, not an
        error.

        On a `ZERO_BASED` period, the allocations must sum to exactly the
        period's `totalIncome` after the write; one that would break that is 400
        `validation-error` naming `allocated`. The pre-collapse service answered
