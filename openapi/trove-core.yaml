  /v1/me/export:
    get:
      operationId: listDataExports
      tags: [Me]
      summary: The caller's own data-export runs
      description: |
        A page of the caller's full-data-export runs, newest first.

        **Scoped to the member, not the household.** An archive is a copy of one
        person's whole financial life, so a household mate's runs are not in this
        list and are not reachable by id either — the same rule the tax export
        follows, and the opposite of every ledger route on this API.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: One page of the caller's runs, with `meta` carrying the totals.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DataExportRunResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createDataExport
      tags: [Me]
      summary: Start a full data export
      description: |
        **Step-up**, with the same body and the same rules as `DELETE /v1/me`: a
        password, a code where a second factor is enrolled, and for a member who
        signs in only through an identity provider the code alone. An archive is
        a copy of everything the member has, so holding a session is not enough
        to ask for one.

        Records a run as `PENDING`, hands the generation to a bounded background
        executor and answers **202** with the row. Poll
        `GET /v1/me/export/{id}` until `status` is `COMPLETE`, then download it.
        If the executor's queue is full the row is flipped to `FAILED` before this
        response is sent — the answer is still 202 and still carries a real,
        queryable id.

        **One run per member per day**, counted over the member's own local day
        from their timezone, not the server's. A second request the same day is
        409 `conflict` and the message says when they may ask again. This is
        deliberately not expressed in the rate limiter, which buckets by path and
        client address rather than by member and so cannot say it.

        **What the archive contains.** A ZIP holding `manifest.json` (a schema
        version, the generating server version, the run id, the member and
        household ids, the generation instant and one entry per file with its
        byte count), `transactions.csv`, and one JSON document per dataset —
        accounts, categories, merchant rules, budget periods, envelopes, savings
        goals, subscriptions, net-worth snapshots, assets, liabilities, receipts,
        coach conversations, the member's own tax-line mappings and notification
        preferences.

        `transactions.csv` is the whole ledger, every transaction the household
        has: both legs of a transfer and pending rows are included. It uses the
        tax export's columns followed by `type`, `accountId`, `transferGroupId`
        and `pending`, and it has no totals section, so it is one rectangular
        table an importer can read. It is UTF-8 with a byte order mark. The cell
        protection is the tax export's: a cell that begins with an equals sign,
        a plus, a minus, an at sign, a tab or a carriage return is prefixed with
        an apostrophe, so a merchant literally named
        `=HYPERLINK("http://evil","click")` opens as text rather than as a live
        formula.

        **Receipts are metadata only.** Ids, status, source, merchant, amounts,
        the tax split, the matched transaction, the uploader, timestamps and the
        image file names — never the image bytes, never a storage key and never a
        URL. An archive that inlined every photograph a household ever took would
        not fit in the memory this export is allowed. A client should say so: the
        member downloads the receipt images from `GET /v1/receipts/{id}/download`.

        Every amount is a decimal string at the ledger's four-decimal scale and
        carries its own currency on its own row. Nothing is converted and no
        total is blended across currencies. No figure in the archive is computed.
        Dates are the member's own local dates.

        **The rows are the household's, the run is the member's.** The ledger is
        shared, so the archive contains the whole household's transactions; a
        client should say that too before it starts one.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '202':
          description: |
            The run was recorded. `status` is `PENDING` normally, or `FAILED`
            when the executor refused the work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DataExportRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/me/export/{id}:
    get:
      operationId: getDataExport
      tags: [Me]
      summary: One data-export run
      description: |
        The poll target while a run is generating.

        Resolved against the **caller's own** runs. A run belonging to anybody
        else — a household mate included — is 404, never 403, so the answer never
        confirms that another member's id is real.
      parameters:
        - $ref: '#/components/parameters/DataExportRunIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The run as it stands now.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DataExportRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/me/export/{id}/download:
    get:
      operationId: downloadDataExport
      tags: [Me]
      summary: Download a completed data export
      description: |
        Streams the archive as `application/zip`, with `Content-Disposition:
        attachment` and `X-Content-Type-Options: nosniff`. The bytes are served
        from the server's own data volume; nothing is presigned and no URL to any
        storage system is ever handed out.

        Resolved against the caller's own runs; anybody else's id, a household
        mate's included, is 404.

        **The link lives 24 hours.** `expiresAt` on the run says exactly when. A
        download after that is **409 `conflict`**, the same answer an unfinished
        run gives, and a scheduled sweep deletes the file itself rather than
        merely hiding it — an archive of somebody's whole financial life should
        not sit on a disk indefinitely because nobody fetched it.

        A run that is not yet `COMPLETE` is also **409 `conflict`**, not 404: the
        run exists and belongs to the caller, and telling a polling client "no
        such run" would make it discard state it should keep. `PENDING`,
        `GENERATING`, `FAILED` and expired all answer 409.
      parameters:
        - $ref: '#/components/parameters/DataExportRunIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The archive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionAttachment'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExportNotReady'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- administration
  /v1/admin/users:
    get:
      operationId: listHouseholdMembers
      tags: [Administration]
      summary: List the household's members
      description: |
        **Requires the `ADMIN` role.**

        Oldest first. Scoped by the caller's own household id, taken from the
        signed token — that is why an admin of one household cannot enumerate
        another, and it is enforced by the repository having no unscoped finder
        to call.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The household's members.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/users/{id}:
    delete:
      operationId: deleteHouseholdMember
      tags: [Administration]
      summary: Remove a member of the household
      description: |
        **Requires the `ADMIN` role.**

        Two refusals, and the order matters. A member of another household — or
        an id that does not exist — is **404**, not 403: the lookup is
        household-scoped, so "not yours" and "does not exist" are the same answer
        and neither confirms an id is real. The household's last `ADMIN` is
        **409 `conflict`**: an install whose only administrator has been deleted
        has no way back in, because registration is closed by default and both
        invites and the settings flag are admin routes. The guard counts rather
        than comparing ids, so self-deletion is allowed exactly while somebody
        else can still administer the household, and it runs inside one
        transaction behind a lock on the household row.

        **This is a soft delete, and it is the same path `DELETE /v1/me` takes**
        — one guard, one lock, one event, so the two cannot drift. The member is
        deactivated and stamped rather than erased, and every session of theirs
        is revoked immediately: sign-in, refresh, the weekly digest, insight
        recipients and webhook audiences all exclude them from that instant. They
        stay listed by `GET /v1/admin/users` with `active: false`, which is how
        an administrator finds them again, and
        `POST /v1/admin/users/{id}/restore` brings them back for a grace period
        (seven days by default). Only after that does a scheduled job erase the
        row for good, taking every credential, session and OIDC link with it;
        their security-event history survives with a null user id, because an
        incident review must not be erasable by deleting an account. Deleting a
        member who is **already** inside that window is **409 `conflict`**, not a
        second deletion: asking again would only restart their restore window and
        delay the erasure.

        Their email address stays reserved for as long as the row does, so the
        same address cannot be invited or registered again until the erasure has
        run.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The member is deactivated, stamped and their sessions revoked. They
            remain in `GET /v1/admin/users` with `active: false` until the grace
            period ends.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /v1/admin/users/{id}/restore:
    post:
      operationId: restoreHouseholdMember
      tags: [Administration]
      summary: Restore a member inside the deletion grace period
      description: |
        **Requires the `ADMIN` role.**

        The other half of the soft delete. A member removed by `DELETE /v1/me` or
        by `DELETE /v1/admin/users/{id}` is deactivated and stamped, not erased:
        for a grace period (seven days by default) an administrator can bring the
        account back, and this is the route that does it. It clears the deletion
        stamp, reactivates the account and records the restoration against the
        acting administrator.

        The member's sessions are **not** brought back — they were revoked at
        deletion and cannot be un-revoked. The member signs in again with the
        credentials they already had.

        A member of another household, or an id that does not exist, is **404**,
        not 403: the lookup is household-scoped, so "not yours" and "does not
        exist" are the same answer.

        A member who was never deleted, or whose grace period has already passed,
        is **409 `conflict`**. Once the grace has passed the row is gone or about
        to be, and there is nothing left to restore. Their address is still
        reserved until the erasure actually runs, which is a daily job rather
        than an instant, so an account in that state can be neither restored here
        nor registered again until the next pass — invite them again afterwards.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The account is active again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/users/{id}/unlock:
    post:
      operationId: unlockHouseholdMember
      tags: [Administration]
      summary: Clear a member's sign-in lock
      description: |
        **Requires the `ADMIN` role.**

        Ends every sign-in throttle on the member's account, from every address,
        by forgetting its failed attempts. Throttles end by themselves within
        fifteen minutes, but an account under attack from many addresses stays
        throttled for addresses it has not signed in from until the attack
        stops; this is the way out for a member signing in from somewhere new.
        It does not change the password.

        **A self-target is 403 `step-up-required`**, so that "an admin route
        never acts on the admin's own security state" is one rule rather than a
        list of exceptions. An administrator who has locked themselves out uses
        the server console, which requires shell access — a credential a stolen
        session does not confer.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The lock is cleared (or there was none).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminSelfTargetRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/users/{id}/totp:
    delete:
      operationId: clearHouseholdMemberTotp
      tags: [Administration]
      summary: Clear a member's second factor
      description: |
        **Requires the `ADMIN` role.**

        The lost-phone escape hatch. It records the removal against the admin as
        actor and the member as subject, which is the entire reason those are two
        columns: "the second factor was removed from this account" and "this
        account removed its own second factor" are different stories and an
        incident review needs to tell them apart.

        **A self-target is 403 `step-up-required`.** `DELETE /v1/auth/totp`
        demands the password *and* a live code before it will remove a second
        factor, precisely because holding a session is not the same as knowing
        the password. An admin who could clear their own factor from here would
        need neither, so the strongest control on the account would be removable
        by the weakest credential that reaches it.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The member's second factor is gone (or there was none).
          headers:
