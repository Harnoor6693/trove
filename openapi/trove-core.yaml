# =============================================================================
# Trove core API — the single source of truth for every /api/v1 route.
#
# Hand-written and versioned with the code (owner decision, 2026-09-04:
# "OpenAPI-first"). It describes EXACTLY what core/ serves; OpenApiRouteDriftIT
# and the integration tests' OpenApiConformance fail the build if a route or
# response drifts from it. Any change to a controller extends this file first.
#
# WHY OpenAPI 3.0.3 AND NOT 3.1
# -----------------------------
# core/'s integration tests validate every real request/response pair against
# this file with com.atlassian.oai's request validator (BaseIT ->
# OpenApiConformance). 3.0.3 is what the document is written and lint-clean in,
# and what that validator evaluates exactly: `nullable: true` instead of
# `type: [x, "null"]`, and singular `example`.
#
# The authoring note here used to say 3.1 was impossible because the validator's
# latest release (2.44.9) evaluated bodies through com.github.fge.jsonschema,
# JSON Schema draft-04, with no 2020-12 evaluator. That is out of date and is
# corrected rather than left standing: the project shipped 3.0.0 on 2026-05-13,
# renaming the artifact from swagger-request-validator-core to
# openapi-request-validator-core (the old coordinate is now a jar-less POM whose
# <relocation> points at the new one) and replacing the draft-04 engine with
# com.networknt:json-schema-validator, which does evaluate 2020-12. So 3.1 is no
# longer blocked by the tooling. Moving to it is a deliberate change of its own —
# every `nullable: true` becomes a type array, and the whole document has to be
# re-verified against the server — and is not made as a side effect. 3.0.3 is
# validated on every build today; that is why it stays.
#
# WHY EMAIL FIELDS CARRY A `pattern` AND NOT `format: email`
# ----------------------------------------------------------
# The server checks addresses with Jakarta Bean Validation's `@Email`, which
# accepts any syntactically well-formed mailbox and says nothing about the
# domain being registrable. Validators that assert `format: email` — including
# the one core/'s ITs run — implement it against a public-suffix list and refuse
# reserved TLDs, so `admin@trove.test`, `member@example.test` and every address
# on an install's internal domain would be called invalid by a client generated
# from this document while the server happily accepts them. That is a contract
# that lies about the server, so the keyword is not used. `pattern` states the
# part that is actually true and enforced — exactly one `@`, no whitespace —
# and the field descriptions name `@Email` as the server's rule.
#
# ONE VALIDATOR SETTING THIS DOCUMENT DEPENDS ON
# ----------------------------------------------
# The validator injects `additionalProperties: false` into every schema node
# that declares `properties` and does not say otherwise, unless
# `validation.schema.additionalProperties` is set to IGNORE. On this document
# that injection is fatal and wrong: the envelope is composed with `allOf` on
# purpose, so the branch contributing `success` would reject `data` and the
# branch contributing `data` would reject `success`, and every enveloped body in
# the API would fail. OpenApiConformance switches the injection off, which leaves
# the `additionalProperties: false` written HERE — and nothing else — in force.
# That is deliberate and load-bearing: response schemas are closed, request
# schemas are open (the server disables FAIL_ON_UNKNOWN_PROPERTIES, and a closed
# request schema would describe a stricter server than the one that ships).
#
# WHAT IS DELIBERATELY NOT IN HERE
# --------------------------------
#   * `/api/oauth2/authorization/oidc` and `/api/login/oauth2/code/oidc` —
#     served by Spring Security's own filters, not by a Trove controller. They
#     are browser redirect endpoints with no JSON contract to hold.
#   * `GET /v1/health` — no controller has ever served it. It sat in
#     SecurityConfig's PUBLIC_GET list with nothing behind it; the step-3b
#     review round took that dead permit entry out, because a permit for a route
#     that does not exist is a standing invitation to publish the route the day
#     someone adds one. The path is now simply unmatched, like any other unknown
#     path: 401 to an anonymous caller, 404 to a signed-in one. The liveness
#     probe that ships is `GET /v1/status`; the deep one is Spring Boot's
#     actuator on the management port.
#   * `405 method-not-allowed`, `404 not-found` for an unmatched path, and the
#     500 that an unsupported media type currently produces: these are answers
#     to requests that match NO operation, so they cannot be attached to one.
#     They are described under the error model below instead.
#
# LINT
# ----
# `npx --yes @redocly/cli@latest lint openapi/trove-core.yaml` — clean apart
# from two deliberate rule exceptions, all of the same kind: the rules are style
# heuristics, and satisfying them here would mean writing down a response the
# server does not produce. A contract whose whole purpose is to be TESTED against
# the server must not carry fiction to please a linter.
#
#   * `operation-4xx-response` on `GET /v1/status`. It is the one route the rate
#     limiter is exempt from (it is what a load balancer and the SPA's degraded
#     banner poll continuously), it takes no input, and it is anonymous — so
#     there is no 4xx it can answer. `GET /v1/auth/providers` and
#     `GET /v1/auth/invites/{token}` were on this list until collapse step 4 and
#     are not any more: both now declare 429, because the limiter sits in front
#     of them. The invite preview's own verdict is still deliberately **always
#     200** with the answer in the body, so that an invalid token cannot be told
#     from a valid one by its status. (405 and 404 for an unmatched path are
#     answers to requests that match no operation — see above.)
#   * `operation-2xx-response` on `GET /v1/auth/start`, whose success answer is a
#     302 to the provider. There is no 2xx to declare.
# =============================================================================
openapi: 3.0.3

info:
  title: Trove core API
  version: 1.0.0
  description: |
    The HTTP contract of the Trove core service. Four rules run through all of it.

    **The envelope.** Every route below answers with
    `ApiResponse{success, data, error, meta}`. A success is `{"success": true}`
    plus `data` when the operation returns a value (`data` is *omitted*, not
    null, when it returns none — Jackson serialises the envelope with
    `@JsonInclude(NON_NULL)`). A failure is `{"success": false, "error": {…}}`
    with no `data`. `meta` carries pagination (`PaginationMeta`) and is present
    only on paged list operations such as `GET /v1/audit` and `GET
    /v1/me/export`; it is absent everywhere else. The only JSON response that is not an envelope is
    `GET /v1/status`, which is bare so an uptime probe has something trivial to
    key off.

    **Auth modes.** One session, two carriers, chosen per request with
    `X-Trove-Auth-Mode`. In **bearer** mode (the default when the header is
    absent, and what the mobile client uses) the tokens come back in the
    response body and the caller sends `Authorization: Bearer …`. In **cookie**
    mode (`X-Trove-Auth-Mode: cookie`, what the web client sends) the body
    carries no tokens at all and the server sets `__Host-trove_access` and
    `__Host-trove_refresh` — HttpOnly, Secure, SameSite=Lax, Path=/. Because
    the two modes return different shapes, every session-bearing response is a
    `oneOf` and the client discriminates on which fields are present.

    **CSRF.** Demanded only of requests that carry an ambient browser
    credential — but the two demands are separate rules with different
    triggers, and a client that conflates them will send a header the server
    never asked for or, worse, expect one it does not get.

    * The **double-submit token** (`X-XSRF-TOKEN`, echoing the non-HttpOnly
      `XSRF-TOKEN` cookie the server plants) is demanded of any mutating
      request that either presents a session cookie or declares
      `X-Trove-Auth-Mode: cookie` — *including the browser's anonymous login
      and register*, because login CSRF, logging a victim into the attacker's
      account, is a real attack and only the token stops it.
    * The **`XSRF-TOKEN` cookie is replaced** on every cookie-mode sign-in
      (`/v1/auth/register`, `/v1/auth/login` when it returns a session,
      `/v1/auth/login/totp`, and OIDC). A client must re-read the cookie and
      send the new value from then on. `POST /v1/auth/refresh` keeps the
      existing token, so a request replayed after a refresh still carries a
      valid value. A bearer-mode sign-in does not replace it.
    * **`X-Requested-With: XMLHttpRequest`** is demanded only once a request
      has actually authenticated **through the session cookie**. An anonymous
      cookie-mode login or register has no session to ride and does not need
      it, though the web client sends it on everything anyway.

    A bearer caller sends neither and is never checked — a third-party page
    cannot set an `Authorization` header, so there is nothing to ride. A
    missing token is 403 `forbidden`; a missing `X-Requested-With` on a
    cookie-authenticated mutation is 403 `csrf-header-missing`.

    **Errors.** RFC 7807 inside the envelope:
    `error{type, title, status, detail, instance, requestId, fieldErrors}`.
    `type` is always `https://trove.finance/errors/<slug>` and the slug — not
    the status, not the prose — is what clients switch on. `instance` is the
    matched route template (`/api/v1/auth/invites/{token}`), never the caller's
    raw URI. `requestId` is echoed in the `X-Request-Id` response header and is
    the string to quote when reporting a 500. `fieldErrors` is present only on
    a 400 that failed field validation, as `[{field, message}]`.

    Requests that match no operation are answered outside this document:
    an unknown path is 404 `not-found`, a known path with an unsupported method
    is 405 `method-not-allowed`, and a body sent with an unsupported media type
    currently falls through to 500 `internal-server-error`.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Trove
    url: https://trove.finance/

servers:
  - url: /api
    description: |
      The servlet context path (`server.servlet.context-path: /api`). Every
      path below is relative to it, so `/v1/status` is served at `/api/v1/status`.

tags:
  - name: Status
    description: The unauthenticated liveness probe. The one route outside the envelope.
  - name: Authentication
    description: |
      Registration, login (including the second factor), session rotation and
      logout. Everything reachable without a session, plus the OIDC entry point.
  - name: Account security
    description: |
      Credential management for an account that is already signed in — password
      change, admin-minted reset links, TOTP enrolment and removal. Every route
      here re-proves the password (step-up) except the two reset endpoints and
      `POST /v1/auth/totp/confirm`, which confirms an enrolment that was itself
      started behind a password.
  - name: Me
    description: The caller's own profile, preferences and security history, plus self-service account deletion and full data export.
  - name: Administration
    description: |
      Household administration. Every operation requires the `ADMIN` role and is
      scoped to the caller's own household — "not yours" and "does not exist"
      are the same 404.
  - name: Categories
    description: |
      Transaction categories and the household's own merchant rules. System
      categories (seeded, `householdId` null) are readable and usable by every
      household but cannot be renamed or deleted through this API; household
      categories are fully editable by any member. Every operation is scoped to
      the caller's own household from the signed token.
  - name: Accounts
    description: |
      The household's connected accounts — bank connections, uploaded-file
      accounts, and the credential-less manual account that hand-entered
      transactions live on. One shared ledger per household: every member sees
      and may change every account, and `createdBy` is audit, not scope. The
      encrypted source credentials are never returned by any operation here.
  - name: Transactions
    description: |
      The household's transaction ledger: the paged, filtered list, one
      transaction by id, manual entry, enrichment, and deletion of hand-entered
      rows. Every operation is scoped to the caller's household from the signed
      token, and an id from another household is 404, never 403.
  - name: Imports
    description: |
      Uploading a CSV or OFX file, seeing what importing it would do before
      anything is written, committing it into the ledger, and taking it back out
      again. Every operation is scoped to the caller's household from the signed
      token; a batch belonging to another household is 404, never 403. The
      uploaded file is retained only while the batch can still be undone.
  - name: Dashboard
    description: |
      Today's and this month's spending and income, with every boundary computed
      in the caller's own timezone and every currency reported separately.
  - name: AI
    description: |
      Each member's own OpenAI-compatible endpoint: its URL, its write-only API
      key, its models, and the two-key opt-in that decides whether it may be a
      private LAN address. Per-user, not per-household — a household mate cannot
      read or write these settings, which is the opposite of the shared ledger.

      The coach rides on the same per-member endpoint: conversations, their
      streamed answers and the weekly insights are each member's own, encrypted
      at rest, and a household mate asking for one of them is answered 404. The
      figures inside them come from the shared household ledger; the
      conversation about them does not.
  - name: Net Worth
    description: |
      The household's net-worth snapshots, assets and liabilities — one shared
      ledger per household, every currency reported separately and never
      blended into a single converted total (no FX rate exists in this
      system). The daily job and the manual snapshot route perform the same
      upsert-by-currency write; the series route only reads what has already
      been captured.
  - name: Subscriptions
    description: |
      Recurring charges detected in the household's ledger, the price-change
      alerts they raise, and the manual trigger that runs detection now. Rows
      are written only by detection — there is no create or update route, and
      `DELETE /v1/subscriptions/{id}` is a SOFT delete that leaves the row
      readable. Every operation is scoped to the caller's household from the
      signed token; an id from another household is 404, never 403.
  - name: Budgets
    description: |
      The household's budget periods, the envelopes inside them, and its savings
      goals — one shared ledger per household, so every member sees and may
      change all of them and `createdBy` is audit, not scope. An envelope's
      `spent` is rewritten from the ledger whenever a transaction in its
      category and month is categorised or ingested; it is never incremented,
      which is what makes recategorisation and re-sync unable to double-count.
      Every currency is budgeted separately and never blended.

  - name: Tax export
    description: |
      The tax-time export: a per-member CSV or PDF of a whole calendar year of
      the household's ledger, categorised and labelled with the line each
      category belongs on in the member's own jurisdiction (CA or US).

      **Per member, not per household** — one of the areas of this API (with
      notifications, webhooks, AI settings and coach, and the full data export)
      where a household mate is refused rather than served. The rows come from the shared ledger; the run,
      the file and the line overrides belong to one member, and another
      member's run is 404.

      **No tax is computed anywhere.** There is no rate, no bracket, no GST or
      sales-tax split and no total owing in any schema here: line codes and
      labels are strings a human reads off a form, and the only figures are the
      member's own amounts, summed per line and per currency without conversion.

  - name: Notifications
    description: |
      Each member's own notification inbox and the preferences that govern it.

      **Per member, not per household** — one of the areas of this API where a
      household mate is refused rather than served. The ledger is
      shared; a notification is addressed to one person, so another member's
      inbox, preferences and webhooks are 404 by id, never 403.

      **There is no push channel and no device registration**, and that is a
      decision rather than an omission (owner, 2026-09-03): no push until a
      direct APNs/FCM path exists, and no Expo relay. Mobile polls
      `GET /v1/notifications/unread-count` and raises a client-local
      notification from the result. Two channels exist server-side, `IN_APP`
      and `EMAIL`, and email is off on every install until SMTP is configured.
  - name: Receipts
    description: |
      Receipt images and what the server can read off them. A receipt is
      shared household ledger data: every member sees every receipt, and the
      uploader is recorded on the row rather than being its scope.

      The upload is hardened rather than trusted — declared size, magic bytes,
      a header-only dimension probe, the household's storage quota, and a
      re-encode to JPEG that strips EXIF by construction. Extraction is the
      uploader's own vision model when they have configured one; when they
      have not, which is every install by default, the image is stored and the
      fields are the member's to fill in. That is the ordinary outcome, not a
      failure.
  - name: Webhooks
    description: |
      A member's own outbound webhook subscriptions: an HTTPS endpoint, a
      write-only signing secret, and the event types to deliver.

      Every target URL is checked by the shared egress policy when it is saved
      **and again before every delivery attempt**, and the HTTP client connects
      to the address the policy approved rather than resolving the name a
      second time — the two halves that close the DNS-rebinding window a
      validate-once design leaves open.


# The requirement every operation inherits. Ten override it with `security: []`,
# and those ten are exactly SecurityConfig's PUBLIC_GET + PUBLIC_POST permit
# list — held there on every build by OpenApiRouteDriftIT, not by the request
# validator, whose SecurityValidator returns an empty report for any operation
# that has no `security` of its own and therefore never sees this root block.
# The same test holds `x-trove-required-role: ADMIN` against the role guard.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------- status
  /v1/status:
    get:
      operationId: getStatus
      tags: [Status]
      summary: Server status
      description: |
        The unauthenticated, detail-free probe. **The one JSON route whose
        body is not the `ApiResponse` envelope** — it is bare so that an uptime
        check and the SPA's degraded state have something trivial to key off.

        `status` is the actuator aggregate collapsed to two words: anything that
        is not `UP` is `DEGRADED`. Which component is unhappy is management-port
        information (port 9090) and never crosses this boundary.
      security: []
      responses:
        '200':
          description: The server answered.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- auth (public)
  /v1/auth/register:
    post:
      operationId: register
      tags: [Authentication]
      summary: Create an account and sign in
      description: |
        201 with the same body shape as a login. Registration is closed by
        default: the ordinary path is redeeming an invite an admin minted, and
        the household comes from that invite — never from this body.

        An unrecognised `timezone` does not fail the request; it falls back to
        `UTC`. `currency` and `country` default to `CAD` and `CA`.

        **`email-taken` tells the caller the address has an account.** A new
        address is signed straight in, so the two answers cannot be made the
        same without a success that creates nothing, and no email is sent that
        could carry the difference instead. Only a caller holding an invite
        without a bound address, or any caller once registration is open, can
        ask. Each `email-taken` counts as a failed sign-in from the caller's
        address, so asking meets the gate that guessing passwords meets: 429
        `account-locked` after 20 inside 10 minutes.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthModeHeader'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: |
            The account exists and a session is open. In cookie mode the body is
            `{user}` and the session is in the `Set-Cookie` headers; in bearer
            mode the tokens are in the body and no cookies are set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/RegisterRejected'
        '403':
          $ref: '#/components/responses/RegistrationClosed'
        '404':
          $ref: '#/components/responses/InviteInvalid'
        '410':
          $ref: '#/components/responses/InviteExpired'
        '429':
          $ref: '#/components/responses/LoginThrottled'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in with an email address and password
      description: |
        **A second factor being owed is a 200, not an error.** The body is a
        successful envelope carrying `{challengeToken}`; the clients discriminate
        on that field's presence and show the code screen. An error status would
        never reach that check and the user would be told their password was
        wrong.

        Every credential failure — unknown address, wrong password, locked,
        deactivated — is the same 401 `credentials-invalid` with the same detail.
        The per-address gate answers 429 `account-locked` before the password is
        even checked.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthModeHeader'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Either a session (cookie or bearer shape) or a TOTP challenge.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/CredentialsInvalid'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/LoginThrottled'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/login/totp:
    post:
      operationId: loginTotp
      tags: [Authentication]
      summary: Complete a two-factor sign-in
      description: |
        The challenge token is the only credential accepted here, and it may
        arrive two ways. `challengeToken` in the body is what the password login
        hands the client. When it is absent the server reads the
        `__Host-trove_totp_challenge` cookie, which is what the OIDC callback
        leaves behind for a browser that never saw a token. Body first, so an
        explicit token always beats a stale cookie from an abandoned attempt.
        **Neither present is 401** — the same answer a bad token gets; this route
        never says which half of a failed second factor was missing.

        A successful call clears the challenge cookie. A locked account is
        refused 401 `credentials-invalid` even with a live challenge and a
        correct code, so the lock stays invisible.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthModeHeader'
        - $ref: '#/components/parameters/TotpChallengeCookie'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpLoginRequest'
      responses:
        '200':
          description: |
            A full session. The challenge cookie is cleared in the same response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookiesClearingChallenge'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/TotpChallengeRefused'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/LoginThrottled'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: Rotate the refresh token
      description: |
        The body is optional and may be omitted entirely: the web client posts no
        body and relies on `__Host-trove_refresh`, mobile puts the token in the
        body. Body first, cookie second, so one route serves both.

        **Where the token came from decides the mode, not the header alone.** A
        token that arrived in a cookie came from a browser, so the answer is a
        cookie-mode one whatever `X-Trove-Auth-Mode` said — answering it with
        tokens in the body would put a live credential somewhere a script can
        read it. A failed rotation clears both session cookies.

        **Reuse has a grace window.** Re-presenting a token this route has
        already spent returns the same successor again, with a normal 200 and no
        security event, for 30 seconds (`trove.auth.refresh.reuse-grace`) — two
        tabs racing a 401, or one retried request, are ordinary. After that
        window the whole refresh family is revoked, and every call that presents
        any token of it is 401 `unauthorized`. So a 401 here is not always
        retryable: it can mean the family is burnt and the user has to sign in
        again.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthModeHeader'
        - $ref: '#/components/parameters/RefreshCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: |
            Rotated. In cookie mode the body carries only `expiresIn` and the new
            pair is in the `Set-Cookie` headers; in bearer mode both new tokens
            are in the body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: End this session
      description: |
        Idempotent. An unknown, expired or entirely absent refresh token is still
        a 200, and both session cookies are cleared either way. `data` is omitted
        from the envelope because the operation returns no value.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session is gone and the cookies are cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/providers:
    get:
      operationId: getAuthProviders
      tags: [Authentication]
      summary: What this install offers on the sign-in page
      description: |
        Public; the login page renders itself from this. `registrationOpen` is
        read from the household row rather than from configuration, so an admin's
        runtime decision is what the page reflects. `local` is always `true` in
        this version.

        `oidc.startUrl` is **absolute** (`{publicUrl}/api/v1/auth/start`) and is
        null when single sign-on is not configured.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The install's sign-in options.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvidersResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/invites/{token}:
    get:
      operationId: previewInvite
      tags: [Authentication]
      summary: Check an invitation link before redeeming it
      description: |
        Public, and **always 200** — the verdict is in the body, never in the
        status. An unknown, revoked, used or expired token is
        `{valid: false, email: null, expiresAt: null}`, one answer for all four,
        so the route cannot be used to tell a real token from a near miss.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The raw invitation token from the link an admin handed over.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            example: aW52aXRlLXRva2VuLUVYQU1QTEUtbm90LXJlYWw
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The verdict on the token.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/InvitePreviewResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/start:
    get:
      operationId: startOidc
      tags: [Authentication]
      summary: Begin single sign-on
      description: |
        The OIDC entry point the web login page links to. A 302 to Spring
        Security's own authorization endpoint rather than a link straight to it,
        so the client has one stable URL whose behaviour changes with
        configuration instead of a hardcoded link that 404s on the majority of
        installs that never configure a provider.

        **This route does not use the envelope on success** — it has no body at
        all. When single sign-on is not configured it is a normal enveloped 404
        `not-found`.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '302':
          description: |
            Single sign-on is configured. Redirects to the Spring Security
            authorization endpoint, which is not part of this contract.
          headers:
            Location:
              description: The provider authorization endpoint on this server.
              schema:
                type: string
                example: /api/oauth2/authorization/oidc
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '404':
          $ref: '#/components/responses/OidcNotConfigured'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  # ---------------------------------------------------------------- account security
  /v1/auth/password:
    post:
      operationId: changePassword
      tags: [Account security]
      summary: Change the password of the signed-in account
      description: |
        Needs the current password in the body as well as a session: a session
        token is what somebody who borrowed an unlocked laptop already has, and
        it is not evidence of who is at the keyboard. A wrong current password is
        403 `step-up-required`, **not 401** — a 401 would send every client
        interceptor off to refresh a session that is perfectly valid.

        **Ends every other session and leaves this one working.** The response
        carries `{user}` and no tokens, and sets no cookies: the caller's existing
        pair is still valid, so re-issuing one would put a live credential in a
        second place for no benefit.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: The password changed. `data` is `{user}` — no tokens, no cookies.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CookieSession'
        '400':
          $ref: '#/components/responses/PasswordRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/password/reset-request:
    post:
      operationId: requestPasswordResetLink
      tags: [Account security]
      summary: Mint a password reset link for a household member
      description: |
        **Requires the `ADMIN` role.**

        Password reset here is not an email, because most self-hosted installs
        have no mail server. It is an admin minting a one-hour single-use link
        and handing it over out of band. That is also why the route is
        admin-scoped rather than public: a public route that mints reset links,
        with no second channel to deliver them through, would simply be a reset
        oracle.

        Resolution is scoped to the admin's own household; an address that
        belongs to another household is 404 `not-found`.
      x-trove-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetLinkRequest'
      responses:
        '200':
          description: The link and its expiry. This is the only time the link is readable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordResetLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/password/reset:
    post:
      operationId: redeemPasswordResetLink
      tags: [Account security]
      summary: Set a new password with a reset token
      description: |
        Public — the token is the whole authorisation. Unknown, expired and
        already-used tokens get the identical 400 `reset-invalid`, so the route
        cannot be used to test guesses.

        The password policy is checked **before** the token is consumed, so a
        refused password leaves the link usable and the member can try again
        rather than having to ask for a second one. On success every session of
        that account is revoked and any lock is cleared; the response clears this
        browser's session cookies too.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: The password is set and every session of that account is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/ResetRejected'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/totp/setup:
    post:
      operationId: setupTotp
      tags: [Account security]
      summary: Begin TOTP enrolment
      description: |
        Behind a fresh password. The secret is returned but **the factor is not
        enabled**: it stays off until `POST /v1/auth/totp/confirm` sees one live
        code. The failure this ordering prevents is a user who scans a QR code
        badly, turns on two-factor, and locks themselves out of their own finance
        server with no reset path.

        Enrolling while TOTP is already enabled is 409 `totp-already-enabled`.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpSetupRequest'
      responses:
        '200':
          description: The enrolment secret. Not yet in force.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TotpEnrolment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '409':
          $ref: '#/components/responses/TotpStateConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [Account security]
      summary: Enable TOTP with one live code
      description: |
        One live code enables the factor and mints the recovery codes. **This is
        the only time the recovery codes are readable**; they are stored hashed.

        No enrolment in progress is 409 `totp-not-enrolled`; an already-enabled
        factor is 409 `totp-already-enabled`; a wrong code is 401 `totp-invalid`.
        This route takes no password — the enrolment it confirms was started
        behind one.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          description: TOTP is on. The recovery codes are shown once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TotpConfirmResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/TotpCodeRefused'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '409':
          $ref: '#/components/responses/TotpStateConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/totp:
    delete:
      operationId: disableTotp
      tags: [Account security]
      summary: Remove the second factor
      description: |
        Password **and** a current code. Requiring only one of them would make the
        second factor removable by exactly the attacker it exists to stop:
        whoever has the password but not the phone, or whoever has the unlocked
        device but not the password. Either one being wrong is 403
        `step-up-required`.

        `POST /v1/auth/totp/disable` is the identical operation with the identical
        body, for callers and intermediaries that drop a DELETE body.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '200':
          description: The second factor is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/auth/totp/disable:
    post:
      operationId: disableTotpByPost
      tags: [Account security]
      summary: Remove the second factor (POST form)
      description: |
        The same operation as `DELETE /v1/auth/totp`, with the same body and the
        same answers. Two verbs for one action because a DELETE that carries a
        request body is legal but poorly supported — RFC 9110 leaves its
        semantics undefined and intermediaries drop the body without saying so,
        which would turn a deliberate action into an unexplained 400 in front of
        a user changing how their account is secured. The DELETE stays because
        the mobile client already calls it; this is the one that always works.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '200':
          description: The second factor is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  # ---------------------------------------------------------------- me
  /v1/auth/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The signed-in account
      description: |
        The session read both clients hydrate from on every app start. Read fresh
        from the database rather than assembled from token claims: a token lives
        fifteen minutes, and a display name, locale or `onboardingCompleted` flag
        changed inside that window has to be visible on the next read — the
        alternative is a settings screen that appears not to have saved.

        It lives under `/v1/auth/` rather than `/v1/me` because that is where
        the shipped clients call it; the web client calls it with refresh-on-401
        switched off for the first-visit probe (`skipAuthRefresh`), so an
        anonymous 401 stays a 401.

        Identity comes from the signed token. No route in this group takes a user
        id from a path, a query or a body.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The caller's account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LimiterUnavailable'

  /v1/me:
    put:
      operationId: updateMe
      tags: [Me]
      summary: Update the caller's profile
      description: |
        A partial update that returns the whole `MeResponse`, so the client can
        write the response straight into its store. An absent or null field is
        left untouched. A `displayName` that is blank after trimming is 400
        `validation-error`; an unrecognised `timezone` is 400 `validation-error`
        here (unlike registration, which falls back to UTC).
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: The merged profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: deleteMyAccount
      tags: [Me]
      summary: Delete the caller's own account
      description: |
        **Step-up.** The body carries the caller's current password and, where a
        second factor is enrolled, a current code. A wrong one is 403
        `step-up-required` and records a failed-login security event.

        **A member who signs in only through an identity provider has no
        password**, so the factor set is resolved from what the account actually
        has: a member with a local password proves it (plus a code where TOTP is
        enrolled); a member with no password but an enrolled second factor
        proves the code alone; a member with neither is refused 403
        `step-up-required` with an explanation, because there is nothing left to
        prove and a session alone is exactly the credential this step-up exists
        to distrust. The way forward for that member is an administrator-issued
        password reset link, after which this route works.

        **The household's last `ADMIN` is refused with 409 `conflict`**, exactly
        as the admin route is: an install whose only administrator is gone has
        no way back in. Give another member the admin role first.

        **What deleting does.** The account is *soft* deleted: it is deactivated,
        stamped with the moment of deletion, and every session of it is revoked
        immediately, so the very next request with an existing token is refused.
        Sign-in, refresh, the weekly digest, insight recipients and webhook
        audiences all exclude it from that instant. An administrator can restore
        it for a grace period (seven days by default); after that a scheduled job
        erases the row for good.

        **What is erased, and what stays.** Erased with the member: their
        password, second factor, identity links, sessions, reset links, AI
        settings, notification preferences and inbox, webhook subscriptions,
        coach conversations and insights, their tax-line overrides, and every
        export run of theirs together with its file on disk. **Kept by the
        household:** the shared ledger — transactions, accounts, categories,
        rules, budgets, envelopes, goals, net-worth snapshots, assets,
        liabilities, subscriptions and receipts, including the receipt images —
        with the departed member's name removed from the rows that recorded who
        entered them. Security-event history is also kept with the user id
        removed, because an incident review must not be erasable by deleting an
        account. A client should say this to the member before it calls.

        **The email address stays reserved until the row is erased.** Because the
        account survives the grace period, registering or accepting an invite
        with the same address before the erasure has run answers 400
        `email-taken`, and the erasure runs on a daily schedule rather than at
        the instant the grace ends. A member who means to come back with the same
        address should ask an administrator to restore the account instead.

        `POST /v1/me/delete` is the same operation with the same body, for
        clients whose stack drops a `DELETE` body.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
