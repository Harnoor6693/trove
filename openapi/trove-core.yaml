  # ---------------------------------------------------------------- ai
  /v1/ai/settings:
    get:
      operationId: getAiSettings
      tags: [AI]
      summary: The caller's own AI endpoint settings
      description: |
        **Per-user, not per-household.** The AI endpoint and its API key are
        configured by each member individually and are invisible to everyone
        else, administrators included — the opposite of the ledger tables, which
        are shared across the household. There is no route by which one member
        reads another member's row.

        A member who has never saved anything gets the defaults (`enabled:
        false`, no endpoint, no key, `privacyTier: CLOUD_OK`) rather than a 404,
        so a settings screen renders the same way on the first visit as on the
        hundredth.

        **The API key is write-only.** It is stored AES-GCM-encrypted and never
        leaves the server in any form; `hasApiKey` is the only thing this
        response says about it.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The caller's AI settings, or the defaults if none are saved.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AiSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateAiSettings
      tags: [AI]
      summary: Replace the caller's own AI endpoint settings
      description: |
        **A replace, not a patch.** Every field except `apiKey` takes its value
        from this body: an omitted nullable field is written as null, which is
        how an endpoint, a chat model or a vision model is cleared. The three
        required fields (`enabled`, `allowPrivateEndpoint`, `privacyTier`) must
        be sent every time.

        `apiKey` is the one exception, and it has to be: a write-only field
        cannot round-trip through a GET, so a client could not send it back even
        if it wanted to. Absent or null leaves the stored key alone; a non-blank
        value replaces it. Use `DELETE /v1/ai/settings/api-key` to remove one.

        **`endpointUrl` is checked by the egress policy on the way in and again
        on every call.** `https` is required unless *both* the install-wide
        `TROVE_EGRESS_ALLOW_PRIVATE` and this user's own `allowPrivateEndpoint`
        are set, which is also the only way to reach a private, loopback or
        link-local target — a LAN Ollama is the primary AI story, so a blanket
        block would be wrong, and an instance-wide switch alone would be too
        coarse for a per-user endpoint. A refusal is 400 `outbound-url-rejected`
        with a sentence naming the rule for the URL's shape (scheme, credentials,
        port); every refusal by address, including a name that does not resolve,
        reads the same and never names the address or its range. Passing
        this check at save time buys nothing on its own: the policy is
        re-evaluated, and the address re-pinned, on every outbound call.

        Turning `enabled` on requires `endpointUrl` and `model`; a body that
        enables the feature without them is 400 `validation-error`.

        A change to `endpointUrl`, `allowPrivateEndpoint` or `enabled` writes an
        `EGRESS_SETTING_CHANGE` security event, visible to the caller at
        `GET /v1/me/security-events`. The event records the endpoint's host, never
        its path, query or key.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingsUpdateRequest'
      responses:
        '200':
          description: The settings after the write.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AiSettingsResponse'
        '400':
          $ref: '#/components/responses/AiSettingsRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ai/settings/api-key:
    delete:
      operationId: deleteAiApiKey
      tags: [AI]
      summary: Forget the caller's stored API key
      description: |
        Removes the encrypted key and nothing else — the endpoint, the models and
        the flags stay as they are, because a self-hosted endpoint that needs no
        key is an ordinary configuration rather than a broken one.

        Idempotent: a caller with no stored key gets the same `{"success":true}`
        as one who had a key a moment ago. There is no 404, which is deliberate —
        the alternative turns the route into a way of asking whether somebody has
        a key configured.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The key is gone, or there was none.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ai/settings/test:
    post:
      operationId: testAiConnection
      tags: [AI]
      summary: Try the caller's configured endpoint
      description: |
        Calls the configured endpoint's model list with the stored key and the
        caller's own timeouts, through the same pinned-DNS client every other AI
        call uses, and records the outcome in `lastTestAt` / `lastTestOk`. It
        sends no prompt and no household data.

        The body is empty: the settings under test are the saved ones, so that a
        green result means the stored configuration works rather than that some
        other configuration would have.

        Failures come back as the typed AI slugs rather than as a `{ok:false}`
        payload, so a client has one vocabulary for "the endpoint refused us"
        whether it hit this route or a real completion: 409 `ai-disabled` when
        no endpoint or no chat model is saved, 400 `outbound-url-rejected` when
        the saved URL no longer passes the egress policy, 502 `ai-unreachable`,
        `ai-endpoint-unauthorized` or `ai-model-missing`, 504 `ai-timeout`.

        The 400 is `outbound-url-rejected` and nothing else: this operation has
        no request body, so neither `validation-error` nor `malformed-request`
        can arise on it.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The endpoint answered and serves the configured chat model.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AiConnectionTestResponse'
        '400':
          $ref: '#/components/responses/AiEgressRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '409':
          $ref: '#/components/responses/AiDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/AiEndpointFailure'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /v1/ai/models:
    get:
      operationId: listAiModels
      tags: [AI]
      summary: The models the caller's own endpoint serves
      description: |
        Proxies the endpoint's `GET /models` so a settings screen can offer the
        real list instead of a free-text box. The caller's own endpoint, key and
        timeouts; nothing about another member's configuration is reachable here.

        It needs a saved `endpointUrl` and nothing else — not `enabled`, and
        pointedly not a `model`, which is what it is there to help choose. A
        member who has saved an endpoint and no model gets the list. 409
        `ai-disabled` here means only that no endpoint is saved.

        The egress policy runs again on this call — a URL that was legal when it
        was saved is 400 `outbound-url-rejected` now if the install has since
        turned `TROVE_EGRESS_ALLOW_PRIVATE` off, or if the name has started
        resolving somewhere it may not go.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The endpoint's models, in the order it listed them. `data` is a bare
            array; `meta` is absent because this list is not paginated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AiModel'
        '400':
          $ref: '#/components/responses/AiEgressRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AiDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/AiEndpointFailure'
        '504':
          $ref: '#/components/responses/AiTimeout'


  # ------------------------------------------------------- coach + insights (step 13)
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [AI]
      summary: Ask the coach a question about the caller's own ledger
      description: |
        One turn of a conversation with the member's own AI endpoint, over a
        context block built from **their household's ledger**. Streaming or not,
        decided by `stream`.

        **Whose AI, and whose data.** The endpoint, the key and the timeouts are
        the caller's own (`GET /v1/ai/settings`); the ledger figures are their
        household's; the conversation is theirs alone. A household mate cannot
        read, continue or clear it — the opposite of every ledger route, and the
        reason a session id that belongs to somebody else is 404 rather than 403.

        **Sessions.** `X-Session-Id` is set on **every** response, streaming or
        not. Send it back to continue a conversation; omit it and a new one is
        started and its id returned. The value is the conversation's own id —
        there is no second correlation id to keep in step with it — and it is
        not a session in the authentication sense: it carries no privileges, it
        is not a refresh-token family, and presenting one that is not yours is
        simply 404.

        **`messages` is the turn you are sending, not the history.** The server
        takes the **last** entry, which must be `role: user`, as the question,
        and rebuilds the preceding turns from its own store for the named
        session. Earlier entries in the array are ignored. That is deliberate:
        accepting a client-supplied `assistant` turn would let a page put words
        into the model's mouth and then quote them back as the coach's own.

        **What is sent to the endpoint.** A system prompt, a context block, the
        stored history window and this question. The context block carries
        aggregates only — this month's spend, income and net in each currency
        the household holds, the current budget period's envelope allocations
        and spend by category name, asset and liability totals, and the
        subscription run rate and flagged count. It carries no account number,
        no access URL, no API key, no receipt image, no raw transaction row and
        no other member's identity. A section whose read fails or overruns the
        five-second deadline is stated as unavailable rather than reported as
        zero.

        Every coach payload is classified `SENSITIVE`, so a member whose
        `privacyTier` is `CLOUD_OK` is refused with 403 `ai-policy-blocked`
        before any connection is opened. `LOCAL_ONLY` is what this feature needs.

        **The answer is text, and nothing else.** It is stored and displayed and
        never interpreted: no tool calling, no function calling, no id, category,
        URL or command is ever taken from it. Control characters are stripped and
        the stored answer is capped.

        ### Streaming (`stream=true`)

        `200` with `Content-Type: text/event-stream`, written frame by frame as
        the endpoint produces them — nothing buffers the body. The frames are
        exactly:

        ```
        data: {"choices":[{"delta":{"content":"Your "}}]}

        data: {"choices":[{"delta":{"content":"groceries "}}]}

        data: [DONE]
        ```

        and a failure **after** the stream has opened arrives in band, as the
        last frame, with no `[DONE]` after it:

        ```
        data: {"error":{"type":"https://trove.finance/errors/ai-timeout","title":"Gateway Timeout","status":504,"detail":"…","instance":"/api/v1/chat/completions","requestId":"…"}}
        ```

        A stored answer is capped, and a stream that reaches the cap ends with an
        in-band `answer-too-long` frame rather than `[DONE]`: what arrived is
        kept and is on the screen, the endpoint did not fail, and the slug says
        so. A saved endpoint that has stopped passing the egress policy ends the
        stream the same way, with `outbound-url-rejected` — the same 400 the
        non-streaming form answers.

        The in-band error never carries a stack trace, the prompt, the endpoint's
        host or the endpoint's own response body. A client reads `response.ok`
        and the content type **before** treating a body as a stream: everything
        that can be decided before the first byte — an unknown session, AI
        switched off, the privacy tier, a malformed body, the rate limiter — is
        an ordinary JSON `ApiResponse` with the usual status, and only after
        those does the stream open. A partial answer whose stream then fails is
        still persisted; the question is persisted before the call, so a dropped
        connection loses the answer but never the question.

        ### Not streaming (`stream=false`, the default)

        The ordinary envelope with the whole answer, and the endpoint failures as
        real status codes (502 / 504) rather than as frames.
      parameters:
        - $ref: '#/components/parameters/ChatStreamQuery'
        - $ref: '#/components/parameters/SessionIdHeader'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            The answer. `application/json` when `stream` is false or absent,
            `text/event-stream` when it is true. `X-Session-Id` is present on
            both, and on every error this operation can answer once the
            conversation exists.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Session-Id:
              $ref: '#/components/headers/XSessionId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  The SSE body. Each frame is `data: ` followed by one JSON
                  object and a blank line; the stream ends with `data: [DONE]`
                  on success, or with a single `data: {"error":…}` frame on a
                  failure that happened after the response opened.
                example: |
                  data: {"choices":[{"delta":{"content":"You spent "}}]}

                  data: [DONE]
        '400':
          $ref: '#/components/responses/CoachRequestRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiPolicyBlocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AiDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/AiEndpointFailure'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /v1/chat/suggestions:
    get:
      operationId: listChatSuggestions
      tags: [AI]
      summary: Prompt starters for the coach
      description: |
        A short list of questions the member might ask next, for the empty state
        and the space under the composer.

        **It costs no AI call and needs no configured endpoint.** The strings are
        template text from the server's own prompt file, chosen by matching the
        member's most recent turn against a few keyword groups (budgets,
        subscriptions, tax) and falling back to a default list. A member who has
        never chatted, and a member with AI switched off, both get the default
        list rather than an error — the screen has to render before there is
        anything to suggest from.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: |
            The suggestions, in the order they should be shown. `data` is a bare
            array; `meta` is absent because this list is not paginated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        maxItems: 10
                        items:
                          type: string
                        example:
                          - What did I spend the most on this month?
                          - Am I on track with my savings goals?
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/chat/history:
    get:
      operationId: listChatHistory
      tags: [AI]
      summary: The caller's own coach messages
      description: |
        One page of the caller's stored turns, decrypted for them and for nobody
        else. `sessionId` narrows the page to a single conversation; without it
        the page spans every conversation the caller has, most recently used
        first and chronological within each, so a client can group by
        `sessionId` without a second request.

        **Per member.** A household mate's `sessionId` is 404, exactly as an id
        that was never issued is — these rows are not part of the shared ledger
        and the two answers must be indistinguishable.

        System turns are never returned: the system prompt and the context block
        are the server's construction, not the member's conversation.

        There is no full-text search over this collection, and that is the price
        of storing it encrypted: the message column holds AES-GCM ciphertext and
        the server keeps no plaintext copy, no plaintext preview and no derived
        title to index.
      parameters:
        - $ref: '#/components/parameters/SessionIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: One page of turns, with `meta` carrying the totals.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoachMessageResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteChatHistory
      tags: [AI]
      summary: Clear the caller's coach history
      description: |
        Deletes one conversation when `sessionId` is given, and every one of the
        caller's conversations when it is not. The messages go with the
        conversation.

        Only the caller's own: a `sessionId` that is not theirs — a household
        mate's included — is 404 and nothing is deleted. Clearing everything is
        idempotent and answers `{"success":true}` even when there was nothing to
        clear, because the alternative turns the route into a way of asking
        whether somebody has used the coach.
      parameters:
        - $ref: '#/components/parameters/SessionIdQuery'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The conversation, or all of them, is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/insights:
    get:
      operationId: listInsights
      tags: [AI]
      summary: The caller's own weekly insights
      description: |
        One page of the weekly notes the coach wrote about the caller's week,
        newest first, decrypted for them alone.

        **Whose week.** The job that writes them fires once a week on the
        server's UTC clock, but the week each note describes is the recipient's
        own — Monday to Sunday in `users.timezone` — and the figures are in the
        recipient's own `users.currency`, on the recipient's own jurisdiction
        (`users.country`, CA or US). Two members of one household in different
        timezones get different week boundaries from the same run.

        **Who gets one.** Every member whose own `ai_settings.enabled` is true,
        whether or not they have ever opened the coach. A member with AI off
        gets none and sees an empty page here.

        At most one note exists per member per week: the writer is
        `ON CONFLICT (user_id, week_start) DO NOTHING`, so a second run of the
        job — which is what a lock expiring mid-run produces — adds nothing.

        `delivered` and `deliveredAt` say whether the note has been pushed
        anywhere beyond this route. Reading this page does not set them; it is a
        safe GET.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: One page of insights, with `meta` carrying the totals.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InsightResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ------------------------------------------------------------- accounts (step 6)
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: The household's connected accounts
      description: |
        Every account belonging to the caller's household, newest first. One
        shared ledger per household (owner decision), so a household mate sees
        the same list; `createdBy` records who added the row and is for audit
        only, never for scoping.

        The encrypted source credentials (`config_encrypted`) are never part of
        this or any other response.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The household's accounts. `data` is a bare array; this list is not paged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Add an account to the household
      description: |
        Creates a `connected_account` owned by the caller's household.

        `sourceKind: MANUAL` is the credential-less case (gap P2-13): no
        credential exchange, no `config_encrypted`, and it is the only kind of
        account `POST /v1/transactions` will accept a hand-entered transaction
        onto. The other three kinds create the row that a later credential
        exchange or file upload attaches itself to; until a source is registered
        for that kind, `POST /v1/accounts/{id}/sync` answers 409 `conflict`.

        `currency` defaults to the caller's own `users.currency` when omitted.
        There is no server-side default currency literal anywhere — an account
        always carries the one it was created with.

        409 `conflict` means an account of this `sourceKind` already occupies
        this household's slot for the provider account being described: the
        unique key is `(household_id, source_kind, external_account_id)` with
        nulls compared equal, which is what lets a later re-exchange or repeat
        upload reuse the account instead of duplicating it and every transaction
        on it.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: The created account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: One account
      description: |
        Resolved inside the caller's own household, so an id belonging to
        another household is 404 and never 403 — a 403 would confirm the row
        exists.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: Rename or reclassify an account
      description: |
        Changes the presentation of an account: its label, its institution and
        its product type. `sourceKind` and `currency` are deliberately not
        writable — the first decides how the row is synced and the second is
        the denomination every transaction already stored against it was
        written in, so changing either through a rename form would silently
        reinterpret existing money.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: The account after the write.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Disconnect an account
      description: |
        Removes the account **and every transaction stored against it**
        (`ON DELETE CASCADE`), which is also the only way a synced transaction
        is ever deleted — `DELETE /v1/transactions/{id}` refuses anything that
        did not come from manual entry.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The account and its transactions are gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/accounts/{id}/sync:
    post:
      operationId: syncAccount
      tags: [Accounts]
      summary: Fetch new transactions for one account
      description: |
        Runs one synchronisation and answers with the `sync_log` row it wrote.

        The run **claims the account first**: a conditional
        `UPDATE connected_account SET sync_status='SYNCING' WHERE id=? AND
        household_id=? AND sync_status<>'SYNCING'`. Zero rows updated is 409
        `conflict`, so two overlapping triggers cannot both pass an in-memory
        check and collide halfway through the batch. The claim is released on
        every path, exceptions included.

        409 `conflict` also covers the second case: no source is registered for
        this account's `sourceKind` yet, so there is nothing to fetch from. The
        two are distinguished by `detail`, not by the slug.

        A run that fetched successfully but could not accept every row ends
        `PARTIAL_FAILURE` with a non-zero `transactionsFailed`; a run whose
        source was unreachable ends `FAILED` with `errorMessage` set. Neither is
        an HTTP error — the request itself succeeded in recording what happened.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The completed sync run.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncLogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/accounts/{id}/sync-logs:
    get:
      operationId: listAccountSyncLogs
      tags: [Accounts]
      summary: This account's sync history
      description: |
        The account's sync runs, newest first, capped at the most recent 50.
        Append-only: a row is written `RUNNING` when a run starts and updated
        once when it ends.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The account's most recent sync runs. `data` is a bare array.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SyncLogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --------------------------------------------------- setup-token exchange (step 7)
  /v1/accounts/exchange-setup-token:
    post:
      operationId: exchangeSetupToken
      tags: [Accounts]
      summary: Exchange a SimpleFIN setup token for connected accounts
      description: |
        Turns a one-time SimpleFIN setup token into one `connected_account` per
        account the bridge exposes, and runs an initial sync for each.

        **What the server does with the token.** It is base64, and it decodes to
        a one-time claim URL. That URL is put through the same egress policy every
        outbound call in this API goes through (https and every resolved address
        public), and the request is then made to the address the policy approved
        rather than to a name resolved a second time. HTTP Basic credentials that
        a bridge puts in a URL's userinfo are taken off it before the policy sees
        it and sent as an `Authorization` header to that approved address, so the
        destination is still governed and the credential still reaches the
        bridge. The bridge answers with a **permanent access URL that carries
        HTTP Basic credentials in its userinfo**; it is encrypted into
        `connected_account.config_encrypted` immediately and is never logged,
        never returned by any operation, and never quoted in an error. Neither is
        the setup token itself.

        **A re-exchange reuses the accounts it already created.** Each bridge
        account is looked up by `(household, SIMPLEFIN, the bridge's own account
        id)` and the existing row is reused. Rotating a token therefore does not
        duplicate the account or every transaction on it — `accountIds` comes back
        with the same ids as the first exchange.

        400 `outbound-url-rejected` is the egress refusal: the decoded URL was not
        https, carried credentials before the host, or resolved to an address this
        server will not connect to. The message names the **rule** that refused
        it and never the resolved address, and never echoes the token or the URL.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeSetupTokenRequest'
      responses:
        '201':
          description: |
            The accounts the exchange created or reused, and one sync run per
            account. `accountIds` is what a client counts to tell the member how
            many accounts were connected.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ExchangeSetupTokenResponse'
        '400':
          $ref: '#/components/responses/SetupTokenRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --------------------------------------------------------------- imports (step 7)
  /v1/imports:
    post:
      operationId: createImport
      tags: [Imports]
      summary: Upload a CSV or OFX file and preview what importing it would do
      description: |
        Stores the uploaded file, works out what is in it, and answers with a
        **preview**. Nothing is written to the ledger by this operation — not one
        transaction row. The batch is created with status `PREVIEW`; a separate
        `POST /v1/imports/{id}/commit` is what inserts anything.

        **The format is sniffed**, so `sourceKind` is optional: the first bytes
        of the file decide whether it is OFX 1.x (SGML), OFX 2.x (XML) or CSV.
        Sending `sourceKind` narrows the sniff rather than overriding it — a file
        that is not what it claims to be is refused.

        **`accountId` is required for CSV** and optional for OFX. A CSV file
        carries no account identity at all, so the member has to say which
        account the rows belong to. An OFX file carries `ACCTID`, and the server
        looks that up as `(household, OFX, ACCTID)`: the same file uploaded twice
        reuses the account it created the first time instead of making a second
        one and duplicating every transaction on it.

        **What the preview contains.** Counts of what committing would do — new
        rows, exact duplicates, near-duplicates and rows that cannot be accepted
        — the detected column mapping for a CSV, a small sample of parsed rows,
        and, when the file's dates are ambiguous between `dd/MM/yyyy` and
        `MM/dd/yyyy`, the **candidate formats with the sample values that make
        them ambiguous**. The member picks one and sends it back on the commit;
        the server never guesses silently between the two.

        **The file and the account must be the same kind.** `POST /v1/accounts`
        accepts `SIMPLEFIN`, `OFX`, `CSV` and `MANUAL`, and only an account of
        the file's own kind can take an import: a CSV may be uploaded against a
        `CSV` account and an OFX file against an `OFX` account. Anything else is
        refused here, at upload, rather than being previewed and then failing at
        commit — the commit resolves its parser from the account, so a mismatched
        batch could never be committed and, because undo requires a committed
        batch, could never be cleaned up either.

        413 `upload-too-large` is the upload exceeding one of three ceilings —
        the container's multipart cap, the import's own per-file cap, or the
        household's total allowance for uploads not yet committed or swept — the
        last two checked against the declared part size before the body is read.
        400 `validation-error` covers everything else the upload can be refused
        for: a content type this operation does not accept, a file whose bytes
        are not the format they claim to be, a zip or gzip wrapper, more rows
        than the row cap allows, a CSV whose header cannot be mapped, a missing
        `accountId` on a CSV, or an `accountId` naming an account of another
        kind.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The CSV, OFX or QFX file. Its declared content type must be
                    one this server accepts (`text/csv`, `text/plain`,
                    `application/csv`, `application/vnd.ms-excel`,
                    `application/x-ofx`, `application/x-qfx`, `application/ofx`
                    or `application/octet-stream`) **and** its first bytes must
                    match the format it claims to be.
                accountId:
                  type: string
                  format: uuid
                  description: |
                    The account these rows belong to. Required for CSV; for OFX
                    it overrides the account the file's own `ACCTID` would
                    resolve to.
                sourceKind:
                  $ref: '#/components/schemas/ImportSourceKind'
      responses:
        '201':
          description: |
            The batch, in status `PREVIEW`, and what committing it would do.
            No transaction has been written.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}/preview:
    get:
      operationId: getImportPreview
      tags: [Imports]
      summary: Re-read an uploaded batch's preview
      description: |
        The same body `POST /v1/imports` answered with, so a client that lost the
        first response — a reload, a second device — can pick the batch up again.

        For a batch still in `PREVIEW` the file is re-read and re-classified
        against the ledger **as it is now**, so the counts are current rather than
        remembered: a row that another member has since entered by hand shows up
        as a duplicate here. For a batch that has been committed or undone the
        stored counts are returned, `rows` is empty and `warnings` says why —
        the uploaded file is kept only while the batch can still be undone.

        `409` when a `PREVIEW` batch no longer has its stored file, and `400` when
        that file no longer parses, which is what the parser's reason says.

        Resolved inside the caller's own household, so an id belonging to another
        household is 404 and never 403.
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The batch and its preview.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}/commit:
    post:
      operationId: commitImport
      tags: [Imports]
      summary: Write an uploaded batch into the ledger
      description: |
        Inserts the rows the preview described, through the **same pipeline a bank
        sync uses**: the account is claimed, the file is read outside any
        transaction, one short transaction writes the batch, and a `sync_log` row
        records what happened. Every row it inserts is stamped with this batch's
        id, which is what makes `DELETE /v1/imports/{id}` able to take them back
        out again.

        **The optional body supersedes the detected mapping.** That is the whole
        reason there is no separate "update the mapping" route: the member adjusts
        what the preview offered — a column the sniffer guessed wrong, or the
        date format it could not choose between — and sends the adjustment with
        the commit. Fields the body omits keep their detected values. The mapping
        that was actually used is stored on the batch, so the commit is
        reproducible from the row alone.

        409 `conflict` means the batch is not in `PREVIEW`: it has already been
        committed, or it has been undone. Committing twice is refused rather than
        deduplicated, because the second attempt is a mistake and answering 200
        would hide it.
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequest'
      responses:
        '200':
          description: |
            The sync run the commit wrote. `transactionsNew` is how many rows
            entered the ledger; `transactionsSkipped` is how many were already
            there.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}:
    delete:
      operationId: undoImport
      tags: [Imports]
      summary: Undo a committed import
      description: |
        Removes the rows **this batch inserted and that nobody has touched
        since**, then marks the batch `UNDONE` and deletes the stored upload.

        It is deliberately not a blanket delete by batch id. A row that a member
        has edited — enriched with notes, given a pinned category, or entered by
        hand — is left exactly where it is, still carrying this batch's id as the
        record of where it came from. The counts on the batch are not rewritten
        either: they say what the commit did, and the batch's status says what
        happened to it afterwards.

        409 `conflict` means the batch was never committed: a `PREVIEW` batch has
        written nothing to undo, and an `UNDONE` one has already been undone.
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The batch is `UNDONE` and the rows it inserted are gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --------------------------------------------------------- transactions (step 6)
  /v1/transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: The household's transaction ledger, filtered and paged
      description: |
        One page of the caller's household ledger. `meta` carries the totals so
        a client renders its page controls from the same fetch.

        **Paging.** `page` is zero-based. `limit` defaults to **50** and is
        capped at **500**; both bounds are stated here because a client that
        sends no `limit` (the web daily-trend hook does not) would otherwise be
        silently truncated by an unstated default.

        **Sorting.** `sort` is an allowlist, not a field expression: exactly the
        four values below. Nothing from the query string is ever concatenated
        into SQL, and anything outside the list is 400 `validation-error`.

        **`q`.** A free-text search over merchant, description and notes, served
        by a `pg_trgm` GIN index. It is a substring match, case-insensitive; it
        is not a ranking query and does not order the results.

        `from` and `to` bound `date` inclusively. `accountId` and `categoryId`
        must belong to the caller's household — one that does not simply matches
        nothing, because the household filter is applied first.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - name: limit
          in: query
          required: false
          description: |
            Rows per page. Default 50, maximum 500. A value outside the range is
            rejected rather than clamped, so a client that computed one wrongly
            is told.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 50
            example: 50
        - name: sort
          in: query
          required: false
          description: |
            `field,direction`, from the allowlist. Default `date,desc`. `date`
            ties are broken by `created_at` descending so paging is stable.
          schema:
            type: string
            enum: ['date,asc', 'date,desc', 'amount,asc', 'amount,desc']
            default: 'date,desc'
            example: 'date,desc'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on the transaction's calendar date.
          schema:
            type: string
            format: date
            example: '2026-08-01'
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on the transaction's calendar date.
          schema:
            type: string
            format: date
            example: '2026-08-31'
        - name: type
          in: query
          required: false
          description: Restricts the page to one transaction type.
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: accountId
          in: query
          required: false
          description: Restricts the page to one of the household's accounts.
          schema:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-0000000000a1
        - name: categoryId
          in: query
          required: false
          description: Restricts the page to one category.
          schema:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-0000000000d1
        - name: q
          in: query
          required: false
          description: |
            Case-insensitive substring match over merchant, description and
            notes. Blank is the same as absent.
          schema:
            type: string
            maxLength: 200
            example: coffee
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: One page of the household's ledger, with its totals in `meta`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createManualTransaction
      tags: [Transactions]
      summary: Record a transaction by hand
      description: |
        Manual entry (gap P2-13) — cash, a cheque, anything no source will ever
        report. The row is written with `manual: true`, which is what keeps a
        later sync or an import undo from overwriting or removing it.

        `accountId` must name an account of this household whose `sourceKind` is
        `MANUAL`; anything else is 409 `conflict`, because a hand-entered row on
        a synced account would be indistinguishable from a fetched one and would
        be reconciled away. An id that is not this household's is 404.

        `amount` is the absolute value and `type` carries the direction, which is
        the same convention every ingested row uses. `currency` is the account's;
        it is not accepted here.

        The row is categorised on insert by the same pipeline that categorises an
        ingested one, unless `categoryId` is given, which pins it.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTransactionRequest'
      responses:
        '201':
          description: The created transaction.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: One transaction
      description: |
        Resolved inside the caller's own household; another household's id is
        404, never 403.
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The transaction.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchTransaction
      tags: [Transactions]
      summary: Enrich one transaction
      description: |
        A true partial update: **only the fields present in the body are
        written**, and a field present with an explicit `null` clears it. That
        distinction is the whole point of the method here — unlinking a transfer
        means sending `{"transferGroupId": null}`, which is not the same request
        as one that does not mention `transferGroupId` at all.

        `categoryId` writes `transaction.category_id` **directly** and also
        upserts the `category_override` pin, so a re-sync never overwrites the
        member's decision. Both writes happen, not one: a budget aggregate reads
        the column, and an override row alone would never move envelope spend.
        The category must be one this household can see (a system category or its
        own); anything else is 400 `validation-error`.

        `transferGroupId` marks or unlinks a transfer leg by hand, alongside the
        automatic pairing job. Amount, date, account and type are not writable —
        a wrong ingested amount is a source problem, and a wrong manual one is a
        delete and a re-entry.
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatchRequest'
      responses:
        '200':
          description: The transaction after the write.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Delete a hand-entered transaction
      description: |
        Manual rows only. A row that came from a source is 409 `conflict`: it
        would reappear on the next sync, so the way to remove it is to
        disconnect the account it belongs to.
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The transaction is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----------------------------------------------------------- dashboard (step 6)
  /v1/dashboard/today:
    get:
      operationId: getDashboardToday
      tags: [Dashboard]
      summary: Today and this month, in the caller's own timezone
      description: |
        Household-scoped spending and income for today and the current calendar
        month.

        **Boundaries are the caller's, not the container's** (gap P2-15). "Today"
        and "this month" are computed from `users.timezone` through `UserClock`,
        so a Vancouver member's evening purchase lands on today's figure rather
        than tomorrow's, and the month rolls over at their local midnight rather
        than at 16:00 on the 31st. `date` and `timezone` say which day, in which
        zone, the numbers describe.

        **Currencies are not converted.** `byCurrency` carries a subtotal per
        currency actually present in the ledger; the headline fields repeat the
        subtotal for the caller's own `users.currency`, and are zero when the
        household has nothing in it. There is no exchange rate anywhere in this
        product, so adding CAD to USD is never done.

        **Transfer legs are excluded** from every figure here (gap P2-14): moving
        money from chequing to a credit card is not spending and not income.
      parameters:
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The caller's dashboard figures.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardTodayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --------------------------------------------------------------- net worth
  # Collapse step 9 (docs/recovery/06-COLLAPSE-PLAN.md §4.7, §6 "Net worth"). Money on the wire
  # is always MoneyAmount / CurrencyCode — no second money or currency schema is invented here.
  /v1/networth/series:
    get:
      operationId: getNetWorthSeries
      tags: [Net Worth]
      summary: Net-worth history, one series per currency
      description: |
        A time series of the household's `net_worth_snapshot` rows over the
        requested range, grouped by currency (F2: a household holding both CAD
        and USD positions never has its currencies added together — there is
        no exchange rate anywhere in this system). `primaryCurrency` is the
        caller's own `users.currency`, never a literal.

        **This route only reads.** Unlike the pre-collapse service, a range
        with no snapshots in it does not take one as a side effect: `series`
        is simply an empty array, and the client is not told data was captured
        at a time it was not. `POST /v1/networth/snapshot` and the daily job
        are the only writers.

        Points within each series are ordered oldest first.
      parameters:
        - name: range
          in: query
          required: false
          description: |
            The window to report. `3M`, `6M` and `1Y` reach back 90, 180 and
            365 days from the caller's own today; `ALL` reaches back to
            2000-01-01. Any other value is 400 `validation-error`, which is why this is a real enum rather
            than a free string.
          schema:
            $ref: '#/components/schemas/NetWorthRange'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The household's net-worth series, one per currency present.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NetWorthSeriesResponse'
        '400':
          $ref: '#/components/responses/QueryRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/networth/snapshot:
    post:
      operationId: takeNetWorthSnapshot
      tags: [Net Worth]
      summary: Take a net-worth snapshot now
      description: |
        Sums the household's current asset values and liability balances,
        grouped by currency, and writes ONE `net_worth_snapshot` ROW PER
        CURRENCY PRESENT (F2) — never one blended total. A household with no
        assets and no liabilities in any currency gets an empty result: there
        is no currency to report and none is invented.

        The snapshot date is a LOCAL date resolved through the household's own
        boundary (never the container's UTC clock), and re-running this on the
        same local date UPDATES the existing row(s) for that date rather than
        failing on the unique key or creating a second set — this operation
        and the daily `networth-daily-snapshot` job are the same write, only
        the trigger differs, so pressing the button after the job already ran
        today changes nothing surprising.
      parameters:
        - $ref: '#/components/parameters/RequestedWithHeader'
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfCookie'
        - $ref: '#/components/parameters/AccessCookie'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: |
            The snapshot row(s) just written or updated, one per currency
            present. A bare array; not paged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NetWorthSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

