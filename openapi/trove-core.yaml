      description: |
        Identical to `DELETE /v1/me`, with the same body, the same step-up, the
        same last-`ADMIN` refusal and the same effect.

        Two verbs for one action because a `DELETE` that carries a request body
        is legal but poorly supported: RFC 9110 leaves its semantics undefined
        and intermediaries — proxies, some CDNs, a few HTTP clients — drop the
        body without saying so. The step-up here needs a password or a code, so a
        dropped body turns a deliberate, irreversible decision into an
        unexplained 403. The same pair already exists for `DELETE /v1/auth/totp`
        and `POST /v1/auth/totp/disable`, for the same reason. **This is the one
        that always works.**
      parameters:
