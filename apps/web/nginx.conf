# Static server for the Trove SPA.
#
# Routing note (plan §1.4, `deploy/docker-compose.yml`): Traefik owns `/api`.
# The `trove-api` router matches `Host(TROVE_DOMAIN) && PathPrefix('/api')` at
# priority 100 (and `/api/v1/auth` at 200 for the tighter auth rate limit) and
# sends it straight to `trove-core:8080`; the `trove-web` router takes everything
# else and sends it here. An `/api/` proxy in this file would therefore never be
# reached — it was a second, silently divergent copy of the routing table, so it
# is gone, and with it the `/oauth2/`, `/login/oauth2/` and `/logout` locations:
# Spring generates those under the `/api` context path now
# (`/api/oauth2/authorization/oidc`, `/api/login/oauth2/code/oidc`), which the
# one Traefik rule already covers.
#
# Security headers are NOT set here. Traefik's `security-headers@file` and
# `csp-web@file` middlewares (`deploy/traefik/dynamic/middlewares.yml`) already
# emit HSTS, CSP, `X-Content-Type-Options`, `X-Frame-Options`,
# `Referrer-Policy` and `Permissions-Policy` on every response from this router.
# Repeating them here produces duplicate headers, and a duplicate CSP is
# intersected by the browser — two "equivalent" policies that drift apart become
# a policy neither file describes.

server {
  listen 80;
  server_name _;

  # Hide nginx version in the Server header and default error pages.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json;
  gzip_min_length 1000;

  # Kept for a deployment that puts this container in front of trove-core
  # directly, without Traefik (local `vite preview`-style stacks, or a reverse
  # proxy that does not route `/api` itself). Docker's embedded DNS plus a
  # variable in `proxy_pass` is what lets nginx boot before trove-core is
  # resolvable and resolve at request time (502 if absent) instead of refusing
  # to start.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_gateway "trove-core";

  # Hashed, content-addressed build output: safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The SPA shell must never be cached, or a deploy strands clients on an
  # index.html that references deleted asset hashes.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback — every client-side route (/login, /invite/:token, /settings,
  # and the catch-all 404) is served the same shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
